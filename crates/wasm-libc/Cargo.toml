[package]
name = "fun-refactor-wasm-libc"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The libc tree-sitter's C needs on wasm32-unknown-unknown"
publish = false

# The analysis crate forbids unsafe outright, and that is worth keeping. Raw pointers
# are the whole job here, so the exception lives in its own crate where it is a
# hundred lines that can be read in one sitting instead of a hole in a guarantee.
[lints.rust]
unsafe_code = "allow"
