[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-refactor-ir"
dynamic = ["version"]
description = "Typed semantic IR and structured agent runtime for fun-refactor"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"

[project.optional-dependencies]
test = ["pytest==9.1.1", "build==1.6.1"]

[tool.setuptools.dynamic]
version = {attr = "fr_ir._version.VERSION"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fr_ir = ["py.typed"]
