[package]
name = "fun-refactor-python-grammar"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "The Python grammar, patched to read star expressions and type parameter defaults"
publish = false
build = "build.rs"

# The analysis crate forbids unsafe outright, and that is worth keeping. A tree-sitter
# language is a C function pointer, so the exception lives here.
[lints.rust]
unsafe_code = "allow"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"
