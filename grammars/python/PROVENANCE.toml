# Where this grammar came from, and what was changed in it.
#
# `star-expressions-and-type-defaults.patch` is the diff against the upstream
# `grammar.js` named below. Re-apply it when taking a newer release, and regenerate
# `src/parser.c` with the `tree-sitter` CLI.

language = "python"
upstream = "https://github.com/tree-sitter/tree-sitter-python"
tag = "v0.25.0"
archive = "https://github.com/tree-sitter/tree-sitter-python/archive/refs/tags/v0.25.0.tar.gz"
archive_sha256 = "4609a3665a620e117acf795ff01b9e965880f81745f287a16336f4ca86cf270c"
license = "MIT"
license_file = "LICENSE"
generated_with = "tree-sitter-cli 0.26.13"

[[patch]]
subject = "a starred element in an unparenthesised tuple"
rule = "expression_list"
change = "each element takes choice($.expression, $.list_splat), as Python's star_expressions does"
accepts = ["g = 1, *[2]", "g = 1, *(2,)", "g = 1, *{2}", 'g = 1, *"ab"', "return 1, *rest"]

[[patch]]
subject = "a type parameter default"
rule = "type_parameter"
change = "each parameter takes an optional `= type`, which PEP 696 added in Python 3.13"
accepts = ["type A[T = int] = float"]
