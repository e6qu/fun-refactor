# Where this grammar came from, and what was changed in it.
#
# `src/parser.c` is the published grammar with the patch below applied, regenerated by
# the `tree-sitter` CLI this build pins. It is regenerated rather than taken from
# crates.io because the crate there links tree-sitter 0.25 and this workspace links
# 0.26, and two crates cannot both claim `links = "tree-sitter"`.
#
# Re-apply the patch when taking a newer release, and regenerate `src/parser.c`.

# `src/scanner.c` carries a change of its own, recorded under `[[scanner]]` below.

# `src/parser.c` is 48 MB, and committed on purpose. `grammars/README.md` has the
# measurement and the reasoning: git packs it to 2.68 MB, and generating it at build
# time instead would make the tree-sitter CLI a hard dependency of every clone. The
# patch below accounts for 4 MB of the source and 0.22 MB of the packed size.

language = "lean"
upstream = "https://github.com/wvhulle/tree-sitter-lean"
archive = "https://crates.io/api/v1/crates/tree-sitter-lean4/0.3.0/download"
archive_sha256 = "5e4754e1403ae141b9e66c49c0374f09f87122f6b03c41c624c84ab890966d8a"
crate_version = "0.3.0"
grammar_version = "0.2.2"
license = "MIT"
generated_with = "tree-sitter-cli 0.26.13"

[[patch]]
subject = "a declaration's name as one node"
rule = "qualified_name"
change = "`definition`, `constant`, `opaque`, `axiom` and `constructor` take a visible `qualified_name` where they took the hidden `_name`"
accepts = ["def Box.get (self : Box) : Int := self.value"]
why = "a hidden rule gives its parts the field that held it, so `def Box.get` had two `name` fields and a query binds a field once; the declaration indexed under `Box`"

[[patch]]
subject = "a mutual block"
rule = "mutual"
change = "`mutual <declaration>+ end`, added to `_command`; upstream has no rule for it"
accepts = ["mutual def a : Int := 1  def b : Int := 2  end"]
why = "the only form Lean has for a cycle, and this build's writer emits one whenever the declaration order it computes finds one"

# Upstream declares MIT in three places and publishes no licence text, so there is no
# file to copy here. A reader who needs the terms has the declaration and its sources.
[license_declaration]
crate_manifest = "https://crates.io/crates/tree-sitter-lean4/0.3.0"
grammar_manifest = "tree-sitter.json, metadata.license"
readme = "https://github.com/wvhulle/tree-sitter-lean#license"
authors = ["Julian Berman", "Willem Vanhulle"]
note = "no LICENSE file exists upstream; nothing here fabricates one"

[[patch]]
subject = "every layout end a dedent gives, where an `else` follows"
rule = "_do_then_else"
change = "`repeat($._layout_end)` before `else`, inside the branch that takes one, and a declared conflict so GLR chooses by what follows"
accepts = ["if d == 1 then\n  return \"a\"\nelse if d == 2 then\n  return \"b\"\nelse\n  return \"c\""]
why = "the `else` of a chain sits at the outermost `if`'s column, so the dedent that reaches it ends every `then` block between; taking one left the rest for the application above, which took the `else` as an argument"

[[scanner]]
subject = "the indent a comment line reports"
change = "`measure_indent` skips comment lines and measures the next line that carries something"
why = "a comment is an extra, not an element, so its column kept a block open past its last statement and the declaration after it landed inside"

[[scanner]]
subject = "the layout semicolon before a continuation word"
change = "`should_suppress_semicolon` covers `else`, `catch` and `finally` as well as `|`"
why = "each continues the construct above it rather than opening an element beside it, so the semicolon turned the `else` of a `do`-level `if` into an application of a name called `else`"
