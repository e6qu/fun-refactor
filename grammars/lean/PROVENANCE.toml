# Where this grammar came from, and what was changed in it.
#
# `src/parser.c` is the published grammar with the patch below applied, regenerated by
# the `tree-sitter` CLI this build pins. It is regenerated rather than taken from
# crates.io because the crate there links tree-sitter 0.25 and this workspace links
# 0.27, and two crates cannot both claim `links = "tree-sitter"`.
#
# Re-apply the patch when taking a newer release, and regenerate `src/parser.c`.

# `src/scanner.c` carries a change of its own, recorded under `[[scanner]]` below.

# Keep generated parser code committed so builds need a C compiler, not a generator.
# Source size, compressed downloads and browser bundle cost are different measurements.
# `grammars/README.md` explains what to measure when changing these rules.

language = "lean"
upstream = "https://github.com/wvhulle/tree-sitter-lean"
archive = "https://crates.io/api/v1/crates/tree-sitter-lean4/0.3.0/download"
archive_sha256 = "5e4754e1403ae141b9e66c49c0374f09f87122f6b03c41c624c84ab890966d8a"
crate_version = "0.3.0"
grammar_version = "0.2.2"
license = "MIT"
generated_with = "tree-sitter-cli 0.27.0"

[[patch]]
subject = "a declaration's name as one node"
rule = "qualified_name"
change = "`definition`, `constant`, `opaque`, `axiom` and `constructor` take a visible `qualified_name` where they took the hidden `_name`"
accepts = ["def Box.get (self : Box) : Int := self.value"]
why = "a hidden rule gives its parts the field that held it, so `def Box.get` had two `name` fields and a query binds a field once; the declaration indexed under `Box`"

[[patch]]
subject = "a mutual block"
rule = "mutual"
change = "`mutual <declaration>+ end`, added to `_command`; upstream has no rule for it"
accepts = ["mutual def a : Int := 1  def b : Int := 2  end"]
why = "the only form Lean has for a cycle, and this build's writer emits one whenever the declaration order it computes finds one"

# Upstream declares MIT in three places and publishes no licence text, so there is no
# file to copy here. A reader who needs the terms has the declaration and its sources.
[license_declaration]
crate_manifest = "https://crates.io/crates/tree-sitter-lean4/0.3.0"
grammar_manifest = "tree-sitter.json, metadata.license"
readme = "https://github.com/wvhulle/tree-sitter-lean#license"
authors = ["Julian Berman", "Willem Vanhulle"]
note = "no LICENSE file exists upstream; nothing here fabricates one"

[[patch]]
subject = "every layout end a dedent gives, where an `else` follows"
rule = "_do_then_else"
change = "`repeat($._layout_end)` before `else`, inside the branch that takes one, and a declared conflict so GLR chooses by what follows"
accepts = ["if d == 1 then\n  return \"a\"\nelse if d == 2 then\n  return \"b\"\nelse\n  return \"c\""]
why = "the `else` of a chain sits at the outermost `if`'s column, so the dedent that reaches it ends every `then` block between; taking one left the rest for the application above, which took the `else` as an argument"

[[scanner]]
subject = "the indent a comment line reports"
change = "`measure_indent` skips comment lines and measures the next line that carries something"
why = "a comment is an extra, not an element, so its column kept a block open past its last statement and the declaration after it landed inside"

[[scanner]]
subject = "keep minus signs and arithmetic continuations"
change = "preserve the first operator when checking for comments, and keep infix continuations attached to binding values"
why = "a negative return value must retain its minus sign; after `let value := n`, a following line `- 1` continues the value unless a semicolon ends it"

[[scanner]]
subject = "the layout semicolon before a continuation word"
change = "`should_suppress_semicolon` covers `else`, `catch` and `finally` as well as `|`"
why = "each continues the construct above it rather than opening an element beside it, so the semicolon turned the `else` of a `do`-level `if` into an application of a name called `else`"

[[scanner]]
subject = "distinguish a binding body from a wrapped proof argument"
change = "`BINDING_START` records the binding keyword's column; a layout end separates its value from the following body or statement, and ordinary layout semicolons require equal indentation"
why = "a term `let` inside an `if` needs its body separator, but a more-indented argument after `have bound := f` must continue the call; treating both as new proof steps hid following declarations"

[[scanner]]
subject = "inline proofs inside constructor tuples"
change = "commas and the closing angle bracket can close an inline proof's layout"
why = "in `⟨by exact hp, by exact hq⟩`, the first comma ends one proof and the closing bracket ends the other"

[[patch]]
subject = "split an either-or assumption without extra parentheses"
rule = "rcases_alternative_pattern"
change = "accept balanced parenthesized alternatives and bare alternatives, with precedence above a single atom"
accepts = ["rcases invalid with left | right", "rcases invalid with (left | right)"]
why = "Lean accepts both forms; requiring parentheses rejected the page-count proof before Lean could check it"

[[patch]]
subject = "proof locations and equality transport"
rule = "tactic_apply, tactic_rewrite, binary_expression"
change = "accept tactic locations such as `at h ⊢` and the right-associative equality-transport operator `▸`; a generic tactic takes one term, which can itself be an application"
accepts = ["simp only [Nat.add_zero] at h", "exact Nat.add_comm a b ▸ h", "intro x y"]
why = "valid proof steps must reach Lean for checking; repeating complete terms also admitted competing partitions of the same application and added unnecessary parser states"

[[patch]]
subject = "constructor cases with labels and generalized variables"
rule = "tactic_cases, application"
change = "accept an equation label, ordinary applied subjects and `generalizing` binders; share function-call syntax with expressions"
accepts = ["cases h : chooseNumber flag with | zero => omega | succ n => omega", "induction xs generalizing n with | nil => rfl | cons head tail ih => rfl"]
why = "the omitted forms are ordinary Lean proof steps; losing them also disrupted recovery of later declarations"

[[patch]]
subject = "term bindings and function heads"
rule = "_binding_body, _application_head"
change = "term bindings require their following body; low-precedence expressions and calls with final block arguments need parentheses when used as function heads; fields and subscripts attach to an argument unless the application is parenthesized"
accepts = ["let count := n; count + 1", "(fun n : Nat => n + 1) 2"]
why = "standalone bindings already have tactic and do-statement rules, and an unparenthesized proof block must not become a function applied to the next proof step"

[[patch]]
subject = "final lambda and do arguments"
rule = "application, _block_application"
change = "unparenthesized lambda and do arguments terminate an application; if, match and by arguments require parentheses"
accepts = ["Id.run do pure 1", "id (by rfl)"]
why = "Lean rejects `id by rfl` and corresponding bare if and match arguments; admitting them as repeatable function heads multiplied parser contexts and let proof steps escape their block"

[[patch]]
subject = "the do after an iterable or condition opens its statement body"
rule = "for_in, do_while, do_unless, _do_body_start"
change = "mark the do keyword belonging to a statement body before it can be consumed as a function argument"
accepts = ["for left in [false, true] do IO.println left", "while i < 3 do i := i + 1", "unless i = 3 do IO.println i"]
why = "treating the body's do as an argument rejected valid for, while and unless statements; one marker preserves that boundary without duplicating all expression rules"

[[scanner]]
subject = "a keyword prefix is still an identifier"
change = "use the grammar's complete identifier-continuation set when recognizing layout keywords"
why = "elseValue, catchValue and finallyValue begin new expressions; they must not be mistaken for else, catch or finally"

[[patch]]
subject = "control keywords cannot become ordinary arguments"
rule = "reserved, projection, qualified_name, quoted_name"
change = "reserve if, then, else, match, with and by in ordinary code; qualified member names keep their name context, and quoted names admit explicitly escaped identifiers"
accepts = ["KeywordNames.if", "id (by rfl)"]
why = "when an if or by argument was misplaced, keyword extraction previously reclassified its words as identifiers and accepted the invalid sequence"

[[patch]]
subject = "unparenthesized typed lambda binders"
rule = "fun"
change = "allow a type annotation after the lambda's binders"
accepts = ["fun n : Nat => n + 1", "fun n m : Nat => n + m", "fun f : Nat → Nat => f 1"]
why = "Lean accepts the annotation without binder parentheses; the reader previously reported the colon as a syntax error"
