[package]
name = "fun-refactor-typescript-grammar"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "The TypeScript and TSX grammars, patched to read import types and a member called `in`"
publish = false
build = "build.rs"

# The analysis crate forbids unsafe outright, and that is worth keeping. A tree-sitter
# language is a C function pointer, so the exception lives here, in the ten lines that
# hand it over.
[lints.rust]
unsafe_code = "allow"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"
