name: Selected native agents and checked M1 results
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m1-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clients:
    name: Pinned client settings and report checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            sdk/python/src
            tests/agent-eval/selected-agents
            tests/agent-eval/project-edits
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Check the complete M1 attempt schedule without model calls
        shell: bash
        run: >-
          python3 -B -m unittest discover -s tools/agent_eval -p 'test_selected*.py' -v
          2>&1 | tee "$RUNNER_TEMP/m1-unit-tests.log"
      - run: python3 -B tools/selected-agent-probe.py --output "$RUNNER_TEMP/m1-clients"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1-client-probe
          path: ${{ runner.temp }}/m1-clients/report.json
          if-no-files-found: error
          retention-days: 30
  tasks:
    name: Original M1 rename, Unicode and proof checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            tests/agent-eval/selected-agents/local-results
      - name: Preserve the public patches and current report checker
        run: |
          cp -R tests/agent-eval/selected-agents/local-results "$RUNNER_TEMP/m1-public"
          mkdir -p "$RUNNER_TEMP/m1-report-tools/agent_eval"
          cp tools/agent_eval/selected_plan.py tools/agent_eval/selected_report.py \
            "$RUNNER_TEMP/m1-report-tools/agent_eval/"
      - uses: actions/checkout@v7
        with:
          # Preserve the study's original source and checker instead of rewriting
          # historical results whenever the next milestone changes fr.
          ref: ea21616476e4352e4e240d62b56387c277396532
          persist-credentials: false
          sparse-checkout: |
            .github
            src
            crates
            grammars
            queries
            catalogs
            kernels
            tools
            sdk/python/src
            skills/fr
            tests/agent-eval/selected-agents
            tests/agent-eval/project-changes
            tests/agent-eval/python-repositories
            tests/agent-eval/unknown-target
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Reject harness errors before installing tools or building
        run: python3 -B -m unittest discover -s tools/agent_eval -p 'test_selected*.py' -v
      - name: Install the exact grader wheels
        shell: bash
        run: |
          grep -E '/(pytest|pluggy|packaging|iniconfig|pygments)-' \
            .github/actions/native-tools/python-wheels.txt > "$RUNNER_TEMP/m1-python-wheels.txt"
          test "$(wc -l < "$RUNNER_TEMP/m1-python-wheels.txt")" -eq 5
          python3 -m pip install --no-index --no-deps --require-hashes \
            --requirement "$RUNNER_TEMP/m1-python-wheels.txt"
          python3 -m pytest --version
      - uses: ./.github/actions/lean-toolchain
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: m1-controls
      - run: cargo build --locked --bin fr
      - name: Check the installed fr support before choosing operations
        run: |
          target/debug/fr --json audit > "$RUNNER_TEMP/m1-fr-audit.json"
          target/debug/fr --json capabilities > "$RUNNER_TEMP/m1-fr-capabilities.json"
      - name: Run task checks serially with known correct and incorrect changes
        run: |
          for task in boltons-rename unicode-dice access-proof; do
            python3 -B -m agent_eval.selected_tasks --task "$task" --fr target/debug/fr \
              --output "$RUNNER_TEMP/m1-tasks/$task"
          done
      - name: Exercise real native tool results with scripted replies and no external network
        run: >-
          python3 -B -m agent_eval.selected_native --fr target/debug/fr
          --output "$RUNNER_TEMP/m1-native"
      - name: Reject wrong changes and deliver correct patches inside private containers
        run: >-
          python3 -B -m agent_eval.selected_grading --fr target/debug/fr
          --output "$RUNNER_TEMP/m1-private-grading"
      - name: Independently check retained local CLI attempts and their submitted patches
        run: >-
          python3 -B -m agent_eval.selected_local_grade
          --data "$RUNNER_TEMP/m1-public" --fr target/debug/fr
          --output "$RUNNER_TEMP/m1-live-grading" --completion complete
      - name: Require the public report to match every checked outcome
        env:
          PYTHONPATH: ${{ runner.temp }}/m1-report-tools
        run: >-
          python3 -B -m agent_eval.selected_report
          --data "$RUNNER_TEMP/m1-public" --checks "$RUNNER_TEMP/m1-live-grading/summary.json" --mode check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1-task-controls
          path: |
            ${{ runner.temp }}/m1-tasks/*/result.json
            ${{ runner.temp }}/m1-native/summary.json
            ${{ runner.temp }}/m1-native/*/result.json
            ${{ runner.temp }}/m1-native/*/native/result.json
            ${{ runner.temp }}/m1-native/*/native/native.stdout
            ${{ runner.temp }}/m1-native/*/native/native.stderr
            ${{ runner.temp }}/m1-native/*/native/api/server.stdout
            ${{ runner.temp }}/m1-native/*/native/api/server.stderr
            ${{ runner.temp }}/m1-private-grading/summary.json
            ${{ runner.temp }}/m1-live-grading/summary.json
          if-no-files-found: error
          retention-days: 30
