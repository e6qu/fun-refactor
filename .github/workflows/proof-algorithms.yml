name: Executable Lean algorithms
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: proof-algorithms-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: tools:sdk/python/src
  PYTHONDONTWRITEBYTECODE: '1'
  FR_LEAN_JOBS: '1'
  LEAN_NUM_THREADS: '1'
  RAYON_NUM_THREADS: '1'
jobs:
  qualify:
    name: Reject incomplete proofs of the fixed GCD implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: ./.github/actions/lean-toolchain
      - name: Check evaluator boundaries and axiom accounting
        run: python3 -B -m unittest agent_eval.test_proof_algorithms
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: m3-proof-writing
          cache-on-failure: true
      - name: Check recursive syntax and compile the current command
        run: |
          lean -j1 -DwarningAsError=true tests/fixtures/lean-recursive-algorithms.lean
          cargo test --locked --test lean --test lean_grammar -- --test-threads=1
          cargo build --locked --bin fr
      - name: Check references, interactive feedback and rejected patches
        run: >-
          python3 -B -m agent_eval.proof_algorithms --fr target/debug/fr
          --output "$RUNNER_TEMP/algorithm-controls"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: algorithm-qualification
          path: |
            ${{ runner.temp }}/algorithm-controls/controls.json
            ${{ runner.temp }}/algorithm-controls/inputs
            ${{ runner.temp }}/algorithm-controls/*-state.json
            ${{ runner.temp }}/algorithm-controls/*-check.json
            ${{ runner.temp }}/algorithm-controls/grade-*/check/*.json
            ${{ runner.temp }}/algorithm-controls/verdict-*.json
          if-no-files-found: error
          retention-days: 30
