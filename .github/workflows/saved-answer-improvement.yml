name: Find and reduce saved answer costs
# Keep the project path identical across SDKs; project identities include it.
on:
  push:
    branches: [perf/batched-answer-storage]
    paths: [.github/workflows/saved-answer-improvement.yml]
  workflow_dispatch:
    inputs:
      phase:
        description: Measure both implementations or publish a completed comparison
        required: true
        type: choice
        options: [measure, publish]
      collection_run:
        description: Successful measurement run to publish
        type: string
        required: false
  pull_request:
    paths:
      - 'sdk/python/src/**'
      - 'sdk/python/tests/test_ir.py'
      - 'tools/saved-answer-comparison.py'
      - 'tools/test-saved-answer-comparison.py'
      - 'tools/profile-saved-answers.py'
      - 'tools/retain-saved-answer-comparison.py'
      - 'tests/agent-eval/saved-answer-improvement/**'
      - 'tests/agent-eval/batched-answer-storage/**'
      - '.github/workflows/saved-answer-improvement.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: saved-answer-improvement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    if: github.event_name == 'push' || inputs.phase == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: python3 -m pip install 'pytest==9.1.1'
      - name: Check addresses, corruption rejection and verification work
        run: |
          PYTHONPATH=sdk/python/src python3 -B -m pytest -q sdk/python/tests/test_ir.py sdk/python/tests/test_runtime.py
          PYTHONPATH=sdk/python/src python3 -B -m pytest -q sdk/python/tests/test_object_store.py
          python3 -B tools/test-saved-work-cost.py
          python3 -B tools/test-saved-answer-comparison.py
      - name: Profile the retained real answers without native rebuilds
        run: python3 -B tools/profile-saved-answers.py --output "$RUNNER_TEMP/saved-answer-profile.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: saved-answer-profile
          path: ${{ runner.temp }}/saved-answer-profile.json
          if-no-files-found: error
          retention-days: 30
  compare:
    if: github.event_name == 'push' || inputs.phase == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [profile, original]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: saved-work-cost-release
      - run: cargo build --locked --release --bin fr
      - name: Check storage consumers with the compiled executable
        run: |
          python3 -m pip install 'pytest==9.1.1'
          mkdir -p target/debug
          ln -sf ../release/fr target/debug/fr
          PYTHONPATH=sdk/python/src python3 -B -m pytest -q \
            sdk/python/tests/test_flow_storage.py sdk/python/tests/test_investigation.py \
            sdk/python/tests/test_flow.py sdk/python/tests/test_flow_facts.py \
            sdk/python/tests/test_compiler_evidence.py sdk/python/tests/test_semantic_evidence.py \
            sdk/python/tests/test_correspondence.py
      - name: Use fr to inspect the storage API it is helping improve
        run: >-
          target/release/fr --json -C sdk/python project find DirectoryObjectStore
          --source --bytes 4096 --limit 16 --in src > "$RUNNER_TEMP/storage-api.json"
      - uses: actions/upload-artifact@v7
        with:
          name: saved-answer-api-review
          path: ${{ runner.temp }}/storage-api.json
          if-no-files-found: error
          retention-days: 30
      - name: Compare both SDKs with the same optimized native executable
        run: >-
          python3 -B tools/saved-answer-comparison.py
          --collect "$RUNNER_TEMP/answer-comparison" --fr target/release/fr
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: saved-answer-comparison
          path: ${{ runner.temp }}/answer-comparison
          if-no-files-found: error
          retention-days: 30
  original:
    name: Original saved answer comparison
    if: github.event_name != 'workflow_dispatch' || inputs.phase == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            tests/agent-eval/saved-work-cost
            tests/agent-eval/results/2026-10-21-saved-work-39531778541
      - name: Preserve the declared original identity
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          record = json.loads(Path('tests/agent-eval/saved-work-cost/record.json').read_text())
          path = Path(record['directory']) / 'result.json'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == record['sha256']
          Path(os.environ['RUNNER_TEMP'], 'original-cost-sha256').write_text(record['sha256'])
          PY
      - uses: actions/checkout@v7
        with:
          ref: c431636b9b9203f5a08aa682e0a1530b22850ad9
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Audit the unchanged first evaluation beside its original SDK
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          record = json.loads(Path('tests/agent-eval/saved-work-cost/record.json').read_text())
          directory = Path(record['directory'])
          assert hashlib.sha256((directory / 'result.json').read_bytes()).hexdigest() == Path(os.environ['RUNNER_TEMP'], 'original-cost-sha256').read_text()
          subprocess.run(['python3', '-B', 'tools/saved-work-cost.py', '--audit', str(directory)], check=True)
          PY
  audit:
    name: Current saved answer comparison
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: |
          python3 -B tools/test-saved-answer-comparison.py
          python3 -B - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          record = json.loads(Path('tests/agent-eval/batched-answer-storage-release/record.json').read_text())
          directory = Path(record['directory'])
          assert hashlib.sha256((directory / 'result.json').read_bytes()).hexdigest() == record['sha256']
          subprocess.run(['python3', '-B', 'tools/saved-answer-comparison.py', '--audit', str(directory)], check=True)
          PY
  previous:
    name: Earlier hashing comparison
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            tests/agent-eval/saved-answer-improvement
            tests/agent-eval/results/2026-10-21-saved-answer-39561749625
      - name: Preserve the earlier measurement identity
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          record = json.loads(Path('tests/agent-eval/saved-answer-improvement/record.json').read_text())
          path = Path(record['directory']) / 'result.json'
          assert hashlib.sha256(path.read_bytes()).hexdigest() == record['sha256']
          Path(os.environ['RUNNER_TEMP'], 'earlier-cost-sha256').write_text(record['sha256'])
          PY
      - uses: actions/checkout@v7
        with:
          ref: cc5e27808744516504c349c1bb7351800a0a271b
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Audit the unchanged hashing comparison beside its measured SDK
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          record = json.loads(Path('tests/agent-eval/saved-answer-improvement/record.json').read_text())
          directory = Path(record['directory'])
          assert hashlib.sha256((directory / 'result.json').read_bytes()).hexdigest() == Path(os.environ['RUNNER_TEMP'], 'earlier-cost-sha256').read_text()
          subprocess.run(['python3', '-B', 'tools/saved-answer-comparison.py', '--audit', str(directory)], check=True)
          PY
  publish:
    if: inputs.phase == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Publish authenticated results and reconcile tracking
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
        run: |
          python3 -B tools/retain-saved-answer-comparison.py
          python3 -B tools/roadmap-status.py --write
          python3 -B tests/agent-eval/test_roadmap_status.py
          python3 -B tools/review-docs.py
          python3 -B tools/check-prose.py
      - name: Commit the results and reviewed tracking
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/batched-answer-storage.md tests/agent-eval/batched-answer-storage-release \
            tests/agent-eval/roadmap.json docs/roadmap-status.json docs/roadmap-status.md tools/PROSE-DEBT
          git commit -m 'docs: publish saved answer costs and reconcile current evidence'
          git push origin "HEAD:refs/heads/$BRANCH"
