name: Python cleanup paths
on:
  push:
    branches: [feat/python-exception-paths]
    paths:
      - src/**
      - sdk/python/src/**
      - sdk/python/tests/**
      - tests/agent-eval/python-finally/**
      - tests/fixtures/python-finally/**
      - tools/python-effects.py
      - tools/python-text-flow.py
      - .github/workflows/python-finally.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-finally-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            src
            grammars
            crates
            queries
            catalogs
            kernels
            sdk/python/src
            sdk/python/tests
            tools
            docs
            tests/fixtures
            tests/common
            tests/agent-eval/python-finally
            tests/agent-eval/python-text-flow
            tests/agent-eval/recursive-flow
            tests/agent-eval/flow-cache
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Prepare independent checks
        run: python3 -m pip install 'pytest==9.1.1'
      - name: Retain formatting differences
        run: |
          set -euo pipefail
          cargo fmt --all 2>&1 | tee "$RUNNER_TEMP/cleanup-format.log"
          git diff -- '*.rs' > "$RUNNER_TEMP/cleanup-format.patch"
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked --bin fr
      - name: Use fr to inspect its cleanup implementation
        run: |
          target/debug/fr --json --no-cache -C src/project/dataflow.rs project find invoke --source --bytes 4096 > "$RUNNER_TEMP/cleanup-code.json"
      - name: Compare cleanup with Python and check saved answers
        env:
          PYTHONPATH: ${{ github.workspace }}/sdk/python/src
        run: >-
          python3 -B -m pytest -q
          sdk/python/tests/test_finally_flow.py
          sdk/python/tests/test_flow_summaries.py
          sdk/python/tests/test_text_flow.py
          sdk/python/tests/test_runtime_effects.py
          sdk/python/tests/test_shared_named_imports.py::test_wide_named_import_fits_the_existing_response_byte_limit
          --junitxml="$RUNNER_TEMP/cleanup-tests.xml"
      - name: Keep the pinned saved-answer comparison on its declared workload
        env:
          PYTHONPATH: ${{ github.workspace }}/tools:${{ github.workspace }}/sdk/python/src
        run: |
          python3 -B - <<'PY'
          import importlib.util, tempfile
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('cache_check', 'tools/flow-cache-acceptance.py')
          cache = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cache)
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              project = root / 'project'
              cache.install(project, cache.sources('pipeline-8'))
              values = []
              for strategy in ('legacy', 'chunks'):
                  result = cache.invoke(Path('target/debug/fr'), project, root / strategy, strategy, 'cached')
                  again = cache.invoke(Path('target/debug/fr'), project, root / strategy, strategy, 'cached', result['manifest'])
                  assert result['complete'] and again['complete'] and again['reused']
                  assert result['evidence_digest'] == again['evidence_digest']
                  values.append(result['evidence_digest'])
              assert values[0] == values[1]
          PY
      - name: Check effect and text examples with ordinary Python
        run: |
          python3 -B tools/python-effects.py collect --binary target/debug/fr --output "$RUNNER_TEMP/cleanup-effects"
          python3 -B tools/python-text-flow.py collect --binary target/debug/fr --output "$RUNNER_TEMP/cleanup-text"
      - name: Require committed Rust formatting
        run: git diff --exit-code -- '*.rs'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-cleanup-paths
          path: |
            ${{ runner.temp }}/cleanup-format.patch
            ${{ runner.temp }}/cleanup-format.log
            ${{ runner.temp }}/cleanup-code.json
            ${{ runner.temp }}/cleanup-tests.xml
            ${{ runner.temp }}/cleanup-effects
            ${{ runner.temp }}/cleanup-text
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
