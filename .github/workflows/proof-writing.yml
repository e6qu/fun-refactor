name: M3 proof writing
on:
  workflow_dispatch:
    inputs:
      tool_run:
        description: Enter build to compile and test, or an exact passing M3 build run ID to reuse
        required: true
        type: string
      build_macos:
        description: Build the macOS executable for local agent attempts
        required: true
        type: boolean
      operation:
        description: Prepare the study, grade its original submissions, or verify current code and retained results
        required: true
        type: choice
        options: [prepare, grade, verify]
      report_mode:
        description: Collect initial verdicts or check the completed public report
        required: true
        type: choice
        options: [collect, check]
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      tool_run:
        type: string
        required: true
      build_macos:
        type: boolean
        required: true
      report_mode:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: m3-proof-writing-${{ inputs.operation }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    name: Require explicit proof-checking settings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          OPERATION: ${{ inputs.operation }}
          TOOL_RUN: ${{ inputs.tool_run }}
          REPORT_MODE: ${{ inputs.report_mode }}
          BUILD_MACOS: ${{ inputs.build_macos }}
        run: |
          python3 -B - <<'PY'
          import os
          operation, tool, report = [os.environ[name] for name in ('OPERATION', 'TOOL_RUN', 'REPORT_MODE')]
          assert operation in {'prepare', 'grade', 'verify'} and report in {'collect', 'check'}
          assert tool == 'build' or tool.isdigit()
          if operation == 'grade':
              assert tool.isdigit() and os.environ['BUILD_MACOS'] == 'false'
          if operation == 'verify':
              assert tool == 'build' and report == 'check'
          PY
  audit:
    name: Recheck original proof submissions with a rebuilt auditor
    needs: configuration
    if: inputs.operation == 'verify'
    uses: ./.github/workflows/proof-writing-audit.yml
  published:
    name: Select the original published proof comparison
    needs: configuration
    if: inputs.operation == 'verify' || inputs.operation == 'grade'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tool_run: ${{ steps.inputs.outputs.tool_run }}
      controls_run: ${{ steps.inputs.outputs.controls_run }}
      report_mode: ${{ steps.inputs.outputs.report_mode }}
      policy: ${{ steps.inputs.outputs.policy }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tests/agent-eval/proof-writing/local-results
      - name: Read the exact frozen controls and requested build
        id: inputs
        env:
          M3_TOOL_RUN: ${{ inputs.tool_run }}
          M3_REPORT_MODE: ${{ inputs.report_mode }}
          M3_OPERATION: ${{ inputs.operation }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('tests/agent-eval/proof-writing/local-results/summary.json').read_text())
          assert summary['study'] == 'M3'
          controls = summary['controls']['run']
          if os.environ['M3_OPERATION'] == 'grade':
              tool, mode, policy = os.environ['M3_TOOL_RUN'], os.environ['M3_REPORT_MODE'], 'frozen'
          else:
              tool, controls, mode, policy = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ID'], 'check', 'fresh'
          assert controls.isdigit() and tool.isdigit() and mode in {'collect', 'check'}
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write(f'tool_run={tool}\ncontrols_run={controls}\nreport_mode={mode}\npolicy={policy}\n')
          PY
  results:
    name: Independently check the delivered M3 proofs
    needs: [published, audit]
    if: always() && !cancelled() && needs.published.result == 'success' && (inputs.operation == 'grade' || needs.audit.result == 'success')
    uses: ./.github/workflows/proof-writing-results.yml
    with:
      tool_run: ${{ needs.published.outputs.tool_run }}
      controls_run: ${{ needs.published.outputs.controls_run }}
      report_mode: ${{ needs.published.outputs.report_mode }}
      policy: ${{ needs.published.outputs.policy }}
  macos-tool:
    needs: configuration
    if: inputs.operation != 'grade' && inputs.build_macos
    name: Build the exact fr binary for local proof attempts
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: m3-macos-agent-tool
      - run: cargo build --locked --release --bin fr --target aarch64-apple-darwin
      - name: Record the executable and its exact source
        run: |
          mkdir -p "$RUNNER_TEMP/m3-macos-tool"
          cp target/aarch64-apple-darwin/release/fr "$RUNNER_TEMP/m3-macos-tool/fr"
          git rev-parse HEAD > "$RUNNER_TEMP/m3-macos-tool/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/m3-macos-tool/source-tree.txt"
          shasum -a 256 "$RUNNER_TEMP/m3-macos-tool/fr" > "$RUNNER_TEMP/m3-macos-tool/fr.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: m3-macos-tool
          path: ${{ runner.temp }}/m3-macos-tool
          if-no-files-found: error
          retention-days: 30
  receipt:
    name: Require every proof, source and native-client control
    needs: [protocol, host-monitor, sdk, cases, source-runtime, native, private]
    if: always() && !cancelled() && inputs.operation != 'grade' && needs.protocol.result == 'success' && needs.host-monitor.result == 'success' && needs.sdk.result == 'success' && needs.cases.result == 'success' && needs.source-runtime.result == 'success' && needs.native.result == 'success' && needs.private.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@v8
        with:
          pattern: m3-*-controls*
          path: ${{ runner.temp }}/m3-controls
      - uses: actions/download-artifact@v8
        with:
          pattern: m3-source-runtime-*
          path: ${{ runner.temp }}/m3-controls
      - uses: actions/download-artifact@v8
        with:
          name: m3-private-controls
          path: ${{ runner.temp }}/m3-controls/m3-private-controls
      - run: >-
          python3 -B -m agent_eval.proof_writing_collect
          --artifacts "$RUNNER_TEMP/m3-controls" --output "$RUNNER_TEMP/m3-controls/controls.json"
      - uses: actions/upload-artifact@v7
        with:
          name: m3-complete-controls
          path: ${{ runner.temp }}/m3-controls/controls.json
          if-no-files-found: error
          retention-days: 30
  protocol:
    needs: configuration
    if: inputs.operation != 'grade'
    name: Check proof schedules and artifact identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: |
          python3 -B -m unittest discover -s tools/agent_eval -p 'test_proof_writing*.py'
          python3 -B tools/agent_eval/test_selected_local.py
          python3 -B tools/agent_eval/test_selected_plan.py
          python3 -B tools/agent_eval/test_selected_public.py
          python3 -B tools/agent_eval/test_selected_grading.py
          PYTHONPATH=tools python3 -B -m unittest agent_eval.test_darwin_sampling
      - name: Preserve every complete and interrupted comparison
        run: |
          sha256sum --check tests/agent-eval/proof-writing/first-results.sha256 tests/agent-eval/proof-writing/second-results.sha256 \
            tests/agent-eval/proof-writing/interrupted-results.sha256 \
            tests/agent-eval/proof-writing/proof-guide-interrupted-results.sha256 \
            tests/agent-eval/proof-writing/library-access-interrupted-results.sha256 \
            tests/agent-eval/proof-writing/clock-interrupted-results.sha256 \
            tests/agent-eval/proof-writing/introduction-interrupted-results.sha256 \
            tests/agent-eval/proof-writing/clocked-results.sha256 \
            tests/agent-eval/proof-writing/introduction-results.sha256 \
            tests/agent-eval/proof-writing/low-reasoning-results.sha256 \
            tests/agent-eval/proof-writing/claim-view-results.sha256 \
            tests/agent-eval/proof-writing/direct-proof-results.sha256
          python3 -B - <<'PY'
          from pathlib import Path
          for name in ('first-results', 'second-results', 'interrupted-results',
                       'proof-guide-interrupted-results', 'library-access-interrupted-results',
                       'clock-interrupted-results', 'introduction-interrupted-results', 'clocked-results', 'introduction-results',
                       'low-reasoning-results', 'claim-view-results', 'direct-proof-results'):
              directory = Path('tests/agent-eval/proof-writing') / name
              manifest = directory.with_suffix('.sha256')
              expected = {line.split('  ', 1)[1] for line in manifest.read_text().splitlines()}
              actual = {str(path) for path in directory.rglob('*') if path.is_file()}
              assert actual == expected and not any(path.is_symlink() for path in directory.rglob('*'))
          PY
  host-monitor:
    needs: configuration
    if: inputs.operation != 'grade'
    name: Check macOS resource accounting with stopped workers
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: PYTHONPATH=tools python3 -B -m unittest agent_eval.test_darwin_sampling agent_eval.test_host.BoundedHost
  native:
    name: Check all six native client and tool exchanges
    needs: [configuration, model]
    if: always() && !cancelled() && needs.configuration.result == 'success' && inputs.operation != 'grade' && (needs.model.result == 'success' || inputs.tool_run != 'build')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@v8
        with:
          name: m3-linux-tool
          path: ${{ runner.temp }}/m3-tool
          run-id: ${{ inputs.tool_run != 'build' && inputs.tool_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the explicit build before using it
        if: inputs.tool_run != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          M3_TOOL_RUN: ${{ inputs.tool_run }}
        run: >-
          python3 -B -m agent_eval.proof_writing_artifact --run "$M3_TOOL_RUN"
          --fr "$RUNNER_TEMP/m3-tool/fr" --output "$RUNNER_TEMP/m3-native-build.json"
      - run: chmod +x "$RUNNER_TEMP/m3-tool/fr"
      - name: Use scripted replies in network-free native clients
        run: >-
          python3 -B -m agent_eval.selected_native --fr "$RUNNER_TEMP/m3-tool/fr"
          --profiles tests/agent-eval/proof-writing/profiles.json
          --output "$RUNNER_TEMP/m3-native"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-native-controls
          path: |
            ${{ runner.temp }}/m3-native/summary.json
            ${{ runner.temp }}/m3-native/*/result.json
          if-no-files-found: error
          retention-days: 30
  model:
    needs: configuration
    if: inputs.operation != 'grade' && inputs.tool_run == 'build'
    name: Check early returns and numeric proof models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      FR_LEAN_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      RUST_TEST_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - uses: ./.github/actions/go-toolchain
      - uses: ./.github/actions/java-toolchain
      - uses: ./.github/actions/zig-toolchain
      - uses: ./.github/actions/lean-toolchain
      - name: Install the declared TypeScript checker
        working-directory: tests/typesafety/typescript
        run: |
          npm ci --no-fund --no-audit
          echo "$GITHUB_WORKSPACE/tests/typesafety/typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: m3-proof-writing
          cache-on-failure: true
      - run: cargo fmt --all --check
      - name: Check generated Lean models and unsafe-input refusals
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I grammars/lean/src grammars/lean/tests/layout.c -o "$RUNNER_TEMP/lean-layout"
          "$RUNNER_TEMP/lean-layout"
          lean -j 1 tests/fixtures/lean-proof-locations.lean
          cargo test --locked --test lean_grammar --test known_grammar_gaps --test translate_lean -- --test-threads=1
          cargo test --locked --test cli capability_filters_apply_to_json_markdown_and_text_totals -- --exact --test-threads=1
          cargo test --locked --test lean_adoption -- --test-threads=1
          cargo test --locked --test vfs_choke_point --test virtual_model_workspaces --test formal_kernel -- --test-threads=1
          cargo test --locked --lib spec::tests::proof_ -- --test-threads=1
          cargo test --locked --lib spec::proof_claim::tests -- --test-threads=1
          cargo test --locked --test project_cli lean_library_signatures_keep_types_without_including_equation_proofs -- --exact --test-threads=1
          cargo test --locked --lib span::tests -- --test-threads=1
          cargo test --locked --lib navigate::tests -- --test-threads=1
          cargo test --locked --lib analysis::impact::tests -- --test-threads=1
      - name: Check complete schedules and refuse unaudited live-call inputs
        run: |
          python3 -B tools/agent_eval/test_proof_writing_tasks.py
          python3 -B tools/agent_eval/test_selected_local.py
          python3 -B tools/agent_eval/test_selected_plan.py
      - uses: actions/upload-artifact@v7
        with:
          name: m3-linux-tool
          path: target/debug/fr
          if-no-files-found: error
          retention-days: 30
  sdk:
    name: Check Python proof records and first-use comparisons
    needs: [configuration, model]
    if: always() && !cancelled() && needs.configuration.result == 'success' && inputs.operation != 'grade' && (needs.model.result == 'success' || inputs.tool_run != 'build')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: tools:sdk/python/src
      PYTHONDONTWRITEBYTECODE: '1'
      FR_LEAN_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/*
            /tests/agent-eval/results/2026-09-25-flow-cache/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: ./.github/actions/lean-toolchain
      - run: python3 -m pip install --require-hashes --no-deps -r .github/actions/native-tools/python-wheels.txt
      - uses: actions/download-artifact@v8
        with:
          name: m3-linux-tool
          path: target/debug
          run-id: ${{ inputs.tool_run != 'build' && inputs.tool_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the explicit build before checking the SDK
        if: inputs.tool_run != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          M3_TOOL_RUN: ${{ inputs.tool_run }}
        run: >-
          python3 -B -m agent_eval.proof_writing_artifact --run "$M3_TOOL_RUN"
          --fr "$GITHUB_WORKSPACE/target/debug/fr" --output "$RUNNER_TEMP/m3-sdk-build.json"
      - run: chmod +x target/debug/fr
      - name: Find the proof checker in its source file with fr
        timeout-minutes: 3
        run: |
          target/debug/fr --no-cache --json -C src/spec.rs project find check_prepared_proof \
            --in spec.rs --contains --signature --limit 1 > "$RUNNER_TEMP/m3-proof-checker-location.json"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'm3-proof-checker-location.json').read_text())
          row, = [dict(zip(report['columns'], values)) for values in report['rows']]
          assert row['name'] == 'check_prepared_proof' and row['path'] == 'spec.rs'
          assert row['signature']['basis'] == 'syntax-header'
          assert report['coverage']['indexed_files'] == 1
          print('Found check_prepared_proof in spec.rs; indexed exactly one source file.')
          PY
      - name: Execute the current skill examples and supplied-theorem proof route
        run: python3 -B tools/check-agent-skill.py --fr target/debug/fr
      - run: |
          python3 -B -m pytest -q sdk/python/tests/test_ir.py -k proof_task_and_attempt
          python3 -B -m pytest -q sdk/python/tests/test_refinement.py
  private:
    name: Reject bad proof patches in isolated receivers
    needs: [model, cases]
    if: always() && !cancelled() && needs.cases.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      FR_LEAN_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: ./.github/actions/lean-toolchain
      - uses: actions/download-artifact@v8
        with:
          pattern: m3-prepared-*
          path: ${{ runner.temp }}/m3-private-inputs
      - uses: actions/download-artifact@v8
        with:
          pattern: m3-proof-controls-*
          path: ${{ runner.temp }}/m3-private-inputs
      - uses: actions/download-artifact@v8
        with:
          name: m3-linux-tool
          path: ${{ runner.temp }}/m3-tool
          run-id: ${{ inputs.tool_run != 'build' && inputs.tool_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the explicit build before using it
        if: inputs.tool_run != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          M3_TOOL_RUN: ${{ inputs.tool_run }}
        run: >-
          python3 -B -m agent_eval.proof_writing_artifact --run "$M3_TOOL_RUN"
          --fr "$RUNNER_TEMP/m3-tool/fr" --output "$RUNNER_TEMP/m3-private-build.json"
      - run: chmod +x "$RUNNER_TEMP/m3-tool/fr"
      - name: Exercise eighteen positive and negative patch deliveries without model calls
        run: >-
          python3 -B -m agent_eval.proof_writing_results controls
          --inputs "$RUNNER_TEMP/m3-private-inputs" --fr "$RUNNER_TEMP/m3-tool/fr"
          --output "$RUNNER_TEMP/m3-private"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-private-controls
          path: |
            ${{ runner.temp }}/m3-private/summary.json
            ${{ runner.temp }}/m3-private/image/build.stdout
            ${{ runner.temp }}/m3-private/image/build.stderr
            ${{ runner.temp }}/m3-private/*/result.json
            ${{ runner.temp }}/m3-private/*/grader.stdout
            ${{ runner.temp }}/m3-private/*/grader.stderr
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: m3-private-grader-image
          path: ${{ runner.temp }}/m3-private/grader-image.tar.gz
          if-no-files-found: error
          retention-days: 30
  source-runtime:
    needs: configuration
    if: inputs.operation != 'grade'
    name: Execute the source independently (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [access-rust, access-python, access-go, access-java, access-typescript, access-tsx, access-zig, access-lean, page-count, fits-window]
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      GOMAXPROCS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - if: matrix.case == 'access-rust' || matrix.case == 'page-count' || matrix.case == 'fits-window'
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: ./.github/actions/go-toolchain
        if: matrix.case == 'access-go'
      - uses: ./.github/actions/java-toolchain
        if: matrix.case == 'access-java'
      - uses: ./.github/actions/zig-toolchain
        if: matrix.case == 'access-zig'
      - uses: ./.github/actions/lean-toolchain
        if: matrix.case == 'access-lean'
      - uses: actions/setup-node@v7
        if: matrix.case == 'access-typescript' || matrix.case == 'access-tsx'
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - if: matrix.case == 'access-typescript' || matrix.case == 'access-tsx'
        run: npm ci --no-fund --no-audit
        working-directory: tests/typesafety/typescript
      - name: Compare native source results with independent expected values
        run: >-
          python3 -B -m agent_eval.proof_writing_runtime --case '${{ matrix.case }}'
          --output "$RUNNER_TEMP/m3-source-runtime"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-source-runtime-${{ matrix.case }}
          path: ${{ runner.temp }}/m3-source-runtime/*.json
          if-no-files-found: error
          retention-days: 30
  cases:
    name: Prepare the fixed proof claim (${{ matrix.case }})
    needs: [configuration, model]
    if: always() && !cancelled() && needs.configuration.result == 'success' && inputs.operation != 'grade' && (needs.model.result == 'success' || inputs.tool_run != 'build')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [access-rust, access-python, access-go, access-java, access-typescript, access-tsx, access-zig, access-lean, page-count, fits-window]
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      FR_LEAN_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: ./.github/actions/lean-toolchain
      - uses: actions/download-artifact@v8
        with:
          name: m3-linux-tool
          path: ${{ runner.temp }}/m3-tool
          run-id: ${{ inputs.tool_run != 'build' && inputs.tool_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Refuse a reused executable when native inputs differ
        if: inputs.tool_run != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          M3_TOOL_RUN: ${{ inputs.tool_run }}
        run: >-
          python3 -B -m agent_eval.proof_writing_artifact --run "$M3_TOOL_RUN"
          --fr "$RUNNER_TEMP/m3-tool/fr" --output "$RUNNER_TEMP/m3-case-build.json"
      - run: chmod +x "$RUNNER_TEMP/m3-tool/fr"
      - name: Check the fixed claim, tactic diagnostics and exact proof delivery
        run: >-
          python3 -B -m agent_eval.proof_writing_controls --case '${{ matrix.case }}'
          --fr "$RUNNER_TEMP/m3-tool/fr" --output "$RUNNER_TEMP/m3-case"
      - name: Execute the complete published access-rule lesson
        if: matrix.case == 'access-rust'
        run: python3 -B tools/reader_proof_example.py --fr "$RUNNER_TEMP/m3-tool/fr"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-prepared-${{ matrix.case }}
          path: ${{ runner.temp }}/m3-case/inputs
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-proof-controls-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/m3-case/result.json
            ${{ runner.temp }}/m3-case/controls/**/*.json
            ${{ runner.temp }}/m3-case/controls/*.patch
          if-no-files-found: warn
          retention-days: 30
