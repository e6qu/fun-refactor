name: M3 proof writing
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [milestone/agent-lean-proofs]
permissions:
  contents: read
concurrency:
  group: m3-proof-writing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model:
    name: Check early returns and numeric proof models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      FR_LEAN_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      RUST_TEST_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - uses: ./.github/actions/native-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: m3-proof-writing
          cache-on-failure: true
      - run: cargo fmt --all --check
      - name: Check generated Lean models and unsafe-input refusals
        run: cargo test --locked --test formal_kernel --test lean_adoption -- --test-threads=1
      - name: Check exact Python proof-task and receipt validation
        env:
          PYTHONPATH: sdk/python/src
        run: python3 -B -m pytest -q sdk/python/tests/test_ir.py -k proof_task_and_attempt
      - name: Check complete schedules and refuse unaudited live-call inputs
        run: |
          python3 -B tools/agent_eval/test_proof_writing_tasks.py
          python3 -B tools/agent_eval/test_selected_local.py
          python3 -B tools/agent_eval/test_selected_plan.py
      - uses: actions/upload-artifact@v7
        with:
          name: m3-linux-tool
          path: target/debug/fr
          if-no-files-found: error
          retention-days: 30
  cases:
    name: Prepare the fixed proof claim (${{ matrix.case }})
    needs: model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case: [access-rust, access-python, access-go, access-java, access-typescript, access-tsx, access-zig, access-lean, page-count, fits-window]
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      FR_LEAN_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: ./.github/actions/lean-toolchain
      - uses: actions/download-artifact@v8
        with:
          name: m3-linux-tool
          path: ${{ runner.temp }}/m3-tool
      - run: chmod +x "$RUNNER_TEMP/m3-tool/fr"
      - name: Check the fixed claim, tactic diagnostics and exact proof delivery
        run: >-
          python3 -B -m agent_eval.proof_writing_controls --case '${{ matrix.case }}'
          --fr "$RUNNER_TEMP/m3-tool/fr" --output "$RUNNER_TEMP/m3-case"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-prepared-${{ matrix.case }}
          path: ${{ runner.temp }}/m3-case/inputs
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-proof-controls-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/m3-case/result.json
            ${{ runner.temp }}/m3-case/controls/**/*.json
            ${{ runner.temp }}/m3-case/controls/*.patch
          if-no-files-found: warn
          retention-days: 30
