name: Inspect the selected M1 clients
on:
  push:
    branches: [ci/m1-selected-agent-probe]
permissions:
  contents: read
jobs:
  helper-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Inspect the matching Codex helper archive without extracting or running it
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, tarfile, urllib.request
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'code-mode-host.tar.gz'
          url = 'https://github.com/openai/codex/releases/download/rust-v0.164.0/codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz'
          with urllib.request.urlopen(url, timeout=30) as source, path.open('xb') as output:
              size = 0
              while chunk := source.read(1048576):
                  size += len(chunk)
                  assert size <= 256 * 1024**2
                  output.write(chunk)
          with path.open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == 'feade7026436baa4e82e898050c7ef82a8adbd98163dc504771275b5ef224f2f'
          with tarfile.open(path) as archive:
              members = [{'name': member.name, 'size': member.size, 'type': member.type.decode()} for member in archive.getmembers()]
          path.unlink()
          (path.parent / 'code-mode-host-inventory.json').write_text(json.dumps(members, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: code-mode-host-inventory
          path: ${{ runner.temp }}/code-mode-host-inventory.json
          if-no-files-found: error
          retention-days: 30
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            sdk/python/src
            tests/agent-eval/selected-agents
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Check the complete M1 attempt schedule without model calls
        shell: bash
        run: >-
          python3 -B -m unittest discover -s tools/agent_eval -p 'test_selected*.py' -v
          2>&1 | tee "$RUNNER_TEMP/m1-unit-tests.log"
      - name: Retain the proposed 36 attempts with unstarted outcomes and unknown costs
        env:
          PYTHONPATH: tools
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from agent_eval.selected_plan import prepare, verify
          root = Path.cwd()
          path = Path(os.environ['RUNNER_TEMP']) / 'm1-proposed-plan.json'
          path.write_text(json.dumps(prepare(root), indent=2) + '\n')
          verify(json.loads(path.read_text()), root)
          PY
      - run: python3 -B tools/selected-agent-probe.py --output "$RUNNER_TEMP/m1-clients"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1-client-probe
          path: |
            ${{ runner.temp }}/m1-unit-tests.log
            ${{ runner.temp }}/m1-proposed-plan.json
            ${{ runner.temp }}/m1-clients/**/*.stdout
            ${{ runner.temp }}/m1-clients/**/*.stderr
            ${{ runner.temp }}/m1-clients/**/archive-members.json
            ${{ runner.temp }}/m1-clients/**/openapi.json
            ${{ runner.temp }}/m1-clients/**/transcript.json
            ${{ runner.temp }}/m1-clients/**/effective-config.json
            ${{ runner.temp }}/m1-clients/**/models.json
            ${{ runner.temp }}/m1-clients/**/agents.json
            ${{ runner.temp }}/m1-clients/**/session.json
            ${{ runner.temp }}/m1-clients/**/server-info.json
            ${{ runner.temp }}/m1-clients/**/shutdown.json
            ${{ runner.temp }}/m1-clients/report.json
          if-no-files-found: error
          retention-days: 30
  tasks:
    name: Independent rename, Unicode and proof checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            src
            crates
            grammars
            queries
            catalogs
            kernels
            tools
            sdk/python/src
            skills/fr
            tests/agent-eval/selected-agents
            tests/agent-eval/project-changes
            tests/agent-eval/python-repositories
            tests/agent-eval/unknown-target
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Reject harness errors before installing tools or building
        run: python3 -B -m unittest discover -s tools/agent_eval -p 'test_selected*.py' -v
      - name: Install the exact grader wheels
        shell: bash
        run: |
          grep -E '/(pytest|pluggy|packaging|iniconfig|pygments)-' \
            .github/actions/native-tools/python-wheels.txt > "$RUNNER_TEMP/m1-python-wheels.txt"
          test "$(wc -l < "$RUNNER_TEMP/m1-python-wheels.txt")" -eq 5
          python3 -m pip install --no-index --no-deps --require-hashes \
            --requirement "$RUNNER_TEMP/m1-python-wheels.txt"
          python3 -m pytest --version
      - uses: ./.github/actions/lean-toolchain
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: m1-controls
      - run: cargo build --locked --bin fr
      - name: Check the installed fr support before choosing operations
        run: |
          target/debug/fr --json audit > "$RUNNER_TEMP/m1-fr-audit.json"
          target/debug/fr --json capabilities > "$RUNNER_TEMP/m1-fr-capabilities.json"
      - name: Run task checks serially with known correct and incorrect changes
        run: |
          for task in boltons-rename unicode-dice access-proof; do
            python3 -B -m agent_eval.selected_tasks --task "$task" --fr target/debug/fr \
              --output "$RUNNER_TEMP/m1-tasks/$task"
          done
      - name: Exercise real native tool results with scripted replies and no external network
        run: >-
          python3 -B -m agent_eval.selected_native --fr target/debug/fr
          --output "$RUNNER_TEMP/m1-native"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1-task-controls
          path: |
            ${{ runner.temp }}/m1-tasks/**/*.json
            ${{ runner.temp }}/m1-tasks/**/*.patch
            ${{ runner.temp }}/m1-fr-*.json
            ${{ runner.temp }}/m1-native/**/*.json
            ${{ runner.temp }}/m1-native/**/*.stdout
            ${{ runner.temp }}/m1-native/**/*.stderr
          if-no-files-found: error
          retention-days: 30
