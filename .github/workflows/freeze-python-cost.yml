name: Preserve the source behind completed Python measurements
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: freeze-python-cost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retain:
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reject source substitution and rewritten published reports
        run: python3 -B tools/test-frozen-python-cost.py
      - name: Read the exact merged source used before language changes
        run: git fetch --depth=1 origin 8ca25c2d72484b7e66f49b279f8b5009c68f3d6e
      - name: Retain unchanged source and rerun its original checks
        run: python3 -B tools/frozen-python-cost.py --retain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-cost-historical-source
          path: tests/agent-eval/results/2026-10-19-python-cost-source/
          retention-days: 30
          if-no-files-found: error
      - name: Commit the verified snapshot to this branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tests/agent-eval/results/2026-10-19-python-cost-source
          git add tools/frozen-python-cost.py
          git commit -m 'test: retain the source behind completed Python cost studies'
          git push origin "HEAD:refs/heads/$BRANCH"
