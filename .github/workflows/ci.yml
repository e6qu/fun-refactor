name: CI

# Pull requests only. A push to `main` is a merge of a branch CI has already
# checked, so running it again buys nothing and costs the minutes twice.
on:
  pull_request:
    # `edited` so a retitled request is re-checked: the title is what a squash
    # merge writes as the commit subject, and the release reads that subject.
    types: [opened, synchronize, reopened, edited]

# A new commit on a pull request makes the run in flight for the old one pointless.
# Without this it keeps going to the end and bills for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  toolchain:
    name: Pinned Zig toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig-toolchain

  agent-study:
    name: Independent agent study accounting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FR_STUDY_CGROUP_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare the isolated grader test image
        timeout-minutes: 2
        run: |
          docker pull python:3.14-alpine
          echo "FR_STUDY_TEST_IMAGE=$(docker image inspect python:3.14-alpine --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: bash tools/check.sh study

  # A pull request is squash-merged, so its title becomes the subject of the one
  # commit that lands on `main`. `release-please` reads those subjects to decide
  # the next version and to write the changelog. A subject it cannot classify is
  # not an error anywhere: the release simply never mentions the change, and the
  # version never moves. That is the silent failure this job refuses to allow.
  #
  # Written out rather than pulled from an action, because the rule is nine lines
  # and a third-party action here would run on every pull request with the
  # repository's token.
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title says what kind of change this is
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # type(optional scope)!: subject
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "title: $TITLE"
            exit 0
          fi
          cat >&2 <<MESSAGE
          The title of this pull request is:

            $TITLE

          A squash merge writes that as the commit subject, and the release is
          built from those subjects. Start it with the kind of change it is:

            feat:     a capability that was not there before, bumps the minor
            fix:      a defect that was reported, bumps the patch
            revert:   an earlier change taken back
            perf:     the same answer, arrived at faster
            refactor: the same behaviour, differently arranged
            docs:     a document, and nothing a program reads
            test:     a gate, and nothing it gates
            build:    the toolchain, the manifest, the packaging
            ci:       a workflow
            chore:    housekeeping that changes nothing anybody runs

          A scope in brackets narrows it, as in "fix(transpile): ...". A trailing
          "!" or a "BREAKING CHANGE:" footer means the change breaks something;
          under 1.0 that bumps the minor, and after it the major.
          MESSAGE
          exit 1

  # Browser feature checks run alongside the native shards.
  check:
    strategy:
      fail-fast: false
      matrix:
        slice: [wasm]
    runs-on: ubuntu-latest
    # Proof freshness hashes the executable. Debug symbols inflate that input
    # on every check; keep assertions and overflow checks without symbol data.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # The tree-sitter grammars are C, and there is one per language, so a cold
      # build is minutes and not seconds. Keyed by slice, because each slice compiles
      # its own feature set and one cache holding both halves evicts itself.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.slice }}

      - name: Check
        run: ./tools/check.sh ${{ matrix.slice }}

  native:
    needs: toolchain
    name: native (${{ matrix.kind }}-${{ matrix.index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: native, index: 0}
          - {kind: native, index: 1}
          - {kind: native, index: 2}
          - {kind: native, index: 3}
          - {kind: native, index: 4}
          - {kind: native, index: 5}
          - {kind: sdk, index: 0}
          - {kind: sdk, index: 1}
          - {kind: sdk, index: 2}
          - {kind: sdk, index: 3}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/native-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Run the complete assigned test inventory
        run: python3 tools/ci-shards.py ${{ matrix.kind }} ${{ matrix.index }}
      - uses: actions/upload-artifact@v7
        with:
          name: ci-${{ matrix.kind }}-${{ matrix.index }}
          path: target/ci-results/*
          if-no-files-found: error
          retention-days: 7

  static:
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: ./.github/actions/native-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: ./tools/check.sh static

  default:
    name: check (default)
    needs: [native, static, agent-study]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard and static check
        env:
          NATIVE: ${{ needs.native.result }}
          STATIC: ${{ needs.static.result }}
          AGENT_STUDY: ${{ needs.agent-study.result }}
        run: test "$NATIVE" = success && test "$STATIC" = success && test "$AGENT_STUDY" = success
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-*
          path: target/ci-results
          merge-multiple: true
      - name: Verify complete inventories and combined capability coverage
        run: python3 tools/ci-shards.py verify

  # The site's playground is a WebAssembly build plus a Vite bundle, and it is
  # published by a workflow that only runs on main. Without this, a pull request goes
  # green and the deploy is where you find out the wasm no longer builds. Runs beside
  # the test job and not after it, so it costs wall-clock and not much else.
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check clang can emit wasm
        run: clang --print-targets | grep -q wasm32

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-bindgen-cli, matching the lockfile
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the analysis for the browser
        run: ./tools/build-wasm.sh

      - name: Generate the bindings
        run: wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/fun_refactor.wasm

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the playground
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          test -f ../docs/playground/index.html

      # The browser API is the one surface no `cargo test` can reach: `src/wasm.rs`
      # compiles only for wasm32. This drives every method of it against the bundled
      # sample, in Node, using the same wasm the site ships.
      - name: Exercise every capability, in every language
        run: node web/test/api.mjs

      # The download button's promise: what it hands you, `git apply` takes. Checked
      # by running git, because a patch that does not apply looks exactly like one
      # that does until someone tries it somewhere else.
      - name: Check the patch it downloads applies
        run: node web/test/patch.mjs

      - name: Check browser checkpoint replacement and recovery
        run: node web/test/session.mjs

      # A literal colour works in the theme it was picked for and is invisible in the
      # other, and neither a build nor a screenshot of one theme can see it.
      - name: Check both themes name the same colours
        run: node web/test/style.mjs

      # `?render_as=json` promises the JSON describes the interface that exists. It
      # is written by hand, so it rots silently: the caller gets an answer, just the
      # wrong one.
      - name: Check the machine-readable renderings match the page
        run: node web/test/render_modes.mjs

      # Every refactoring against every symbol of the sample: nothing may trap, and a
      # rename must rewrite everything it said it resolved. Point it at a clone to run
      # the same sweep over a real repository.
      - name: Sweep every refactoring over every symbol
        run: node web/test/scale.mjs

      # A number worth watching: this is what a first visit downloads, and it grows
      # by a megabyte every time a grammar is added.
      - name: Report what a first visit costs
        run: |
          cd docs/playground/assets
          for f in *.wasm index-*.js; do
            printf '%-44s %6.2f MB gzipped\n' "$f" "$(gzip -c "$f" | wc -c | awk '{print $1/1048576}')"
          done
