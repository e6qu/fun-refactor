name: CI

# Pull requests only. A push to `main` is a merge of a branch CI has already
# checked, so running it again buys nothing and costs the minutes twice.
on:
  pull_request:

# A new commit on a pull request makes the run in flight for the old one pointless.
# Without this it keeps going to the end and bills for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The gate's two feature sets share no compilation, and in one job the two test
  # suites ran in sequence for nearly all of a 23-minute wall clock. Each slice is a
  # parallel job now, and `tools/check.sh` stays the one definition of passing: the
  # slices are its arguments, and a laptop with no argument still runs both. Both
  # slices run the full test suite, so both need every validator installed.
  check:
    strategy:
      fail-fast: false
      matrix:
        slice: [default, wasm]
    runs-on: ubuntu-latest
    # The gate's own work takes about twenty minutes. Anything past an hour is
    # something stuck, and a stuck job held a runner for six hours in silence.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # The tools the validator gate drives. Without them those cases skip themselves
      # and say so, which keeps the run honest — and leaves a language checked on a
      # laptop and nowhere else. Only `shellcheck` is already on the runner; `xmllint`
      # is not, which this step found out by asking rather than by assuming. Every
      # download is pinned to a version and to its published checksum, because a
      # gate that changes under you is not a gate. The versions are the current
      # release of each, which is what this tool targets.
      - name: Install the validators the gate drives
        timeout-minutes: 12
        run: |
          set -euo pipefail
          TERRAFORM=1.16.0
          TERRAFORM_SHA=41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3
          HELM=v4.2.4
          HELM_SHA=c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
          ZIG=0.16.0
          ZIG_SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          # Every fetch below reaches a host this repository does not control.
          # Without a deadline `curl` waits forever on a stalled connection. The
          # job sat here for forty-five minutes, the runner idle and the log
          # silent. A download that cannot finish in two minutes has failed, and
          # saying so costs a re-run instead of a six-hour timeout.
          fetch() {
            curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
              --connect-timeout 20 --max-time 120 -o "$1" "$2" \
              || { echo "could not fetch $2 within the time allowed"; exit 1; }
          }
          # `apt-get` waits on a stalled mirror as patiently as `curl` waited
          # on a stalled host, and this is where both jobs sat.
          sudo timeout 240 apt-get update -qq
          # zsh parses the completion script this tool writes for it. Absent, that
          # script would be checked by nothing and the run would still go green.
          sudo timeout 240 apt-get install -y -qq libxml2-utils zsh
          # Zig has been absent since the gate started driving it, and every Zig case
          # skipped itself here while the run went green. The checksum is the one the
          # download index publishes for this build.
          fetch /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG}/zig-x86_64-linux-${ZIG}.tar.xz"
          echo "${ZIG_SHA}  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          sudo ln -sf "/tmp/zig-x86_64-linux-${ZIG}/zig" /usr/local/bin/zig
          # Both checksums are the ones each project publishes beside its own
          # release: `terraform_<v>_SHA256SUMS` and `<file>.sha256sum`. Without
          # them these two downloads were the only unverified thing the gate ran.
          fetch /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM}/terraform_${TERRAFORM}_linux_amd64.zip"
          echo "${TERRAFORM_SHA}  /tmp/terraform.zip" | sha256sum -c -
          sudo unzip -o -d /usr/local/bin /tmp/terraform.zip
          fetch /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-${HELM}-linux-amd64.tar.gz"
          echo "${HELM_SHA}  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          terraform version
          zig version
          helm version --short
          shellcheck --version | head -2
          xmllint --version 2>&1 | head -1

      # The type-safety tutorial's examples are checked by the checkers they are
      # about: mypy over the Python files, tsc over the TypeScript files. The gate
      # skips when these are missing, and `require_on_ci` turns that skip into a
      # failure here, so a hole cannot read as a pass.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the tutorial's Python checker
        run: pip install "mypy==1.18.2"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Go took the runner's default, which is the same unpinned toolchain that
      # broke the Java cells. A runner image moves without this repository asking.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The tool targets the current version of every language it writes, and
      # says so in its output: a niladic `main`, an entry found anywhere in the
      # file. An Ubuntu runner ships whichever JDK it was built with, which is
      # older, and the conformance suite failed on Java files that run here and
      # on any current JDK. A version this repository chooses is a version it
      # can reason about.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install the tutorial's TypeScript checker
        run: npm ci --no-fund --no-audit
        working-directory: tests/typesafety/typescript

      # The tree-sitter grammars are C, and there is one per language, so a cold
      # build is minutes and not seconds. Keyed by slice, because each slice compiles
      # its own feature set and one cache holding both halves evicts itself.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.slice }}

      # Formatting, clippy and the tests, on the default feature set and again with
      # the browser API compiled in — the latter because it is a feature set neither
      # default clippy nor the default test run touches, and a struct field missed at
      # one of six call sites in `src/wasm.rs` once passed both.
      #
      # The commands live in the script so that running it locally and passing here
      # mean the same thing. Listing them twice let a branch be green on a laptop and
      # rejected on push, which is how this arrangement was arrived at.
      #
      # The script also reports capability coverage, measured on the test run it already
      # does. A `✓` in the matrix is computed from a predicate and says the command would
      # accept the language, not that anything ever ran it; the report fails when a claimed
      # cell went undriven, so the 270/270 is defended here and not merely checkable.
      - name: Check
        run: ./tools/check.sh ${{ matrix.slice }}

  # The site's playground is a WebAssembly build plus a Vite bundle, and it is
  # published by a workflow that only runs on main. Without this, a pull request goes
  # green and the deploy is where you find out the wasm no longer builds. Runs beside
  # the test job and not after it, so it costs wall-clock and not much else.
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check clang can emit wasm
        run: clang --print-targets | grep -q wasm32

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-bindgen-cli, matching the lockfile
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the analysis for the browser
        run: ./tools/build-wasm.sh

      - name: Generate the bindings
        run: wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/fun_refactor.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the playground
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          test -f ../docs/playground/index.html

      # The browser API is the one surface no `cargo test` can reach: `src/wasm.rs`
      # compiles only for wasm32. This drives every method of it against the bundled
      # sample, in Node, using the same wasm the site ships.
      - name: Exercise every capability, in every language
        run: node web/test/api.mjs

      # The download button's promise: what it hands you, `git apply` takes. Checked
      # by running git, because a patch that does not apply looks exactly like one
      # that does until someone tries it somewhere else.
      - name: Check the patch it downloads applies
        run: node web/test/patch.mjs

      # A literal colour works in the theme it was picked for and is invisible in the
      # other, and neither a build nor a screenshot of one theme can see it.
      - name: Check both themes name the same colours
        run: node web/test/style.mjs

      # `?render_as=json` promises the JSON describes the interface that exists. It
      # is written by hand, so it rots silently: the caller gets an answer, just the
      # wrong one.
      - name: Check the machine-readable renderings match the page
        run: node web/test/render_modes.mjs

      # Every refactoring against every symbol of the sample: nothing may trap, and a
      # rename must rewrite everything it said it resolved. Point it at a clone to run
      # the same sweep over a real repository.
      - name: Sweep every refactoring over every symbol
        run: node web/test/scale.mjs

      # A number worth watching: this is what a first visit downloads, and it grows
      # by a megabyte every time a grammar is added.
      - name: Report what a first visit costs
        run: |
          cd docs/playground/assets
          for f in *.wasm index-*.js; do
            printf '%-44s %6.2f MB gzipped\n' "$f" "$(gzip -c "$f" | wc -c | awk '{print $1/1048576}')"
          done
