name: CI

# Pull requests only. A push to `main` is a merge of a branch CI has already
# checked, so running it again buys nothing and costs the minutes twice.
on:
  pull_request:

# A new commit on a pull request makes the run in flight for the old one pointless.
# Without this it keeps going to the end and bills for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # The tree-sitter grammars are C, and there is one per language, so a cold
      # build is minutes rather than seconds.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # The browser API is a different feature set and used to be checked only by the
      # playground job, which needs a wasm toolchain and takes four times as long. A
      # struct field missed at one of six call sites in `src/wasm.rs` passed clippy and
      # the whole test suite, because neither compiles that file. It does now.
      - name: Clippy, with the browser API compiled in
        run: cargo clippy --all-targets --features wasm -- -D warnings

      - name: Tests, with the browser API compiled in
        run: cargo test --all-targets --features wasm

  # The site's playground is a WebAssembly build plus a Vite bundle, and it is
  # published by a workflow that only runs on main. Without this, a pull request goes
  # green and the deploy is where you find out the wasm no longer builds. Runs beside
  # the test job rather than after it, so it costs wall-clock and not much else.
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check clang can emit wasm
        run: clang --print-targets | grep -q wasm32

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-bindgen-cli, matching the lockfile
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the analysis for the browser
        run: ./tools/build-wasm.sh

      - name: Generate the bindings
        run: wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/fun_refactor.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the playground
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          test -f ../docs/playground/index.html

      # The browser API is the one surface no `cargo test` can reach: `src/wasm.rs`
      # compiles only for wasm32. This drives every method of it against the bundled
      # sample, in Node, using the same wasm the site ships.
      - name: Exercise every capability, in every language
        run: node web/test/api.mjs

      # The download button's promise: what it hands you, `git apply` takes. Checked
      # by running git, because a patch that does not apply looks exactly like one
      # that does until someone tries it somewhere else.
      - name: Check the patch it downloads applies
        run: node web/test/patch.mjs

      # A literal colour works in the theme it was picked for and is invisible in the
      # other, and neither a build nor a screenshot of one theme can see it.
      - name: Check both themes name the same colours
        run: node web/test/style.mjs

      # `?render_as=json` promises the JSON describes the interface that exists. It
      # is written by hand, so it rots silently: the caller gets an answer, just the
      # wrong one.
      - name: Check the machine-readable renderings match the page
        run: node web/test/render_modes.mjs

      # Every refactoring against every symbol of the sample: nothing may trap, and a
      # rename must rewrite everything it said it resolved. Point it at a clone to run
      # the same sweep over a real repository.
      - name: Sweep every refactoring over every symbol
        run: node web/test/scale.mjs

      # A number worth watching: this is what a first visit downloads, and it grows
      # by a megabyte every time a grammar is added.
      - name: Report what a first visit costs
        run: |
          cd docs/playground/assets
          for f in *.wasm index-*.js; do
            printf '%-44s %6.2f MB gzipped\n' "$f" "$(gzip -c "$f" | wc -c | awk '{print $1/1048576}')"
          done
