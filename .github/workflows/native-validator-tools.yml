name: Native validator tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tools:
    name: Check native validator installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            tools
            kernels
            tests/typesafety/typescript
            tests/migration-runtime/nextjs-framework
            tests/application-runtime/express
      - uses: ./.github/actions/native-tools
      - name: Check accepted and rejected shell and XML syntax
        shell: bash
        run: |
          set -euo pipefail
          validator_controls="$RUNNER_TEMP/native-validator-controls"
          mkdir -p "$validator_controls"
          printf '%s\n' 'function greet() { print -r -- hello; }' > "$validator_controls/valid.zsh"
          printf '%s\n' 'if then' > "$validator_controls/invalid.zsh"
          zsh -n "$validator_controls/valid.zsh"
          if zsh -n "$validator_controls/invalid.zsh"; then
            echo 'zsh accepted invalid syntax' >&2
            exit 1
          fi
          printf '%s\n' '<root/>' > "$validator_controls/valid.xml"
          printf '%s\n' '<root>' > "$validator_controls/invalid.xml"
          xmllint --nonet --noout "$validator_controls/valid.xml"
          if xmllint --nonet --noout "$validator_controls/invalid.xml"; then
            echo 'xmllint accepted invalid syntax' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-validator-controls
          path: ${{ runner.temp }}/native-validator-controls
          if-no-files-found: warn
          retention-days: 30
