name: Check small proof-writing experiments
on:
  workflow_dispatch:
    inputs:
      study:
        description: Proof comparison to prepare or grade
        required: true
        type: choice
        options: [M3-feedback, M3-construction, M3-page-count, M3-facts, M3-argument-repair]
      operation:
        description: Prepare controls without model calls, or grade submitted patches
        required: true
        type: choice
        options: [prepare, grade]
      artifact_run:
        description: Exact native build run for prepare, or successful controls run for grade
        required: true
        type: string
  workflow_call:
    inputs:
      study:
        description: Explicitly select M3-feedback, M3-construction, M3-page-count, M3-facts or M3-argument-repair
        required: true
        type: string
      operation:
        description: Prepare controls without model calls, or independently grade submitted patches
        required: true
        type: string
      artifact_run:
        description: Prepare uses an exact M3 native build run; grade uses an exact successful diagnostic-controls run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: proof-diagnostic-${{ inputs.study }}-${{ inputs.operation }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: tools:sdk/python/src
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_TOOLCHAIN: '1.99.1'
  FR_LEAN_JOBS: '1'
  LEAN_NUM_THREADS: '1'
  RAYON_NUM_THREADS: '1'
  STUDY: ${{ inputs.study }}
  DIAGNOSTIC_DATA: ${{ fromJSON('{"M3-feedback":"tests/agent-eval/proof-feedback/local-results","M3-construction":"tests/agent-eval/proof-construction/local-results","M3-page-count":"tests/agent-eval/proof-page-count/local-results","M3-facts":"tests/agent-eval/proof-division-facts/local-results","M3-argument-repair":"tests/agent-eval/proof-argument-repair/local-results"}')[inputs.study] }}
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: ./.github/actions/lean-toolchain
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Require an explicit numeric artifact run
        env:
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          OPERATION: ${{ inputs.operation }}
        run: python3 -c 'import os; assert os.environ["ARTIFACT_RUN"].isdigit() and os.environ["OPERATION"] in {"prepare", "grade"} and os.environ["STUDY"] in {"M3-feedback", "M3-construction", "M3-page-count", "M3-facts", "M3-argument-repair"}'
      - name: Check diagnostic scheduling, decisions and existing collector behavior
        run: |
          python3 -B -m unittest agent_eval.test_proof_feedback agent_eval.test_proof_division_facts agent_eval.test_argument_repair agent_eval.test_selected_plan \
            agent_eval.test_selected_local agent_eval.test_selected_public agent_eval.test_selected_grading \
            agent_eval.test_selected_native agent_eval.test_proof_writing_artifact
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.operation == 'prepare' && (contains(fromJSON('["M3-argument-repair","M3-facts"]'), inputs.study) && 'algorithm-linux-tool' || 'm3-linux-tool') || 'diagnostic-linux-tool' }}
          path: ${{ runner.temp }}/feedback-tool
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - run: chmod +x "$RUNNER_TEMP/feedback-tool/fr"
      - name: Verify the reused native build
        if: inputs.operation == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_RUN: ${{ inputs.artifact_run }}
          BUILD_KIND: ${{ contains(fromJSON('["M3-argument-repair","M3-facts"]'), inputs.study) && 'algorithms' || 'numeric-models' }}
        run: >-
          python3 -B -m agent_eval.proof_writing_artifact --build-kind "$BUILD_KIND" --run "$TOOL_RUN"
          --fr "$RUNNER_TEMP/feedback-tool/fr" --output "$RUNNER_TEMP/feedback-build.json"
      - name: Check both native models with scripted replies and no upstream access
        if: inputs.operation == 'prepare'
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from agent_eval.selected_plan import ROOT, prepare
          profiles = prepare(ROOT, os.environ['STUDY'])['profiles']
          (Path(os.environ['RUNNER_TEMP']) / 'diagnostic-profiles.json').write_text(json.dumps(profiles))
          PY
          python3 -B -m agent_eval.selected_native --fr "$RUNNER_TEMP/feedback-tool/fr" \
            --profiles "$RUNNER_TEMP/diagnostic-profiles.json" --output "$RUNNER_TEMP/feedback-native"
      - name: Reject bad drafts and patches in isolated checkouts
        id: controls
        if: inputs.operation == 'prepare'
        run: >-
          python3 -B -m agent_eval.proof_feedback controls --fr "$RUNNER_TEMP/feedback-tool/fr"
          --native "$RUNNER_TEMP/feedback-native/summary.json" --output "$RUNNER_TEMP/feedback-controls" --study "$STUDY"
      - name: Retain failed scripted-control summaries
        uses: actions/upload-artifact@v7
        if: inputs.operation == 'prepare' && failure()
        with:
          name: diagnostic-failed-control-summaries
          path: |
            ${{ runner.temp }}/feedback-native/summary.json
            ${{ runner.temp }}/feedback-controls/controls.json
            ${{ runner.temp }}/feedback-controls/initial-check.json
            ${{ runner.temp }}/feedback-controls/grade-*/result.json
            ${{ runner.temp }}/feedback-controls/grade-*/grader.stdout
            ${{ runner.temp }}/feedback-controls/grade-*/grader.stderr
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: inputs.operation == 'prepare' && success()
        with:
          name: diagnostic-qualified-inputs
          path: |
            ${{ runner.temp }}/feedback-controls/controls.json
            ${{ runner.temp }}/feedback-controls/inputs
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: inputs.operation == 'prepare' && success()
        with:
          name: diagnostic-private-checker
          path: ${{ runner.temp }}/feedback-controls/grader-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: inputs.operation == 'prepare' && success()
        with:
          name: diagnostic-linux-tool
          path: ${{ runner.temp }}/feedback-tool/fr
          if-no-files-found: error
          retention-days: 30
      - name: Require the original diagnostic controls to have passed
        if: inputs.operation == 'grade'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_RUN: ${{ inputs.artifact_run }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN/attempts/1" > "$RUNNER_TEMP/feedback-run.json"
          python3 -c 'import json,os; from pathlib import Path; v=json.loads((Path(os.environ["RUNNER_TEMP"])/"feedback-run.json").read_text()); assert v["run_attempt"]==1 and v["status"]=="completed" and v["conclusion"]=="success"'
      - uses: actions/download-artifact@v8
        if: inputs.operation == 'grade'
        with:
          pattern: diagnostic-qualified-inputs
          path: ${{ runner.temp }}/feedback-original
          merge-multiple: true
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: inputs.operation == 'grade'
        with:
          name: diagnostic-private-checker
          path: ${{ runner.temp }}/feedback-original
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Independently check every original patch and retain failed attempts
        id: grade
        if: inputs.operation == 'grade'
        env:
          CONTROL_RUN: ${{ inputs.artifact_run }}
        run: >-
          python3 -B -m agent_eval.proof_feedback grade --fr "$RUNNER_TEMP/feedback-tool/fr"
          --artifacts "$RUNNER_TEMP/feedback-original"
          --data "$DIAGNOSTIC_DATA"
          --output "$RUNNER_TEMP/feedback-checked" --control-run "$CONTROL_RUN" --study "$STUDY"
      - uses: actions/upload-artifact@v7
        if: inputs.operation == 'grade' && always() && (steps.grade.outcome == 'success' || steps.grade.outcome == 'failure')
        with:
          name: diagnostic-independent-verdicts
          path: ${{ runner.temp }}/feedback-checked/checked.json
          if-no-files-found: error
          retention-days: 30
