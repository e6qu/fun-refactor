name: Product proof memory
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Choose the frozen checker-only experiment
        type: choice
        default: imports
        options: [imports, allocator, toolchain]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/product-memory.yml'
      - 'tools/agent_eval/product_memory.py'
      - 'tools/agent_eval/test_product_memory.py'
      - 'tools/agent_eval/product_allocator.py'
      - 'tools/agent_eval/test_product_allocator.py'
      - 'tests/agent-eval/product-validation/memory/allocator-protocol.json'
      - 'tools/agent_eval/product_toolchain_memory.py'
      - 'tools/agent_eval/test_product_toolchain_memory.py'
      - 'tests/agent-eval/product-validation/memory/toolchain-protocol.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: product-memory-${{ github.ref }}
  # Preserve measurements already queued or running when review updates arrive.
  cancel-in-progress: false
jobs:
  audit:
    name: Audit retained proof memory without new measurements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
            !/tests/agent-eval/opencode/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
      - name: Replay retained samples and reject altered records
        env:
          PYTHONPATH: tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest agent_eval.test_product_memory agent_eval.test_product_allocator agent_eval.test_product_toolchain_memory
  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    name: Proof checker memory (${{ inputs.experiment }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            sha256: ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          - runner: macos-15
            platform: darwin_aarch64
            sha256: 61942f9d1907db918020154a517c87fb64841e48cebb0032fc0909df8d189a05
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      QUALIFICATION_RUN: '44542024683'
      LEAN_ARCHIVE_SHA256: ${{ matrix.sha256 }}
      LEAN_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
            !/tests/agent-eval/opencode/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
      - name: Authenticate the original successful qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/qualification-run.json"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads((Path(os.environ['RUNNER_TEMP']) / 'qualification-run.json').read_text())
          assert row['status'] == 'completed' and row['conclusion'] == 'success'
          assert row['path'] == '.github/workflows/product-validation.yml'
          assert row['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          PY
      - uses: actions/download-artifact@v8
        with:
          name: product-controls-clamp-proof
          run-id: ${{ env.QUALIFICATION_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/proof-inputs
      - name: Download the pinned Lean release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="lean-4.28.0-${LEAN_PLATFORM}.tar.zst"
          gh release download v4.28.0 --repo leanprover/lean4 --pattern "$archive" --dir "$RUNNER_TEMP"
          LEAN_ARCHIVE="$RUNNER_TEMP/$archive" python3 -B - <<'PY'
          import hashlib, os
          with open(os.environ['LEAN_ARCHIVE'], 'rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == os.environ['LEAN_ARCHIVE_SHA256']
          PY
          mkdir "$RUNNER_TEMP/lean-memory-tool"
          zstd -dc "$RUNNER_TEMP/$archive" | tar -xf - -C "$RUNNER_TEMP/lean-memory-tool" --strip-components=1
          rm "$RUNNER_TEMP/$archive"
          printf '%s\n' "$LEAN_ARCHIVE_SHA256" > "$RUNNER_TEMP/lean-memory-tool/archive.sha256"
      - name: Download and authenticate the candidate release
        if: inputs.experiment == 'toolchain'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="lean-4.36.0-${LEAN_PLATFORM}.tar.zst"
          gh release download v4.36.0 --repo leanprover/lean4 --pattern "$archive" --dir "$RUNNER_TEMP"
          LEAN_ARCHIVE="$RUNNER_TEMP/$archive" python3 -B - <<'PY'
          import hashlib, os
          from pathlib import Path
          from agent_eval.product_toolchain_memory import policy
          with open(os.environ['LEAN_ARCHIVE'], 'rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert digest == policy()['archives'][os.environ['LEAN_PLATFORM']]['candidate']
          root = Path(os.environ['RUNNER_TEMP']) / 'lean-memory-candidate'
          root.mkdir()
          (root / 'archive.sha256').write_text(digest + '\n')
          PY
          zstd -dc "$RUNNER_TEMP/$archive" | tar -xf - -C "$RUNNER_TEMP/lean-memory-candidate" --strip-components=1
          rm "$RUNNER_TEMP/$archive"
      - name: Measure the selected frozen experiment
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          if [ "$EXPERIMENT" = toolchain ]; then
            python3 -B -m agent_eval.product_toolchain_memory measure \
              --inputs "$RUNNER_TEMP/proof-inputs" --run "$RUNNER_TEMP/qualification-run.json" \
              --baseline "$RUNNER_TEMP/lean-memory-tool" --candidate "$RUNNER_TEMP/lean-memory-candidate" \
              --output "$RUNNER_TEMP/proof-toolchain"
            exit 0
          fi
          case "$EXPERIMENT" in
            imports) module=agent_eval.product_memory; output="$RUNNER_TEMP/proof-memory" ;;
            allocator) module=agent_eval.product_allocator; output="$RUNNER_TEMP/proof-allocator" ;;
            *) echo 'Unknown proof memory experiment'; exit 1 ;;
          esac
          python3 -B -m "$module" measure \
            --inputs "$RUNNER_TEMP/proof-inputs" --run "$RUNNER_TEMP/qualification-run.json" \
            --lean-root "$RUNNER_TEMP/lean-memory-tool" --output "$output"
      - uses: actions/upload-artifact@v7
        if: always() && inputs.experiment == 'allocator'
        with:
          name: proof-allocator-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/proof-allocator/summary.json
            ${{ runner.temp }}/proof-allocator/probe-*.stdout
            ${{ runner.temp }}/proof-allocator/probe-*.stderr
            ${{ runner.temp }}/proof-allocator/*/resources.json
            ${{ runner.temp }}/proof-allocator/*/profile.json
            ${{ runner.temp }}/proof-allocator/*/profile.jsonl
            ${{ runner.temp }}/proof-allocator/*/stdout
            ${{ runner.temp }}/proof-allocator/*/stderr
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && inputs.experiment == 'toolchain'
        with:
          name: proof-toolchain-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/proof-toolchain/summary.json
            ${{ runner.temp }}/proof-toolchain/*/resources.json
            ${{ runner.temp }}/proof-toolchain/*/profile.json
            ${{ runner.temp }}/proof-toolchain/*/profile.jsonl
            ${{ runner.temp }}/proof-toolchain/*/stdout
            ${{ runner.temp }}/proof-toolchain/*/stderr
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && inputs.experiment == 'imports'
        with:
          name: proof-memory-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/proof-memory/summary.json
            ${{ runner.temp }}/proof-memory/*/resources.json
            ${{ runner.temp }}/proof-memory/*/profile.json
            ${{ runner.temp }}/proof-memory/*/profile.jsonl
            ${{ runner.temp }}/proof-memory/*/stdout
            ${{ runner.temp }}/proof-memory/*/stderr
          if-no-files-found: warn
          retention-days: 30
