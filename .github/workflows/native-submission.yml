name: Native submission protocol

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: native-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripted:
    name: Scripted OpenCode submissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install the pinned client
        run: |
          mkdir -p target/opencode
          curl --fail --location --retry 2 --max-time 90 \
            https://github.com/anomalyco/opencode/releases/download/v1.18.34/opencode-linux-x64-baseline.tar.gz \
            -o target/opencode/archive.tar.gz
          echo '24b0d458d21ef548b2752166303defcf7f4945b049fb4876ab78dfaf86d81b27  target/opencode/archive.tar.gz' | sha256sum -c -
          tar -xzf target/opencode/archive.tar.gz -C target/opencode
      - name: Reject malformed and inconsistent submission evidence
        run: python3 -B tools/agent_eval/test_structured_submission.py
      - name: Exercise terminal answers with a scripted loopback provider
        run: >-
          python3 -B tools/check-native-submission.py check target/native-submission
          --opencode target/opencode/opencode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-submission-protocol
          path: |
            target/native-submission/result.json
            target/native-submission/*/*.json
            target/native-submission/*/*.jsonl
            target/native-submission/*/*.stdout
            target/native-submission/*/*.stderr
          retention-days: 7
