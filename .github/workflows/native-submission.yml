name: Native submission protocol

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: native-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripted:
    name: Scripted OpenCode submissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/grading-registry
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install the pinned client
        run: |
          mkdir -p target/opencode
          curl --fail --location --retry 2 --max-time 90 \
            https://github.com/anomalyco/opencode/releases/download/v1.18.34/opencode-linux-x64-baseline.tar.gz \
            -o target/opencode/archive.tar.gz
          echo '24b0d458d21ef548b2752166303defcf7f4945b049fb4876ab78dfaf86d81b27  target/opencode/archive.tar.gz' | sha256sum -c -
          tar -xzf target/opencode/archive.tar.gz -C target/opencode
      - name: Reject malformed and inconsistent submission evidence
        run: python3 -B tools/agent_eval/test_structured_submission.py
      - name: Check frozen source reviews and interrupted accounting
        run: python3 -B tools/agent_eval/test_terminal_reviews.py
      - name: Check serial admission and provider credential isolation
        run: python3 -B tools/agent_eval/test_terminal_review_collection.py
      - name: Check configured-client authentication without reading credentials
        run: python3 -B tools/agent_eval/test_configured_terminal_reviews.py
      - name: Check client memory admission and retained failures offline
        run: |
          python3 -B tools/test-client-memory.py
          python3 -B tools/test-client-memory-profile.py
          python3 -B tools/test-catalog-review.py
          python3 -B tools/test-review-reasoning.py
      - name: Check new review questions against retained source
        run: |
          python3 -B tools/agent_eval/test_terminal_review_design.py
          python3 -B tools/agent_eval/test_review_coverage.py
          python3 -B tools/test-scoped-reviews.py
      - name: Check complete packaging review inputs and prompt budget
        run: |
          python3 -B tests/agent-eval/opencode/reviews/2026-10-06-packaging-inputs/prepare.py check
          python3 -B tools/prepare-terminal-reviews.py check tests/agent-eval/opencode/reviews/2026-10-06-packaging-inputs/design.json
          python3 -B tests/agent-eval/opencode/reviews/2026-10-07-packaging-scoped/prepare.py check
          python3 -B tools/prepare-terminal-reviews.py check tests/agent-eval/opencode/reviews/2026-10-07-packaging-scoped/design.json
      - name: Verify remaining policy combinations in isolation
        run: >-
          python3 -B tests/agent-eval/opencode/reviews/2026-10-07-packaging-scoped/verify-policy.py
          target/policy-review
      - name: Exercise terminal answers with a scripted loopback provider
        run: >-
          python3 -B tools/check-native-submission.py check target/native-submission
          --opencode target/opencode/opencode
      - name: Install pinned fr for source-review tools
        run: |
          mkdir -p target/review-fr
          curl --fail --location --retry 2 --max-time 90 \
            https://github.com/e6qu/fun-refactor/releases/download/fun-refactor-v0.52.1/fr-v0.52.1-x86_64-unknown-linux-musl.tar.gz \
            -o target/review-fr/archive.tar.gz
          echo '29dc93be63d0c681a37f02f33860ea828ef0c3cb91f413ce941b61cc2d32f68e  target/review-fr/archive.tar.gz' | sha256sum -c -
          tar -xzf target/review-fr/archive.tar.gz -C target/review-fr --strip-components=1
      - name: Author the extracted capture function through fr
        run: >-
          python3 -B tools/check-terminal-reviews.py author target/terminal-author
          --fr target/review-fr/fr
      - name: Review source packets and retain failed client work
        run: >-
          python3 -B tools/check-terminal-reviews.py check target/terminal-reviews
          --fr target/review-fr/fr --opencode target/opencode/opencode
      - name: Collect serial reviews and enforce the stop rule with the real client
        run: >-
          python3 -B tools/check-review-collection.py check target/review-collection
          --fr target/review-fr/fr --opencode target/opencode/opencode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-submission-protocol
          path: |
            target/policy-review/*.json
            target/native-submission/result.json
            target/native-submission/*/*.json
            target/native-submission/*/*.jsonl
            target/native-submission/*/*.stdout
            target/native-submission/*/*.stderr
            target/terminal-reviews/result.json
            target/terminal-author/preview.json
            target/terminal-reviews/*/*.json
            target/terminal-reviews/*/*.json.gz
            target/terminal-reviews/*/*.stdout
            target/terminal-reviews/*/*.stderr
            target/terminal-reviews/*/attempts/*/*.json
            target/terminal-reviews/*/attempts/*/*.jsonl
            target/terminal-reviews/*/attempts/*/*.stdout
            target/terminal-reviews/*/attempts/*/*.stderr
            target/review-collection/*/*.json
            target/review-collection/*/*.json.gz
            target/review-collection/*/attempts/*/*.json
            target/review-collection/*/attempts/*/*.jsonl
            target/review-collection/*/attempts/*/*.stdout
            target/review-collection/*/attempts/*/*.stderr
          retention-days: 7
