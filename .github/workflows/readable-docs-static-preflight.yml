name: Check the documentation command fix
on:
  push:
    branches: [ci/readable-docs-static-preflight]
permissions:
  contents: read
jobs:
  static-and-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: ./.github/actions/native-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check collection failure and completion barriers
        run: python3 -B tools/test-python-contract-runner.py
      - name: Run the complete static gate
        run: ./tools/check.sh static
      - name: Check actual pages and command-parser regression cases
        run: cargo test --locked --test site_integrity -- --test-threads 1
