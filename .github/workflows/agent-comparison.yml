name: Agent comparison preparation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/agent-comparison-*.py'
      - 'tools/agent_eval/comparison_*.py'
      - 'tools/agent_eval/test_comparison*.py'
      - 'tools/agent_eval/container_resources.py'
      - 'tools/agent_eval/bounded_host.py'
      - 'tools/agent_eval/study.py'
      - 'tools/agent_eval/isolated_grade.py'
      - 'tools/agent_eval/docker_info.py'
      - 'tools/agent_eval/request_gateway.py'
      - 'tools/agent_eval/provider_usage.py'
      - 'tools/agent-eval.py'
      - 'tools/agent-eval-codex.py'
      - 'tools/agent_eval/test_codex_runner.py'
      - 'tools/agent_eval/test_harness.py'
      - 'tools/agent_eval/oracle.py'
      - 'tools/agent_eval/regex_workspace.py'
      - 'tools/agent_eval/regex_escape_len.py'
      - 'tests/agent-eval/agent-comparison/**'
      - 'tests/agent-eval/agent-first-use/*.json'
      - 'tests/agent-eval/unknown-target/task.json'
      - 'skills/fr/**'
      - '.github/workflows/agent-comparison.yml'
permissions:
  contents: read
concurrency:
  group: agent-comparison-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  preparation:
    name: Freeze the proposed attempts and reject changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: python3 -B -m unittest discover -s tools/agent_eval -p 'test_comparison*.py' -v
      - name: Reject undeclared Codex settings without model calls
        run: |
          python3 -B tools/agent_eval/test_codex_runner.py
          python3 -B tools/external-eval.py tools/agent_eval/test_harness.py
      - name: Preserve the evaluator behind recorded comparisons
        run: |
          python3 -B tools/project-batch-context.py --audit tests/agent-eval/results/2026-10-20-project-ci-project-batch-context/result.json
          python3 -B tools/task-bundle-context.py --audit tests/agent-eval/results/2026-10-20-project-ci-task-bundle-context/result.json
          python3 -B tools/workflow-context.py --audit tests/agent-eval/results/2026-10-20-project-ci-workflow-context/result.json
          python3 -B tools/representative-acceptance.py audit
      - name: Prepare and independently reopen the schedule
        run: |
          python3 -B tools/agent-comparison-plan.py --prepare > "$RUNNER_TEMP/comparison-plan.json"
          python3 -B tools/agent-comparison-plan.py --verify "$RUNNER_TEMP/comparison-plan.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proposed-agent-comparison
          path: ${{ runner.temp }}/comparison-plan.json
          retention-days: 30
          if-no-files-found: error
  rehearsal:
    name: Isolated tools and complete shutdown (${{ matrix.setup }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        setup: [files, fr, codegraph]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Stage only this setup's pinned tool
        env:
          COMPARISON_SETUP: ${{ matrix.setup }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, shutil, tarfile, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'comparison-image')
          root.mkdir()
          tool = root / 'tool'
          (tool / 'bin').mkdir(parents=True)
          setup = os.environ['COMPARISON_SETUP']
          if setup != 'files':
              source = ('tests/agent-eval/agent-first-use/codegraph.json' if setup == 'codegraph'
                        else 'tests/agent-eval/agent-comparison/tools.json')
              entry = json.loads(pathlib.Path(source).read_text())
              if setup == 'fr':
                  entry = entry['fr']
              archive = root / 'tool.tar.gz'
              with urllib.request.urlopen(entry['url'], timeout=30) as response, archive.open('wb') as target:
                  while chunk := response.read(1048576):
                      target.write(chunk)
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == entry['sha256']
              with tarfile.open(archive) as bundle:
                  bundle.extractall(root / 'unpacked', filter='data')
              if setup == 'codegraph':
                  shutil.copytree(root / 'unpacked/codegraph-linux-x64', tool, dirs_exist_ok=True)
              else:
                  binary, = (path for path in (root / 'unpacked').rglob('fr') if path.is_file())
                  shutil.copyfile(binary, tool / 'bin/fr')
                  (tool / 'bin/fr').chmod(0o755)
              archive.unlink()
              shutil.rmtree(root / 'unpacked')
          shutil.copyfile('tools/agent_eval/comparison_probe.py', root / 'comparison_probe.py')
          shutil.copyfile('tools/agent_eval/comparison_plan.py', root / 'comparison_plan.py')
          shutil.copyfile('tools/agent_eval/comparison_handoff_actions.py', root / 'comparison_handoff_actions.py')
          shutil.copyfile('tests/agent-eval/agent-comparison/Dockerfile', root / 'Dockerfile')
          PY
      - name: Build an isolated model-free control image
        run: |
          docker build --tag fr-comparison-control "$RUNNER_TEMP/comparison-image"
          echo "COMPARISON_IMAGE=$(docker image inspect fr-comparison-control --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Exercise the real tool and stop every container process
        run: >-
          python3 -B tools/agent-comparison-rehearsal.py --image "$COMPARISON_IMAGE"
          --setup '${{ matrix.setup }}' --host tools --exercise tools --output "$RUNNER_TEMP/comparison-normal"
      - name: Catch a detached worker after its launcher exits
        if: matrix.setup == 'files'
        run: >-
          python3 -B tools/agent-comparison-rehearsal.py --image "$COMPARISON_IMAGE"
          --setup files --host tools --exercise tools --negative-control --output "$RUNNER_TEMP/comparison-detached"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-rehearsal-${{ matrix.setup }}
          path: ${{ runner.temp }}/comparison-*/result.json
          retention-days: 30
          if-no-files-found: error
  native:
    name: Native application and assigned tools (${{ matrix.host }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        host: [claude, codex, opencode]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Exercise each setup in a fresh bounded container
        run: >-
          python3 -B tools/agent-comparison-native.py --host '${{ matrix.host }}'
          --output "$RUNNER_TEMP/native-comparison"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-comparison-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/native-comparison/summary.json
            ${{ runner.temp }}/native-comparison/*/result.json
          retention-days: 30
          if-no-files-found: error
  handoff:
    name: Pause, refresh and deliver (${{ matrix.host }}, ${{ matrix.task }}, ${{ matrix.setup }})
    needs: preparation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        host: [opencode, codex, claude]
        task: [regex-escape-len, unicode-dice]
        setup: [files, fr, codegraph]
    env:
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install stable --profile minimal
      - name: Fetch private grader dependencies before offline execution
        if: matrix.task == 'regex-escape-len'
        run: |
          python3 -B tools/regex-workspace-check.py unpack "$RUNNER_TEMP/handoff-dependencies"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/handoff-dependencies/Cargo.toml"
      - name: Resume the real project after an intervening source edit
        run: >-
          python3 -B tools/agent-comparison-handoff.py --host '${{ matrix.host }}'
          --task '${{ matrix.task }}' --setup '${{ matrix.setup }}'
          --output "$RUNNER_TEMP/comparison-handoff"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-handoff-${{ matrix.host }}-${{ matrix.task }}-${{ matrix.setup }}
          path: |
            ${{ runner.temp }}/comparison-handoff/result.json
            ${{ runner.temp }}/comparison-handoff/scenario.json
            ${{ runner.temp }}/comparison-handoff/native/result.json
            ${{ runner.temp }}/comparison-handoff/grade.json
            ${{ runner.temp }}/comparison-handoff/change.patch
            ${{ runner.temp }}/comparison-handoff/HANDOFF.md
          retention-days: 30
          if-no-files-found: error
  grading:
    name: Independent comparison grading (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [unicode-dice, regex-escape-len]
    env:
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install stable --profile minimal
      - name: Provision the pinned regex dependency graph before offline grading
        if: matrix.task == 'regex-escape-len'
        run: |
          python3 -B tools/regex-workspace-check.py unpack "$RUNNER_TEMP/grader-dependencies"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/grader-dependencies/Cargo.toml"
      - name: Reject unchanged and incomplete code, then replay the correct patch
        run: >-
          python3 -B tools/agent-comparison-grade.py controls --task '${{ matrix.task }}'
          --output "$RUNNER_TEMP/comparison-grade"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparison-grade-${{ matrix.task }}
          path: |
            ${{ runner.temp }}/comparison-grade/*.json
            ${{ runner.temp }}/comparison-grade/*.patch
          retention-days: 30
          if-no-files-found: error
