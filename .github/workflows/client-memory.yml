name: OpenCode memory controls

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/client-memory.yml
      - tools/check-client-memory.py
      - tools/check-client-catalog.py
      - tools/check-review-reasoning.py
      - tools/test-review-reasoning.py
      - tools/agent_eval/structured_submission.py
      - tools/agent_eval/terminal_reviews.py
      - tools/check-terminal-reviews.py
      - tools/test-client-memory.py
      - tools/profile-client-memory.py
      - tools/test-client-memory-profile.py
      - tools/agent_eval/client_memory_profile.py
      - tools/agent_eval/bounded_host.py
      - tools/agent_eval/opencode_rehearsal.py
      - tools/agent_eval/structured_probe.py
      - tools/agent_eval/terminal_review_runner.py
      - tools/agent_eval/terminal_transport.py
      - tests/agent-eval/opencode/catalog/**

concurrency:
  group: client-memory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  memory:
    name: Client memory (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            client: opencode-linux-x64-baseline.tar.gz
            client_sha: 24b0d458d21ef548b2752166303defcf7f4945b049fb4876ab78dfaf86d81b27
            fr: fr-v0.54.0-x86_64-unknown-linux-musl.tar.gz
            fr_sha: beaf1ad0317c5e3362a4a96635efccb0cd59626fd783fea72257f420882541b9
          - runner: macos-15
            client: opencode-darwin-arm64.zip
            client_sha: 8522b70f545184b3a8d97c5ca4f814093b2476d72aebfda8c48bcd072ec31d1b
            fr: fr-v0.54.0-aarch64-apple-darwin.tar.gz
            fr_sha: bb8d04340518791e58f4f71ed018d5bba50ca8905a284eb20509b58bb8f7386f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check admission and failure accounting offline
        run: |
          python3 -B tools/test-client-memory.py
          python3 -B tools/test-client-memory-profile.py
          python3 -B tools/test-catalog-review.py
          python3 -B tools/agent_eval/test_structured_submission.py
          python3 -B tools/agent_eval/test_terminal_reviews.py
          python3 -B tools/test-review-reasoning.py
          python3 -B tests/agent-eval/opencode/catalog/prepare.py check
      - name: Download pinned released tools through gh
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_ASSET: ${{ matrix.client }}
          CLIENT_SHA: ${{ matrix.client_sha }}
          FR_ASSET: ${{ matrix.fr }}
          FR_SHA: ${{ matrix.fr_sha }}
        run: |
          mkdir -p target/client-memory-tools/client target/client-memory-tools/fr
          gh release download v1.18.34 --repo anomalyco/opencode --pattern "$CLIENT_ASSET" --dir target/client-memory-tools
          gh release download fun-refactor-v0.54.0 --repo e6qu/fun-refactor --pattern "$FR_ASSET" --dir target/client-memory-tools
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, zipfile
          root = pathlib.Path('target/client-memory-tools')
          for variable, digest, destination in [('CLIENT_ASSET', 'CLIENT_SHA', 'client'), ('FR_ASSET', 'FR_SHA', 'fr')]:
              archive = root / os.environ[variable]
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ[digest]
              if archive.suffix == '.zip':
                  with zipfile.ZipFile(archive) as source:
                      assert source.namelist() == ['opencode']
                      source.extractall(root / destination)
                  (root / destination / 'opencode').chmod(0o755)
              else:
                  with tarfile.open(archive) as source:
                      source.extractall(root / destination, filter='data')
              archive.unlink()
          binaries = list((root / 'fr').glob('*/fr'))
          assert len(binaries) == 1
          binaries[0].rename(root / 'fr' / 'fr')
          PY
      - name: Measure six serial model-free runs without granting admission
        run: >-
          python3 -B tools/check-client-memory.py measure target/client-memory --profile --experiment catalog
          --catalog tests/agent-eval/opencode/catalog/2026-10-07/catalog.json
          --fr target/client-memory-tools/fr/fr
          --opencode target/client-memory-tools/client/opencode
      - name: Verify provider endpoint resolution without model calls or credentials
        run: >-
          python3 -B tools/check-client-catalog.py target/client-catalog
          --opencode target/client-memory-tools/client/opencode
          --catalog tests/agent-eval/opencode/catalog/2026-10-07/catalog.json
      - name: Publish the separate memory admission decision
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('target/client-memory/result.json').read_bytes())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Memory admission: ' + ('PASSED' if result['admitted'] else 'BLOCKED') + '\n\n')
              summary.write('Successful measurement does not authorize local model work.\n\n')
              summary.write('| Mode | Completed | Peak MiB | Stop reason |\n| --- | --- | --- | --- |\n')
              for row in result['cases']:
                  process = row['process']
                  summary.write(f"| {row['id']} | {row['completed']} | {process['sampled_aggregate_rss_bytes'] / 1024**2:.2f} | {process['stop_reason']} |\n")
              summary.write('\nProcess attribution at each aggregate peak:\n\n')
              for row in result['cases']:
                  peak = row['profile']['peak']['sample']
                  summary.write(f"\n{row['id']}: {peak['phase_before']} to {peak['phase_after']}\n\n")
                  for process in sorted(peak['processes'], key=lambda p: -p['rss_bytes']):
                      summary.write(f"- {process['executable']}: {process['rss_bytes'] / 1024**2:.2f} MiB\n")
          PY
      - name: Verify frozen reasoning variants at the loopback provider
        run: >-
          python3 -B tools/check-review-reasoning.py check target/review-reasoning
          --fr target/client-memory-tools/fr/fr
          --opencode target/client-memory-tools/client/opencode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-memory-${{ matrix.runner }}
          path: |
            target/client-memory
            target/client-catalog
            target/review-reasoning
          retention-days: 7
