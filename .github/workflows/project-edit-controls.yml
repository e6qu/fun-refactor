name: M2 code-change acceptance controls
on:
  push:
    branches: [milestone/dependable-project-changes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m2-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    name: Independent M2 check (${{ matrix.task }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [rust-parameter, typescript-alias, regex-escape-len, python-invoice]
    env:
      PYTHONPATH: tools
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools
            sdk/python/src
            tests/agent-eval/project-edits
            tests/agent-eval/selected-agents
            tests/agent-eval/regex
            tests/agent-eval/unknown-target
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
      - name: Check task boundaries before installing compilers
        run: python3 -B -m unittest discover -s tools/agent_eval -p 'test_project_edits*.py' -v
      - uses: actions/setup-node@v7
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Install the exact Python check wheels
        run: |
          grep -E '/(pytest|pluggy|packaging|iniconfig|pygments)-' \
            .github/actions/native-tools/python-wheels.txt > "$RUNNER_TEMP/m2-python-wheels.txt"
          test "$(wc -l < "$RUNNER_TEMP/m2-python-wheels.txt")" -eq 5
          python3 -m pip install --no-index --no-deps --require-hashes --requirement "$RUNNER_TEMP/m2-python-wheels.txt"
      - name: Prepare the checksum-verified TypeScript checker
        run: |
          python3 -B - <<'PY'
          import base64, hashlib, io, json, os, tarfile, urllib.request
          from pathlib import Path
          settings = json.loads(Path('tests/agent-eval/project-edits/checkers.json').read_text())['typescript']
          with urllib.request.urlopen(settings['url'], timeout=30) as response:
              data = response.read(16 * 1024**2 + 1)
          assert len(data) <= 16 * 1024**2
          expected = 'sha512-' + base64.b64encode(hashlib.sha512(data).digest()).decode()
          assert expected == settings['integrity']
          destination = Path(os.environ['RUNNER_TEMP']) / 'm2-typescript'
          destination.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              entries = archive.getmembers()
              assert len(entries) <= 1024 and sum(entry.size for entry in entries) <= 64 * 1024**2
              assert all(Path(entry.name).parts[0] == 'package' and not (entry.issym() or entry.islnk()) for entry in entries)
              archive.extractall(destination, filter='data')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('M2_TYPESCRIPT=' + str(destination / 'package/bin/tsc') + '\n')
          PY
          node "$RUNNER_TEMP/m2-typescript/package/bin/tsc" --version
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Pin the actual checker paths
        run: |
          echo "M2_CARGO=$(rustup which --toolchain 1.99.1 cargo)" >> "$GITHUB_ENV"
          echo "M2_RUSTC=$(rustup which --toolchain 1.99.1 rustc)" >> "$GITHUB_ENV"
          node --version
          rustc --version
          python3 --version
      - uses: actions/cache@v6
        with:
          path: target/cargo-home/registry
          key: m2-registry-${{ hashFiles('tests/agent-eval/regex/Cargo.lock') }}
      - name: Prepare the unchanged public task source
        run: >-
          python3 -B -m agent_eval.project_edits_tasks prepare
          --task ${{ matrix.task }} --output "$RUNNER_TEMP/m2-inputs"
      - name: Fetch only the pinned regex dependency graph
        if: matrix.task == 'regex-escape-len'
        run: >-
          timeout 120 "$M2_CARGO" fetch --locked
          --manifest-path "$RUNNER_TEMP/m2-inputs/original/Cargo.toml"
      - name: Check supplied wrong and correct changes, receiver, undo and redo
        run: >-
          python3 -B -m agent_eval.project_edits_tasks controls
          --task ${{ matrix.task }} --inputs "$RUNNER_TEMP/m2-inputs" --output "$RUNNER_TEMP/m2-controls"
          --python "$(command -v python3)" --cargo "$M2_CARGO" --rustc "$M2_RUSTC"
          --node "$(command -v node)" --typescript "$M2_TYPESCRIPT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m2-${{ matrix.task }}-controls
          path: |
            ${{ runner.temp }}/m2-inputs/preparation
            ${{ runner.temp }}/m2-controls/**/*.json
            ${{ runner.temp }}/m2-controls/*.patch
          if-no-files-found: error
          retention-days: 30
