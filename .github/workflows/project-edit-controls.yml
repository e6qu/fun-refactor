name: M2 code-change acceptance controls
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: m2-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    name: Independent M2 check (${{ matrix.task }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [rust-parameter, typescript-alias, regex-escape-len, python-invoice]
    env:
      PYTHONPATH: tools
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      RUSTFLAGS: ''
      CARGO_ENCODED_RUSTFLAGS: ''
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools
            sdk/python/src
            tests/agent-eval/project-edits
            tests/agent-eval/selected-agents
            tests/agent-eval/regex
            tests/agent-eval/unknown-target
      - uses: ./.github/actions/project-edit-checkers
      - name: Check task boundaries
        run: python3 -B -m unittest discover -s tools/agent_eval -p 'test_project_edits*.py' -v
      - uses: actions/cache@v6
        with:
          path: target/cargo-home/registry
          key: m2-registry-${{ hashFiles('tests/agent-eval/regex/Cargo.lock') }}
      - name: Prepare the unchanged public task source
        run: >-
          python3 -B -m agent_eval.project_edits_tasks prepare
          --task ${{ matrix.task }} --output "$RUNNER_TEMP/m2-inputs"
      - name: Fetch only the pinned regex dependency graph
        if: matrix.task == 'regex-escape-len'
        run: >-
          timeout 120 "$M2_CARGO" fetch --locked
          --manifest-path "$RUNNER_TEMP/m2-inputs/original/Cargo.toml"
      - name: Check supplied wrong and correct changes, receiver, undo and redo
        run: >-
          python3 -B -m agent_eval.project_edits_tasks controls
          --task ${{ matrix.task }} --inputs "$RUNNER_TEMP/m2-inputs" --output "$RUNNER_TEMP/m2-controls"
          --python "$(command -v python3)" --cargo "$M2_CARGO" --rustc "$M2_RUSTC"
          --node "$(command -v node)" --typescript "$M2_TYPESCRIPT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m2-${{ matrix.task }}-controls
          path: |
            ${{ runner.temp }}/m2-inputs/preparation
            ${{ runner.temp }}/m2-controls/**/*.json
            ${{ runner.temp }}/m2-controls/*.patch
          if-no-files-found: error
          retention-days: 30
