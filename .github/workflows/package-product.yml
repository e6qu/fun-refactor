name: Package and qualify product

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            libc: musl
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
            libc: musl
          - target: x86_64-apple-darwin
            runs-on: macos-15
          - target: aarch64-apple-darwin
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
            !/tests/agent-eval/opencode/
            !/tests/agent-eval/*/*results*/

      - name: Check out the qualification scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .qualification
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      # Compile the C grammars against the same libc as the Rust binary.
      - name: Install the musl toolchain
        if: matrix.libc == 'musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --bin fr --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="fr-v${{ inputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/fr" "dist/$name/"
          cp LICENSE README.md CLI.md "dist/$name/"
          cp -R skills "dist/$name/skills"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check the extracted native package
        run: |
          python3 -B .qualification/tools/check-release-package.py --kind native \
            --archive "dist/${{ steps.package.outputs.name }}.tar.gz" \
            --checksum "dist/${{ steps.package.outputs.name }}.tar.gz.sha256" \
            --version "${{ inputs.version }}" \
            --output "dist/${{ steps.package.outputs.name }}.check.json"

      - uses: actions/upload-artifact@v6
        with:
          name: product-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.check.json
          if-no-files-found: error
          retention-days: 14

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
            !/tests/agent-eval/opencode/
            !/tests/agent-eval/*/*results*/

      - name: Check out the qualification scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .qualification
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check clang can emit wasm
        run: clang --print-targets | grep -q wasm32

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm

      - name: Install wasm-bindgen-cli, matching the lockfile
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the analysis for the browser
        run: ./tools/build-wasm.sh

      - name: Generate the bindings
        run: |
          wasm-bindgen --target web --out-dir web/src/wasm \
            target/wasm32-unknown-unknown/release/fun_refactor.wasm

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="fun-refactor-v${{ inputs.version }}-wasm"
          mkdir -p "dist/$name"
          cp web/src/wasm/* "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check the extracted browser package
        run: |
          python3 -B .qualification/tools/check-release-package.py --kind wasm --web-root web \
            --archive "dist/${{ steps.package.outputs.name }}.tar.gz" \
            --checksum "dist/${{ steps.package.outputs.name }}.tar.gz.sha256" \
            --version "${{ inputs.version }}" \
            --output "dist/${{ steps.package.outputs.name }}.check.json"

      - uses: actions/upload-artifact@v6
        with:
          name: product-wasm
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.check.json
          if-no-files-found: error
          retention-days: 14

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
            !/tests/agent-eval/opencode/
            !/tests/agent-eval/*/*results*/

      - name: Check out the qualification scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .qualification
          sparse-checkout: tools
          persist-credentials: false

      - name: Install the toolchains
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-sdk

      - name: Install the package builder
        run: python -m pip install "build==1.6.1" "setuptools==84.0.0"

      - name: Build the native runtime and SDK distributions
        run: |
          cargo build --release --locked --bin fr
          python -I -m build --no-isolation --outdir dist sdk/python

      - name: Check the wheel and rebuilt source archive in fresh consumers
        run: |
          python -B .qualification/tools/check-sdk-package.py --fr target/release/fr --dist dist \
            --version "${{ inputs.version }}" \
            --output "dist/fun-refactor-ir-v${{ inputs.version }}.check.json"
          ( cd dist && sha256sum *.whl *.tar.gz > "fun-refactor-ir-v${{ inputs.version }}.sha256" )

      - uses: actions/upload-artifact@v6
        with:
          name: product-sdk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

