name: Documentation cleanup preflight
on:
  push:
    branches: [docs/concrete-roadmap-and-guides]
    paths: [.github/workflows/readable-docs-preflight.yml]
permissions:
  contents: write
concurrency:
  group: readable-docs-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
      RAYON_NUM_THREADS: '1'
      PYTHONPATH: ${{ github.workspace }}/sdk/python/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - name: Install the pinned text counter
        run: |
          python3 -m pip install --only-binary=:all: -r tools/agent_eval/requirements.txt
          mkdir -p target/agent-eval-tokenizer
          curl -fsSL --connect-timeout 20 --max-time 120 \
            -o target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790 \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo '446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790' | sha256sum -c -
      - name: Check complete skill navigation, public links and writing
        run: |
          python3 -B tools/test-review-docs.py
          python3 -B tools/review-docs.py --write
          python3 -B tools/test-check-prose.py
          python3 -B tools/check-prose.py
          python3 -c 'import runpy; runpy.run_path("tools/check-agent-skill.py")["check_bundle"]()'
          python3 -B tests/agent-eval/test_roadmap_status.py
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked --bin fr
      - name: Use fr for the final bug-guide heading and exercise reversal
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess
          binary = str(pathlib.Path('target/debug/fr').resolve())
          page = pathlib.Path('BUGS.md')
          original = page.read_bytes()
          before, after = '## Find the next action', '## Choose what to do after a failure'
          expected = original.replace(before.encode(), after.encode())
          assert expected != original and original.count(before.encode()) == 1
          def call(*arguments):
              result = subprocess.run([binary, '--json', '--no-cache', '-C', '.', *arguments],
                                      capture_output=True, text=True, check=True, timeout=30)
              return json.loads(result.stdout)
          arguments = ('file', 'replace', 'BUGS.md', '--before', before, '--after', after, '--matches', '1')
          preview = call(*arguments)
          assert preview['transaction'] is None and page.read_bytes() == original
          saved = call(*arguments, '--save-plan')
          transaction = str(saved['transaction'])
          assert page.read_bytes() == original
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bug-guide.patch'
          call('history', 'patch', transaction, '--output', str(patch))
          diff = patch.read_text()
          assert '-'+before in diff and '+'+after in diff
          print(diff)
          call('history', 'apply', transaction, '--write')
          assert page.read_bytes() == expected
          call('history', 'undo', transaction)
          assert page.read_bytes() == expected
          call('history', 'undo', transaction, '--write')
          assert page.read_bytes() == original
          call('history', 'redo', transaction, '--write')
          assert page.read_bytes() == expected
          PY
      - name: Execute the introductory and Python lesson code
        run: python3 -B tools/reader_examples.py --fr target/debug/fr
      - name: Check documentation facts against the implementation
        run: cargo test --locked --test docs_links --test docs_ir --test docs_census --test capability_matrix -- --test-threads 1
      - name: Save the checked documentation and actual fr edit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B tools/review-docs.py --write
          git add BUGS.md docs/roadmap-status.md docs/roadmap-status.json docs/native-change-outcomes.md docs/native-read-outcomes.md tools/PROSE-DEBT tests/agent-eval/context-protocol-v3.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: apply reviewed bug-guide edit and refresh generated pages'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
