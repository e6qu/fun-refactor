name: Optimized Python request costs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/python-startup-cost.py'
      - 'tools/test-python-startup-cost.py'
      - 'tools/project-profile.rs'
      - 'tests/agent-eval/python-startup-cost/**'
      - '.github/workflows/python-startup-cost.yml'
permissions:
  contents: read
concurrency:
  group: python-startup-cost-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check controls that reject misleading measurements
        run: python3 -B tools/test-python-startup-cost.py
  build:
    needs: controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: optimized-python-cost
      - run: cargo build --locked --release --bin fr --example project-profile
      - name: Record the compiled source, compiler and executable identities
        run: |
          git rev-parse HEAD > target/release/source.txt
          rustc --version > target/release/rustc.txt
          cd target/release
          sha256sum fr examples/project-profile > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: optimized-python-cost-binaries
          path: |
            target/release/fr
            target/release/examples/project-profile
            target/release/source.txt
            target/release/rustc.txt
            target/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  measure:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: optimized-python-cost-binaries
          path: target/release
      - run: chmod +x target/release/fr target/release/examples/project-profile
      - name: Verify the binaries came from this exact source and compiler
        run: |
          test "$(cat target/release/source.txt)" = "$(git rev-parse HEAD)"
          test "$(cat target/release/rustc.txt)" = "$(rustc --version)"
          cd target/release
          sha256sum --check SHA256SUMS
      - name: Measure ordinary requests and separate diagnostic sequences
        run: >-
          python3 -B tools/python-startup-cost.py --fr target/release/fr
          --profiler target/release/examples/project-profile
          --repetitions 5 --profile-repetitions 3
          --output "$RUNNER_TEMP/python-startup-cost"
      - name: Independently check every saved request
        run: python3 -B tools/python-startup-cost.py --audit-set "$RUNNER_TEMP/python-startup-cost"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: optimized-python-startup-cost
          path: ${{ runner.temp }}/python-startup-cost/
          retention-days: 30
          if-no-files-found: error
