name: Lean audit

# The PR lane runs the kernel build and its compact proof corpus. The two proofs
# below generate full self-refactor plans and are intentionally exhaustive, which
# makes them unsuitable for every edit-push cycle. This workflow keeps them as a
# complete audit of merged main and provides a manual recovery path.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: lean-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  audit:
    name: Full self-refactor proof audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache the Lean toolchain
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: /opt/lean
          key: lean-4.28.0-linux-x86_64

      - name: Install Lean
        if: steps.lean-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LEAN=4.28.0
          LEAN_SHA=ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 600 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN}/lean-${LEAN}-linux.tar.zst" \
            || { echo "could not fetch Lean within the time allowed"; exit 1; }
          echo "${LEAN_SHA}  /tmp/lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1

      - name: Put Lean on the path
        run: |
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-audit

      - name: Prove every compact and whole-project edit plan
        run: cargo test --test lean_kernels -- --include-ignored
