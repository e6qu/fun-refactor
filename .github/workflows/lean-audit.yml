name: Deep validation

# The PR lane runs focused regressions and compact proofs. This lane retains the
# repository-scale cross-checks, where every source is repeatedly indexed or
# translated, without making each review wait for them.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      external_replays_only:
        description: Run pinned external patch replays without repository-wide audits
        type: boolean
        default: false

concurrency:
  group: lean-audit-${{ github.ref }}
  # New pushes replace older audits; scheduled checks wait for an active audit.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    if: ${{ !inputs.external_replays_only }}
    name: Build repository command audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optimize the repository scans while keeping test-profile assertions.
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-audit
      - name: Check inventory and executable controls
        run: python3 tools/test-deep-audit.py
      - name: Compile the complete command audit executable
        run: python3 tools/deep-audit.py build --output target/deep-audit-binaries
      - uses: actions/upload-artifact@v7
        with:
          name: command-audit-binaries
          path: target/deep-audit-binaries/
          if-no-files-found: error
          retention-days: 7

  audit:
    needs: prepare
    if: ${{ !inputs.external_replays_only }}
    name: Repository audit (${{ matrix.target }}-${{ matrix.index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: commands_agree, index: 0}
          - {target: commands_agree, index: 1}
          - {target: commands_agree, index: 2}
          - {target: commands_agree, index: 3}
          - {target: commands_agree, index: 4}
          - {target: commands_agree, index: 5}
          - {target: conformance, index: 0}
          - {target: round_trip, index: 0}
          - {target: self_translation, index: 0}
          - {target: lean_kernels, index: 0}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        if: matrix.target != 'commands_agree'
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v7
        if: matrix.target == 'conformance'
        with:
          node-version: '26.5.0'
          package-manager-cache: false
      - name: Install the declared TypeScript checker
        if: matrix.target == 'conformance'
        working-directory: tests/typesafety/typescript
        run: |
          npm ci --no-fund --no-audit
          echo "$GITHUB_WORKSPACE/tests/typesafety/typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/go-toolchain
        if: matrix.target == 'conformance'
      - uses: ./.github/actions/java-toolchain
        if: matrix.target == 'conformance'

      - name: Install Zig for the conformance matrix
        if: matrix.target == 'conformance'
        timeout-minutes: 5
        uses: ./.github/actions/zig-toolchain

      - name: Cache the Lean toolchain
        if: matrix.target == 'conformance' || matrix.target == 'lean_kernels'
        id: lean-cache
        uses: actions/cache@v6
        with:
          path: /opt/lean
          key: lean-4.28.0-linux-x86_64

      - name: Install Lean
        if: (matrix.target == 'conformance' || matrix.target == 'lean_kernels') && steps.lean-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LEAN=4.28.0
          LEAN_SHA=ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 600 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN}/lean-${LEAN}-linux.tar.zst" \
            || { echo "could not fetch Lean within the time allowed"; exit 1; }
          echo "${LEAN_SHA}  /tmp/lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1

      - name: Put Lean on the path
        if: matrix.target == 'conformance' || matrix.target == 'lean_kernels'
        run: |
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version

      - uses: Swatinem/rust-cache@v2
        if: matrix.target != 'commands_agree'
        with:
          key: lean-audit

      - uses: actions/download-artifact@v8
        if: matrix.target == 'commands_agree'
        with:
          name: command-audit-binaries
          path: target/deep-audit-binaries

      - name: Run the assigned audit inventory
        env:
          TARGET: ${{ matrix.target }}
          INDEX: ${{ matrix.index }}
        run: |
          if [ "$TARGET" = commands_agree ]; then
            python3 tools/deep-audit.py "$TARGET" "$INDEX" --binary-directory target/deep-audit-binaries
          else
            python3 tools/deep-audit.py "$TARGET" "$INDEX"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: deep-${{ matrix.target }}-${{ matrix.index }}
          path: target/deep-audit/*.json
          if-no-files-found: error
          retention-days: 7

  external-replays:
    name: External replay (${{ matrix.cohort }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cohort:
          - 2026-09-08-regex
          - 2026-09-08-coordinated
          - 2026-09-09-structural-authoring
          - 2026-09-11-context-v3
          - 2026-09-11-workflow-v4
          - unknown-target
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-audit
      - name: Replay upstream tests, independent oracles and exact patch reversal
        env:
          COHORT: ${{ matrix.cohort }}
        run: bash tools/check-external-replays.sh --cohort "$COHORT"

  complete:
    name: Complete deep audit
    needs: [prepare, audit, external-replays]
    if: ${{ !cancelled() && !inputs.external_replays_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all audits and external replays
        env:
          PREPARE: ${{ needs.prepare.result }}
          AUDIT: ${{ needs.audit.result }}
          REPLAYS: ${{ needs.external-replays.result }}
        run: test "$PREPARE" = success && test "$AUDIT" = success && test "$REPLAYS" = success
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deep-*
          path: target/deep-audit
          merge-multiple: true
      - name: Require every discovered audit test exactly once
        run: python3 tools/deep-audit.py verify
