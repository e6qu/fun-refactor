name: Deep validation

# The PR lane runs focused regressions and compact proofs. This lane retains the
# repository-scale cross-checks, where every source is repeatedly indexed or
# translated, without making each review wait for them.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: lean-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  audit:
    name: Full repository audit
    runs-on: ubuntu-latest
    # A cold whole-repository audit has five intentionally exhaustive checks.
    # Forty-five minutes permits that work while still failing a stalled runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Zig for the conformance matrix
        timeout-minutes: 5
        run: |
          set -euo pipefail
          ZIG=0.16.0
          ZIG_SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 120 -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG}/zig-x86_64-linux-${ZIG}.tar.xz" \
            || { echo "could not fetch Zig within the time allowed"; exit 1; }
          echo "${ZIG_SHA}  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          sudo ln -sf "/tmp/zig-x86_64-linux-${ZIG}/zig" /usr/local/bin/zig
          zig version

      - name: Cache the Lean toolchain
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: /opt/lean
          key: lean-4.28.0-linux-x86_64

      - name: Install Lean
        if: steps.lean-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LEAN=4.28.0
          LEAN_SHA=ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 600 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN}/lean-${LEAN}-linux.tar.zst" \
            || { echo "could not fetch Lean within the time allowed"; exit 1; }
          echo "${LEAN_SHA}  /tmp/lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1

      - name: Put Lean on the path
        run: |
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-audit

      - name: Run every repository-scale audit
        run: ./tools/check.sh deep
