name: Deep validation

# The PR lane runs focused regressions and compact proofs. This lane retains the
# repository-scale cross-checks, where every source is repeatedly indexed or
# translated, without making each review wait for them.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      external_replays_only:
        description: Run pinned external patch replays without repository-wide audits
        type: boolean
        default: false

concurrency:
  group: lean-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  audit:
    if: ${{ !inputs.external_replays_only }}
    name: Repository audit (${{ matrix.target }}-${{ matrix.index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: commands_agree, index: 0}
          - {target: commands_agree, index: 1}
          - {target: commands_agree, index: 2}
          - {target: commands_agree, index: 3}
          - {target: commands_agree, index: 4}
          - {target: commands_agree, index: 5}
          - {target: conformance, index: 0}
          - {target: round_trip, index: 0}
          - {target: self_translation, index: 0}
          - {target: lean_kernels, index: 0}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Install Zig for the conformance matrix
        timeout-minutes: 5
        uses: ./.github/actions/zig-toolchain

      - name: Cache the Lean toolchain
        id: lean-cache
        uses: actions/cache@v6
        with:
          path: /opt/lean
          key: lean-4.28.0-linux-x86_64

      - name: Install Lean
        if: steps.lean-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LEAN=4.28.0
          LEAN_SHA=ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 600 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN}/lean-${LEAN}-linux.tar.zst" \
            || { echo "could not fetch Lean within the time allowed"; exit 1; }
          echo "${LEAN_SHA}  /tmp/lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1

      - name: Put Lean on the path
        run: |
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-audit

      - name: Run the assigned audit inventory
        env:
          TARGET: ${{ matrix.target }}
          INDEX: ${{ matrix.index }}
        run: python3 tools/deep-audit.py "$TARGET" "$INDEX"
      - uses: actions/upload-artifact@v7
        with:
          name: deep-${{ matrix.target }}-${{ matrix.index }}
          path: target/deep-audit/*.json
          if-no-files-found: error
          retention-days: 7

  external-replays:
    name: External replay (${{ matrix.cohort }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cohort:
          - 2026-09-08-regex
          - 2026-09-08-coordinated
          - 2026-09-09-structural-authoring
          - 2026-09-11-context-v3
          - 2026-09-11-workflow-v4
          - unknown-target
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-audit
      - name: Replay upstream tests, independent oracles and exact patch reversal
        env:
          COHORT: ${{ matrix.cohort }}
        run: bash tools/check-external-replays.sh --cohort "$COHORT"

  complete:
    name: Complete deep audit
    needs: [audit, external-replays]
    if: ${{ !cancelled() && !inputs.external_replays_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all audits and external replays
        env:
          AUDIT: ${{ needs.audit.result }}
          REPLAYS: ${{ needs.external-replays.result }}
        run: test "$AUDIT" = success && test "$REPLAYS" = success
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deep-*
          path: target/deep-audit
          merge-multiple: true
      - name: Require every discovered audit test exactly once
        run: python3 tools/deep-audit.py verify
