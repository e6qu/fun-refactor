name: Configured change controls

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/terminal-changes.yml
      - tools/agent_eval/**
      - tools/terminal-changes.py
      - tools/check-terminal-changes.py
      - tools/test-packaging-admission.py
      - tests/agent-eval/opencode/reviews/2026-10-07-packaging-scoped/**
      - tests/agent-eval/opencode/catalog/**

concurrency:
  group: terminal-changes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Configured changes (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            client: opencode-linux-x64-baseline.tar.gz
            client_sha: 24b0d458d21ef548b2752166303defcf7f4945b049fb4876ab78dfaf86d81b27
            fr: fr-v0.54.0-x86_64-unknown-linux-musl.tar.gz
            fr_sha: beaf1ad0317c5e3362a4a96635efccb0cd59626fd783fea72257f420882541b9
          - runner: macos-14
            client: opencode-darwin-arm64.zip
            client_sha: 8522b70f545184b3a8d97c5ca4f814093b2476d72aebfda8c48bcd072ec31d1b
            fr: fr-v0.54.0-aarch64-apple-darwin.tar.gz
            fr_sha: bb8d04340518791e58f4f71ed018d5bba50ca8905a284eb20509b58bb8f7386f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check task admission and change replay offline
        run: |
          python3 -B tools/test-packaging-admission.py
          python3 -B tools/test-change-memory.py
          python3 -B tools/test-scoped-reviews.py
          python3 -B tools/agent_eval/test_terminal_changes.py
          python3 -B tools/agent_eval/test_native_changes.py
          python3 -B tools/agent_eval/test_structured_submission.py
      - name: Download pinned released tools through gh
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_ASSET: ${{ matrix.client }}
          CLIENT_SHA: ${{ matrix.client_sha }}
          FR_ASSET: ${{ matrix.fr }}
          FR_SHA: ${{ matrix.fr_sha }}
        run: |
          mkdir -p target/change-tools/client target/change-tools/fr
          gh release download v1.18.34 --repo anomalyco/opencode --pattern "$CLIENT_ASSET" --dir target/change-tools
          gh release download fun-refactor-v0.54.0 --repo e6qu/fun-refactor --pattern "$FR_ASSET" --dir target/change-tools
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, zipfile
          root = pathlib.Path('target/change-tools')
          for variable, digest, destination in [('CLIENT_ASSET', 'CLIENT_SHA', 'client'), ('FR_ASSET', 'FR_SHA', 'fr')]:
              archive = root / os.environ[variable]
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ[digest]
              if archive.suffix == '.zip':
                  with zipfile.ZipFile(archive) as source:
                      assert source.namelist() == ['opencode']
                      source.extractall(root / destination)
                  (root / destination / 'opencode').chmod(0o755)
              else:
                  with tarfile.open(archive) as source:
                      source.extractall(root / destination, filter='data')
              archive.unlink()
          binaries = list((root / 'fr').glob('*/fr'))
          assert len(binaries) == 1
          binaries[0].rename(root / 'fr' / 'fr')
          PY
      - name: Exercise ordinary and fr edits with both configured provider profiles
        run: >-
          python3 -B tools/check-terminal-changes.py check target/terminal-changes
          --fr target/change-tools/fr/fr --opencode target/change-tools/client/opencode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terminal-changes-${{ matrix.runner }}
          path: target/terminal-changes
          retention-days: 7
