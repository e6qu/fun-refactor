        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked --bin fr
      - name: Check Python imports and saved answers independently
        run: |
          python3 -m pip install 'pytest==9.1.1'
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_shared_named_imports.py sdk/python/tests/test_shared_star_imports.py sdk/python/tests/test_star_imports.py sdk/python/tests/test_flow_imports.py sdk/python/tests/test_flow_reexports.py sdk/python/tests/test_flow_module_aliases.py sdk/python/tests/test_function_aliases.py sdk/python/tests/test_value_imports.py sdk/python/tests/test_named_default_declarations.py sdk/python/tests/test_postponed_annotations.py sdk/python/tests/test_namespace_packages.py sdk/python/tests/test_package_bindings.py sdk/python/tests/test_package_flow.py sdk/python/tests/test_flow_storage.py sdk/python/tests/test_flow_summaries.py

  workflow-routes:
    if: inputs.group == 'workflow-routes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check source-binding fixtures before compiling and collecting
        run: |
          python3 -B tools/test-workflow-evidence-basis.py
          python3 -B tools/test-native-source-inputs.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check workflow recovery and build the CLI
        run: cargo test --locked --test workflow_cli -- --test-threads 1
      - name: Check guided review integrity
        run: |
          python3 -m pip install 'pytest==9.1.1' 'ty==0.0.80'
          ty check sdk/python/src
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_guide.py sdk/python/tests/test_guide_bodies.py
          python3 -B tools/test-guide-body-native.py
      - name: Compare body preparation and applied-state recovery
        run: python3 -B tools/guide-body-context.py --output target/workflow-routes/guide-body-context.json
      - name: Compare checked recovery and receiver delivery
        run: python3 -B tools/recovery-delivery-context.py --output target/workflow-routes/recovery-delivery-context.json
      - name: Compare editing routes and refusals
        run: python3 -B tools/workflow-route-context.py --output target/workflow-routes/result.json
      - name: Refresh the scalar guide comparison
        run: python3 -B tools/agent-guide-context.py --output target/workflow-routes/agent-guide-context.json
      - name: Reject corrupted fresh workflow evidence
        env:
          FR_WORKFLOW_ROUTE_REPORT: target/workflow-routes/result.json
          FR_GUIDE_BODY_REPORT: target/workflow-routes/guide-body-context.json
          FR_RECOVERY_DELIVERY_REPORT: target/workflow-routes/recovery-delivery-context.json
        run: |
          python3 -B tools/test-retain-python-contract.py
          python3 -B tools/test-workflow-route-context.py
          python3 -B tools/test-guide-body-context.py
          python3 -B tools/test-recovery-delivery-context.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-routes
          path: target/workflow-routes
          if-no-files-found: error
          retention-days: 7

  source-repair:
    if: inputs.group == 'source-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
