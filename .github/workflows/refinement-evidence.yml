name: Refresh refinement evidence
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Dated name for new evidence directories
        required: true
        type: string
      group:
        description: Evidence group to regenerate
        type: choice
        default: all
        options:
          - all
          - model-comparisons
          - retained-proofs
          - agent-guide-context
          - completion-workflows
          - intent-action-context
          - index-resolution
          - host-recovery
          - flow
          - dependency
          - contexts
          - compiler-evidence
          - resumable-correspondence
          - semantic-evidence
          - index-consumers
          - flow-fixed-point
          - recursive-flow
          - flow-facts
          - imported-flow
          - flow-cache
          - package-flow
          - package-reexports
          - module-aliases
          - expression-control
          - call-binding
          - literal-defaults
          - namespace-packages
          - scalar-assignments
          - python-repositories
          - discovery-pages
          - roadmap-report
          - context-projection
          - workflow-routes
          - source-repair
          - compiler-profile
          - python-contract
          - python-report-writes
          - python-report-audit
          - retain-python-contract
          - retain-workflows
          - repository-flow-coverage
          - repository-flow-held-out
          - retain-repository-flow
          - flow-contract
          - scalar-development
          - package-questions-development
          - package-questions-coverage
          - package-questions-held-out
          - retain-package-questions
          - docs-review
          - freeze-repository-flow
          - retain-scalar
          - retain-ci-reports
          - retain-contract-failure
          - fixed-arity-probes
          - go-toolchain
          - project-change-inspect
          - project-change-development
          - project-change-delivery
          - project-change-findings
          - project-change-freeze
          - project-change-held-out
          - project-change-retain
      collection_run:
        description: Successful collection run ID for Python or workflow retention
        required: false
        default: ''
        type: string
      repair_run:
        description: Successful source-repair run ID for retain-workflows
        required: false
        default: ''
        type: string
      held_out_run:
        description: Successful held-out run for repository-flow retention
        type: string
        default: ''
      failure_run:
        description: Historical failed collector run to preserve
        type: string
        default: ''
      admission_failure_run:
        description: Failed held-out admission with no downloaded snapshot
        type: string
        default: ''
      inspection_failure_run:
        description: Historical held-out inspection failure to preserve
        type: string
        default: ''
      evidence_runs:
        description: JSON map of hosted collection names to run IDs
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: refinement-evidence-${{ github.ref }}-${{ inputs.group }}
  cancel-in-progress: true
jobs:
  project-changes:
    if: startsWith(inputs.group, 'project-change-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            src
            grammars
            crates
            queries
            catalogs
            kernels
            sdk/python/src
            sdk/python/tests
            tools
            tests/agent-eval/project-changes
            tests/agent-eval/package-questions
            tests/agent-eval/python-repository-flow
            tests/agent-eval/python-repositories/boltons.tar.gz
            tests/agent-eval/results/2026-10-20-leap-year-package-questions-coverage
            tests/agent-eval/results/2026-10-20-leap-year-package-questions-held-out
            tests/agent-eval/results/2026-10-19-original-package-questions-package-questions-held-out/receipt.json
            tests/native_fingerprint.rs
            tests/common
            tests/fixtures
            recipes
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Format project-change support on the runner
        if: inputs.group == 'project-change-development'
        run: |
          cargo fmt --all
          git diff -- src tests > "$RUNNER_TEMP/project-change-rustfmt.patch"
      - run: cargo build --locked --bin fr
      - name: Synchronize the reviewed admission rule through fr
        if: inputs.group == 'project-change-development'
        run: |
          target/debug/fr --json -C . spec sync kernels/FrKernels/Project.lean --write > "$RUNNER_TEMP/project-change-spec-sync.json"
          git diff -- src kernels tests > "$RUNNER_TEMP/project-change-rustfmt.patch"
      - name: Use fr to inspect its own change and invalidation code
        id: inspection
        run: >-
          python3 -B tools/project-changes.py inspect --fr target/debug/fr
          --output "$RUNNER_TEMP/project-change-inspection"
      - name: Check reviewed Python and Rust changes and saved findings
        if: inputs.group == 'project-change-development'
        run: |
          python3 -m pip install 'pytest==9.1.1' 'ty==0.0.80'
          ty check sdk/python/src
          python3 -B tools/test-native-source-inputs.py
          cargo test --locked --test native_fingerprint
          cargo test --locked --lib rust_path_prefixes_and_attributes_do_not_name_same_spelled_values
          cargo test --locked --lib unresolved_procedural_attributes_still_block_same_named_function_edits
          cargo test --locked --lib rust_complementary_cfg
          cargo test --locked --lib a_call_through_an_import_alias_resolves_to_the_original
          cargo test --locked --lib text_replacement_
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_structural_change.py sdk/python/tests/test_python_structural_change.py sdk/python/tests/test_investigation.py sdk/python/tests/test_change_scope.py
      - name: Recheck earlier package questions with the current checker
        id: prior-questions
        if: inputs.group == 'project-change-development'
        run: |
          cargo build --locked --bin fr
          python3 -m pip install --only-binary=:all: --require-hashes -r tests/agent-eval/python-repository-flow/runtime-requirements.txt
          python3 -B tools/package_question_replay.py --fr target/debug/fr --output "$RUNNER_TEMP/project-change-prior-questions"
      - name: Prepare original project checks
        if: contains(fromJSON('["project-change-delivery", "project-change-freeze", "project-change-retain"]'), inputs.group)
        run: python3 -m pip install 'pytest==9.1.1'
      - name: Deliver original Rust and Python renames through fr
        id: delivery
        if: inputs.group == 'project-change-delivery'
        run: >-
          python3 -B tools/project-changes.py delivery --fr target/debug/fr
          --output "$RUNNER_TEMP/project-change-delivery"
      - name: Build and demonstrate the real checker difference
        id: checkers
        if: contains(fromJSON('["project-change-findings", "project-change-freeze", "project-change-held-out", "project-change-retain"]'), inputs.group)
        run: >-
          python3 -B tools/project_change_checkers.py --fr target/debug/fr
          --output "$RUNNER_TEMP/project-change-checkers"
      - name: Reopen findings after changes to original familiar projects
        id: findings
        if: inputs.group == 'project-change-findings'
        run: >-
          python3 -B tools/project-changes.py findings
          --fr "$RUNNER_TEMP/project-change-checkers/production-fr"
          --alternate "$RUNNER_TEMP/project-change-checkers/alternate-fr"
          --output "$RUNNER_TEMP/project-change-findings"
      - name: Record the checked procedure before opening unread source
        id: freeze
        if: inputs.group == 'project-change-freeze'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.evidence_runs }}
        run: >-
          python3 -B tools/project_change_gate.py --runs "$RUNS"
          --fr "$RUNNER_TEMP/project-change-checkers/production-fr"
          --alternate "$RUNNER_TEMP/project-change-checkers/alternate-fr"
      - name: Run the first reserved unread-project evaluation
        id: held-out
        if: inputs.group == 'project-change-held-out'
        run: >-
          python3 -B tools/project-changes.py held-out
          --fr "$RUNNER_TEMP/project-change-checkers/production-fr"
          --alternate "$RUNNER_TEMP/project-change-checkers/alternate-fr"
          --output "$RUNNER_TEMP/project-change-held-out"
      - name: Audit and retain every original project outcome
        id: retention
        if: inputs.group == 'project-change-retain'
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
          FAILURES: ${{ inputs.failure_run }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          python3 -B tools/retain-project-changes.py --run "$COLLECTION_RUN" \
            --failures "$FAILURES" --prefix "$EVIDENCE_PREFIX" \
            --fr "$RUNNER_TEMP/project-change-checkers/production-fr" \
            --alternate "$RUNNER_TEMP/project-change-checkers/alternate-fr"
          python3 -B tools/test-project-change-audit.py \
            --report "tests/agent-eval/results/$EVIDENCE_PREFIX-project-changes/result.json" \
            --fr "$RUNNER_TEMP/project-change-checkers/production-fr" \
            --alternate "$RUNNER_TEMP/project-change-checkers/alternate-fr"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: project-change-rustfmt
          path: |
            ${{ runner.temp }}/project-change-rustfmt.patch
            ${{ runner.temp }}/project-change-spec-sync.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.inspection.outcome != 'skipped'
        with:
          name: project-change-inspection
          path: ${{ runner.temp }}/project-change-inspection/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.delivery.outcome != 'skipped'
        with:
          name: project-change-delivery
          path: ${{ runner.temp }}/project-change-delivery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.checkers.outcome != 'skipped'
        with:
          name: project-change-checkers
          path: |
            ${{ runner.temp }}/project-change-checkers/*.json
            ${{ runner.temp }}/project-change-checkers/*.patch
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.findings.outcome != 'skipped'
        with:
          name: project-change-findings
          path: ${{ runner.temp }}/project-change-findings/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.freeze.outcome != 'skipped'
        with:
          name: project-change-freeze
          path: |
            tests/agent-eval/project-changes/freeze.json
            tests/agent-eval/project-changes/qualification/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.held-out.outcome != 'skipped'
        with:
          name: project-change-held-out
          path: ${{ runner.temp }}/project-change-held-out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.retention.outcome != 'skipped'
        with:
          name: retained-project-changes
          path: |
            tests/agent-eval/results/${{ inputs.prefix }}-project-changes/
            tests/agent-eval/roadmap.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always() && steps.prior-questions.outcome != 'skipped'
        with:
          name: project-change-prior-questions
          path: ${{ runner.temp }}/project-change-prior-questions/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  record-project-change-freeze:
    if: inputs.group == 'project-change-freeze' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    needs: project-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: project-change-freeze
          path: tests/agent-eval/project-changes
      - name: Commit the qualified implementation and original familiar records
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/agent-eval/project-changes/freeze.json tests/agent-eval/project-changes/qualification
          git commit -m 'test: freeze project changes before the unread evaluation'
          git push origin "HEAD:refs/heads/$BRANCH"

  record-project-change-results:
    if: inputs.group == 'project-change-retain' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    needs: project-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: retained-project-changes
          path: tests/agent-eval
      - name: Commit the audited results and tracking requirements
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-project-changes" tests/agent-eval/roadmap.json
          git commit -m 'test: retain checked real project changes and reconcile tracking'
          git push origin "HEAD:refs/heads/$BRANCH"

  refresh:
    if: inputs.group != 'python-repositories' && inputs.group != 'roadmap-report' && inputs.group != 'discovery-pages' && inputs.group != 'index-resolution' && inputs.group != 'context-projection' && inputs.group != 'workflow-routes' && inputs.group != 'source-repair' && inputs.group != 'compiler-profile' && inputs.group != 'python-contract' && inputs.group != 'python-report-writes' && inputs.group != 'python-report-audit' && inputs.group != 'retain-python-contract' && inputs.group != 'retain-workflows' && inputs.group != 'retain-repository-flow' && inputs.group != 'retain-package-questions' && inputs.group != 'flow-contract' && inputs.group != 'scalar-development' && inputs.group != 'docs-review' && inputs.group != 'freeze-repository-flow' && inputs.group != 'retain-scalar' && inputs.group != 'retain-ci-reports' && inputs.group != 'retain-contract-failure' && inputs.group != 'fixed-arity-probes' && inputs.group != 'go-toolchain' && !startsWith(inputs.group, 'repository-flow-') && !startsWith(inputs.group, 'package-questions-') && !startsWith(inputs.group, 'project-change-')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(fromJSON('["host-recovery", "completion-workflows", "retained-proofs", "intent-action-context", "contexts"]'), inputs.group) && 15 || 60 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      FR_LEAN_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      RUST_TEST_THREADS: '1'
      RUSTFLAGS: '-D warnings'
      FR_EVIDENCE_PREFIX: ${{ inputs.prefix }}
      FR_EVIDENCE_GROUP: ${{ inputs.group }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare the pinned context tokenizer
        if: inputs.group == 'contexts'
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/agent_eval/requirements.txt
          mkdir -p "$RUNNER_TEMP/fr-tokenizer"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/fr-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790" \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo "446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  $RUNNER_TEMP/fr-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790" | sha256sum -c -
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/fr-tokenizer" >> "$GITHUB_ENV"
      - name: Cache the Lean toolchain
        id: lean-cache
        uses: actions/cache@v6
        with:
          path: /opt/lean
          key: lean-4.28.0-linux-x86_64
      - name: Install Lean
        if: steps.lean-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LEAN=4.28.0
          LEAN_SHA=ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 600 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN}/lean-${LEAN}-linux.tar.zst" \
            || { echo "could not fetch the Lean toolchain within the time allowed"; exit 1; }
          echo "${LEAN_SHA}  /tmp/lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1
      - name: Put Lean on the path
        run: |
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check virtual workspace boundaries
        if: inputs.group == 'all'
        run: |
          cargo clippy --locked --tests -- -D warnings
          cargo test --locked --test vfs_choke_point --test virtual_model_workspaces
          cargo test --locked --lib spec::refinement::tests
      - name: Check scalar flow boundaries
        if: inputs.group == 'flow'
        run: |
          cargo clippy --locked --tests -- -D warnings
          cargo test --locked --test package_flow --test imported_flow --test flow_summaries --test expression_control --test call_binding --test literal_defaults --test namespace_packages --test scalar_assignments -- --skip acceptance
          cargo build --locked
          python3 -m pip install 'pytest==9.1.1' 'ty==0.0.80'
          ty check sdk/python/src
          PYTHONPATH="$PWD/sdk/python/src" python3 -m pytest -q sdk/python/tests/test_flow_imports.py sdk/python/tests/test_package_flow.py sdk/python/tests/test_flow_reexports.py sdk/python/tests/test_flow_module_aliases.py sdk/python/tests/test_flow_summaries.py sdk/python/tests/test_expression_control.py sdk/python/tests/test_call_binding.py sdk/python/tests/test_literal_defaults.py sdk/python/tests/test_namespace_packages.py sdk/python/tests/test_scalar_assignments.py sdk/python/tests/test_function_declarations.py sdk/python/tests/test_module_literals.py
      - name: Refresh retained evidence
        run: python3 tools/refresh-refinement-evidence.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: refinement-evidence
          path: |
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-evidence
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-refresh-logs
          retention-days: 7

  go-toolchain:
    if: inputs.group == 'go-toolchain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -B tools/test_fetch_verified_ranges.py
      - uses: ./.github/actions/go-toolchain
      - name: Compile and run with the pinned Go compiler
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.2
          test "$(go env GOTOOLCHAIN)" = local
          go_probe="$RUNNER_TEMP/fr-go-probe"
          mkdir -p "$go_probe"
          printf 'package main\nimport "fmt"\nfunc main() { fmt.Println("verified Go") }\n' > "$go_probe/main.go"
          go build -o "$go_probe/check" "$go_probe/main.go"
          test "$("$go_probe/check")" = 'verified Go'

  retain-ci-reports:
    if: inputs.group == 'retain-ci-reports' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check writing and source identity controls
        run: |
          python3 -B tools/check-prose.py
          python3 -B tools/test_flow_cache_basis.py
          python3 -B tools/test-retain-ci-reports.py
      - name: Retain and audit fresh CI reports
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUNS: ${{ inputs.evidence_runs }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: python3 -B tools/retain-ci-reports.py --runs "$EVIDENCE_RUNS" --prefix "$EVIDENCE_PREFIX"
      - name: Commit the checked reports
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-"* tests/agent-eval/roadmap.json tests/retained_proofs.rs docs/roadmap-status.json docs/roadmap-status.md
          git commit -m 'test: retain fresh workflow and recovery reports'
          git push origin "HEAD:refs/heads/$BRANCH"

  fixed-arity-probes:
    if: inputs.group == 'fixed-arity-probes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reject false package answers before compiling
        run: |
          python3 -B tools/test-repository-declarations.py
          python3 -B tools/test-python-repository-flow.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked --bin fr
      - name: Install the pinned upstream oracle dependency
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r tests/agent-eval/python-repository-flow/runtime-requirements.txt
      - name: Replay scalar helpers through actual packages and isolated declarations
        run: python3 -B tools/python-fixed-arity-probes.py --output "$RUNNER_TEMP/fixed-arity-probes-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixed-arity-probes
          path: ${{ runner.temp }}/fixed-arity-probes-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

  retain-scalar:
    if: (inputs.group == 'retain-scalar' || inputs.group == 'retain-contract-failure') && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check retention admission and historical source integrity
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r tests/agent-eval/python-repository-flow/runtime-requirements.txt
          python3 -B tools/test-retain-python-contract.py
          python3 -B tools/test-retain-scalar-evidence.py
          python3 -B tools/test-frozen-repository-flow.py
          python3 -B tools/test-repository-declarations.py
          python3 -B tools/test-frozen-analyzer.py
      - name: Retain and audit the complete current evidence family
        if: inputs.group == 'retain-scalar'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUNS: ${{ inputs.evidence_runs }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: python3 -B tools/retain-scalar-evidence.py --runs "$EVIDENCE_RUNS" --prefix "$EVIDENCE_PREFIX"
      - name: Compare familiar-library outcomes and visited source files
        if: inputs.group == 'retain-scalar'
        env:
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          python3 -B tools/compare-python-library-probes.py \
            tests/agent-eval/results/2026-10-15-shared-star-searches-fixed-arity-probes/result.json \
            "tests/agent-eval/results/$EVIDENCE_PREFIX-fixed-arity-probes/result.json"
      - name: Preserve the failed authored collection with its original source
        if: inputs.group == 'retain-contract-failure'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_RUN: ${{ inputs.failure_run }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: python3 -B tools/retain-failed-python-contract.py --run "$FAILURE_RUN" --prefix "$EVIDENCE_PREFIX"
      - name: Commit the checked current evidence
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
          EVIDENCE_GROUP: ${{ inputs.group }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-"* tests/agent-eval/roadmap.json \
            tools/test-compiler-profile.py tools/test-python-contract.py tools/test-workflow-route-context.py \
            tools/test-guide-body-context.py tools/test-recovery-delivery-context.py \
            tools/test-source-repair-context.py docs/roadmap-status.json docs/roadmap-status.md
          if [ "$EVIDENCE_GROUP" = 'retain-contract-failure' ]; then
            git commit -m 'test: preserve failed authored contract and original validator'
          else
            git commit -m 'test: retain current scalar summary evidence and delivery gates'
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retained-scalar-evidence
          path: tests/agent-eval/results/${{ inputs.prefix }}-*
          if-no-files-found: warn
          retention-days: 7

  freeze-repository-flow:
