      - name: Reject swapped and corrupted hosted artifacts
        run: |
          python3 -B tools/test-retain-python-contract.py
          python3 -B tools/test-workflow-evidence-basis.py
      - name: Verify and retain the complete workflow family
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
          REPAIR_RUN: ${{ inputs.repair_run }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: python3 -B tools/retain-workflow-evidence.py --routes-run "$COLLECTION_RUN" --repair-run "$REPAIR_RUN" --prefix "$EVIDENCE_PREFIX"
      - name: Commit the validated evidence files to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-workflows" \
            "tests/agent-eval/results/$EVIDENCE_PREFIX-source-repair" \
            tools/test-workflow-route-context.py tools/test-guide-body-context.py \
            tools/test-recovery-delivery-context.py tools/test-source-repair-context.py
          git commit -m 'test: retain release-stable workflow evidence'
          git push origin "HEAD:refs/heads/$BRANCH"

  python-report-audit:
    if: inputs.group == 'python-report-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Download the original Python report for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
        run: |
          python3 -c 'import os; assert os.environ["COLLECTION_RUN"].isdigit()'
          python3 -m pip install --only-binary=:all: --require-hashes -r tests/agent-eval/python-repository-flow/runtime-requirements.txt
          gh run download "$COLLECTION_RUN" --name python-contract --dir "$RUNNER_TEMP/python-contract"
      - name: Measure every audit control within its existing deadline
        run: >-
          python3 -B tools/profile-python-contract-audit.py
          --report "$RUNNER_TEMP/python-contract/result.json"
          --output target/python-audit/profile.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-audit-profile
          path: target/python-audit
          if-no-files-found: warn
          retention-days: 7

  python-report-writes:
    if: inputs.group == 'python-report-writes' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check saved progress after interruptions and failed audits
        run: python3 -B tools/test-python-contract-writer.py
      - name: Compare report saving against rewriting every previous row
        run: >-
          python3 -B tools/benchmark-python-report-writes.py
          --input tests/agent-eval/results/2026-10-16-function-defaults-python-contract/result.json
          --output target/python-report-writes/result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-report-writes
          path: target/python-report-writes
          if-no-files-found: warn
          retention-days: 7
      - name: Save the comparison with its measured source and input
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          python3 -c 'import os, re; assert re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}", os.environ["EVIDENCE_PREFIX"])'
          destination="tests/agent-eval/results/$EVIDENCE_PREFIX-python-report-writes"
          test ! -e "$destination"
          mkdir "$destination"
          cp target/python-report-writes/result.json "$destination/result.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination/result.json"
          git commit -m 'test: record Python report writing comparison'
          git push origin "HEAD:refs/heads/$BRANCH"

  python-contract:
    if: inputs.group == 'python-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check authored CPython expectations
        run: |
          python3 -B tools/test-python-contract-runner.py
          python3 -B tools/python-contract.py --check-runtime
      - name: Reject swapped and corrupted hosted artifacts
        run: |
          python3 -B tools/test-retain-python-contract.py
          python3 -B tools/test-python-contract-writer.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check Rust formatting and retain a correction if needed
        run: |
          if cargo fmt --all --check; then exit 0; fi
          cargo fmt --all
          git diff > "$RUNNER_TEMP/rustfmt.patch"
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rustfmt-correction
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo build --locked --bin fr
      - run: python3 -m pip install 'pytest==9.1.1'
      - name: Compare registration arguments, loops and mutations with Python
        run: PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_registration_arguments.py sdk/python/tests/test_registration_loops.py
      - name: Check documentation examples before collecting reports
        run: |
          python3 -B tools/reader_examples.py --fr target/debug/fr
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_saved_startup.py::test_complete_lesson_uses_separate_processes_and_rechecks_edits
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_startup_registration.py::test_complete_tutorial_checks_startup_and_then_rejects_helper_replacement sdk/python/tests/test_flow_together.py::test_complete_lesson_runs_both_checker_and_python
      - name: Collect reports alongside interface checks, then reject altered records
        run: python3 -B tools/python-contract-runner.py --output target/python-contract/result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-contract
          path: target/python-contract
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-contract-sdk-checks
          path: ${{ runner.temp }}/python-contract-sdk.log
          if-no-files-found: warn
          retention-days: 7

  compiler-profile:
    if: inputs.group == 'compiler-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check Rust formatting and retain a correction if needed
        run: |
          if cargo fmt --all --check; then exit 0; fi
          cargo fmt --all
          git diff > "$RUNNER_TEMP/rustfmt.patch"
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rustfmt-correction
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo clippy --locked --tests -- -D warnings
      - run: cargo build --locked --bin fr
      - name: Reject missing or changed current reports before collection
        run: cargo test --locked --test retained_evidence -- --test-threads 1
      - name: Check ambiguous semantic selection and authoring refusals
        run: cargo test --locked --test semantic_evidence semantic_selection -- --test-threads 1
      - name: Preserve supported source and semantic authoring
        run: cargo test --locked --test author_cli -- --test-threads 1
      - name: Compare declared Rust and Python explanation features
        run: |
          python3 -B tools/profile-check-hashing.py
          python3 -u -B tools/compiler-profile.py --output target/compiler-profile/result.json
      - name: Check complete native source inputs
        run: |
          python3 -B tools/test-native-source-inputs.py
          cargo test --locked --test native_fingerprint --test cache --test vfs_choke_point
      - name: Reject corrupted compiler and source observations
        env:
          FR_COMPILER_PROFILE_REPORT: target/compiler-profile/result.json
        run: python3 -B tools/test-compiler-profile.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-profile
          path: target/compiler-profile
          if-no-files-found: error
          retention-days: 7

  context-projection:
    if: inputs.group == 'context-projection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare the pinned offline tokenizer
        run: |
          python3 -m pip install --only-binary=:all: -r tools/agent_eval/requirements.txt
          mkdir -p target/agent-eval-tokenizer
          curl -fsSL --connect-timeout 20 --max-time 120 \
            -o target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790 \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo '446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790' | sha256sum -c -
      - name: Refresh and verify current-document projection
        run: |
          python3 -B tools/agent-context-protocol-v3.py --tokens > tests/agent-eval/context-protocol-v3.json
          python3 -B tools/agent_eval/test_harness.py ContextProtocolV3Evidence
      - uses: actions/upload-artifact@v7
        with:
          name: context-projection
          path: tests/agent-eval/context-protocol-v3.json
          if-no-files-found: error
          retention-days: 7

  roadmap-report:
    if: inputs.group == 'roadmap-report'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Generate and verify the roadmap reports
        run: |
          python3 tools/roadmap-status.py --write
          python3 tools/roadmap-status.py --check
          python3 tests/agent-eval/test_roadmap_status.py
          python3 tests/agent-eval/test_python_repository_acceptance.py
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          catalog = json.loads(Path('tests/agent-eval/roadmap.json').read_text())
          report = next(row for row in catalog['evidence'] if row['id'] == 'repository-tasks')
          subprocess.run(['python3', 'tools/python-repository-acceptance.py', '--audit', report['path']], check=True)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: roadmap-report
          path: |
            docs/roadmap-status.md
            docs/roadmap-status.json
          if-no-files-found: error
          retention-days: 7

  discovery-pages:
    if: inputs.group == 'discovery-pages'
    name: Revalidate discovery (${{ matrix.evidence }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        evidence: [flow-facts, python-repositories]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
      RAYON_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -m pip install 'pytest==9.1.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked
      - name: Revalidate exact fact locations
        if: matrix.evidence == 'flow-facts'
        run: python3 tools/flow-facts-acceptance.py --output "$RUNNER_TEMP/discovery-evidence/result.json"
      - name: Revalidate repository changes, resumption and patch replay
        if: matrix.evidence == 'python-repositories'
        run: python3 tools/python-repository-acceptance.py --output "$RUNNER_TEMP/discovery-evidence"
      - uses: actions/upload-artifact@v7
        with:
          name: discovery-${{ matrix.evidence }}
          path: ${{ runner.temp }}/discovery-evidence
          if-no-files-found: error
          retention-days: 7

  index-resolution:
    if: inputs.group == 'index-resolution'
    name: Revalidate exploration pages and index resolution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
      RAYON_NUM_THREADS: '1'
      RUST_TEST_THREADS: '1'
      FR_EVIDENCE_PREFIX: ${{ inputs.prefix }}
      FR_EVIDENCE_GROUP: index-resolution
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check discovery lint and packaged skill budgets
        run: |
          cargo clippy --locked --tests -- -D warnings
          python3 -c 'import runpy; runpy.run_path("tools/check-agent-skill.py")["check_bundle"]()'
      - name: Check independent source and relationship pagination
        run: cargo test --locked --test project_explore_pages --test project_explore_budgets -- --test-threads 1
      - name: Measure current indexing and verify the unchanged smaller workloads
        run: python3 tools/refresh-refinement-evidence.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: index-resolution-evidence
          path: |
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-evidence
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-refresh-logs
          retention-days: 7

  repositories:
    if: inputs.group == 'python-repositories'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RAYON_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -m pip install 'pytest==9.1.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
          cache-on-failure: true
      - run: cargo build --locked
      - name: Check archive, behavior and task-budget refusals
        run: python3 tests/agent-eval/test_python_repository_acceptance.py
      - name: Execute pinned upstream tasks and independent replay
        run: python3 tools/python-repository-acceptance.py --output "$RUNNER_TEMP/roadmap-evidence"
      - name: Prepare fresh repository records and tracking pages together
        env:
          FR_EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          prefix = os.environ['FR_EVIDENCE_PREFIX']
          assert re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}', prefix), 'supply a plain dated prefix'
          temporary = Path(os.environ['RUNNER_TEMP'])
          relative = Path('tests/agent-eval/results') / (prefix + '-python-repositories')
          assert not relative.exists(), 'preserve previous records; choose a new prefix'
          shutil.copytree(temporary / 'roadmap-evidence', relative)
          catalog_path = Path('tests/agent-eval/roadmap.json')
          catalog = json.loads(catalog_path.read_text())
          entry, = [row for row in catalog['evidence'] if row['id'] == 'repository-tasks']
          report = relative / 'result.json'
          entry.update(path=report.as_posix(), sha256=hashlib.sha256(report.read_bytes()).hexdigest(),
                       audit=f'python3 tools/python-repository-acceptance.py --audit {relative.as_posix()}')
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n')
          subprocess.run(['python3', 'tools/python-repository-acceptance.py', '--audit', str(relative)], check=True)
          for flag in ('--write', '--check'):
              subprocess.run(['python3', 'tools/roadmap-status.py', flag], check=True)
          subprocess.run(['python3', 'tests/agent-eval/test_roadmap_status.py'], check=True)
          bundle = temporary / 'python-repository-update'
          shutil.copytree(relative, bundle / relative)
          for path in (catalog_path, Path('docs/roadmap-status.json'), Path('docs/roadmap-status.md')):
              destination = bundle / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, destination)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roadmap-evidence
          path: ${{ runner.temp }}/roadmap-evidence
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: python-repository-update
          path: ${{ runner.temp }}/python-repository-update
          if-no-files-found: error
          retention-days: 7
