name: Refresh refinement evidence
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Dated name for new evidence directories
        required: true
        type: string
      group:
        description: Evidence group to regenerate
        type: choice
        default: all
        options:
          - all
          - model-comparisons
          - retained-proofs
          - agent-guide-context
          - completion-workflows
          - intent-action-context
          - index-resolution
          - host-recovery
          - flow
          - dependency
          - contexts
          - compiler-evidence
          - resumable-correspondence
          - semantic-evidence
          - index-consumers
          - flow-fixed-point
          - recursive-flow
          - flow-facts
          - imported-flow
          - flow-cache
          - package-flow
          - package-reexports
          - module-aliases
          - expression-control
          - call-binding
          - literal-defaults
          - namespace-packages
          - scalar-assignments
          - python-repositories
          - discovery-pages
          - roadmap-report
          - context-projection
          - workflow-routes
          - source-repair
          - compiler-profile
          - python-contract
          - retain-python-contract
          - retain-workflows
          - repository-flow-coverage
          - repository-flow-held-out
          - retain-repository-flow
          - flow-contract
      collection_run:
        description: Successful collection run ID for Python or workflow retention
        required: false
        default: ''
        type: string
      repair_run:
        description: Successful source-repair run ID for retain-workflows
        required: false
        default: ''
        type: string
      held_out_run:
        description: Successful held-out run for repository-flow retention
        type: string
        default: ''
      failure_run:
        description: Historical failed collector run to preserve
        type: string
        default: ''
      admission_failure_run:
        description: Failed held-out admission with no downloaded snapshot
        type: string
        default: ''
      inspection_failure_run:
        description: Historical held-out inspection failure to preserve
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: refinement-evidence-${{ github.ref }}-${{ inputs.group }}
  cancel-in-progress: true
jobs:
  refresh:
    if: inputs.group != 'python-repositories' && inputs.group != 'roadmap-report' && inputs.group != 'discovery-pages' && inputs.group != 'index-resolution' && inputs.group != 'context-projection' && inputs.group != 'workflow-routes' && inputs.group != 'source-repair' && inputs.group != 'compiler-profile' && inputs.group != 'python-contract' && inputs.group != 'retain-python-contract' && inputs.group != 'retain-workflows' && inputs.group != 'retain-repository-flow' && inputs.group != 'flow-contract' && !startsWith(inputs.group, 'repository-flow-')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(fromJSON('["host-recovery", "completion-workflows", "retained-proofs", "intent-action-context", "contexts"]'), inputs.group) && 15 || 60 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      FR_LEAN_JOBS: '1'
      LEAN_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      RUST_TEST_THREADS: '1'
      RUSTFLAGS: '-D warnings'
      FR_EVIDENCE_PREFIX: ${{ inputs.prefix }}
      FR_EVIDENCE_GROUP: ${{ inputs.group }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare the pinned context tokenizer
        if: inputs.group == 'contexts'
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/agent_eval/requirements.txt
          mkdir -p "$RUNNER_TEMP/fr-tokenizer"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/fr-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790" \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo "446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  $RUNNER_TEMP/fr-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790" | sha256sum -c -
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/fr-tokenizer" >> "$GITHUB_ENV"
      - name: Cache the Lean toolchain
        id: lean-cache
        uses: actions/cache@v6
        with:
          path: /opt/lean
          key: lean-4.28.0-linux-x86_64
      - name: Install Lean
        if: steps.lean-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LEAN=4.28.0
          LEAN_SHA=ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 600 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN}/lean-${LEAN}-linux.tar.zst" \
            || { echo "could not fetch the Lean toolchain within the time allowed"; exit 1; }
          echo "${LEAN_SHA}  /tmp/lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1
      - name: Put Lean on the path
        run: |
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check virtual workspace boundaries
        if: inputs.group == 'all'
        run: |
          cargo clippy --locked --tests -- -D warnings
          cargo test --locked --test vfs_choke_point --test virtual_model_workspaces
          cargo test --locked --lib spec::refinement::tests
      - name: Check scalar flow boundaries
        if: inputs.group == 'flow'
        run: |
          cargo clippy --locked --tests -- -D warnings
          cargo test --locked --test package_flow --test imported_flow --test flow_summaries --test expression_control --test call_binding --test literal_defaults --test namespace_packages --test scalar_assignments -- --skip acceptance
          cargo build --locked
          python3 -m pip install 'pytest==9.1.1' 'ty==0.0.80'
          ty check sdk/python/src
          PYTHONPATH="$PWD/sdk/python/src" python3 -m pytest -q sdk/python/tests/test_flow_imports.py sdk/python/tests/test_package_flow.py sdk/python/tests/test_flow_reexports.py sdk/python/tests/test_flow_module_aliases.py sdk/python/tests/test_flow_summaries.py sdk/python/tests/test_expression_control.py sdk/python/tests/test_call_binding.py sdk/python/tests/test_literal_defaults.py sdk/python/tests/test_namespace_packages.py sdk/python/tests/test_scalar_assignments.py
      - name: Refresh retained evidence
        run: python3 tools/refresh-refinement-evidence.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: refinement-evidence
          path: |
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-evidence
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-refresh-logs
          retention-days: 7

  workflow-routes:
    if: inputs.group == 'workflow-routes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check workflow recovery and build the CLI
        run: cargo test --locked --test workflow_cli -- --test-threads 1
      - name: Check guided review integrity
        run: |
          python3 -m pip install 'pytest==9.1.1' 'ty==0.0.80'
          ty check sdk/python/src
          PYTHONPATH=sdk/python/src python3 -B -m pytest -q sdk/python/tests/test_guide.py sdk/python/tests/test_guide_bodies.py
          python3 -B tools/test-guide-body-native.py
      - name: Compare body preparation and applied-state recovery
        run: python3 -B tools/guide-body-context.py --output target/workflow-routes/guide-body-context.json
      - name: Compare checked recovery and receiver delivery
        run: python3 -B tools/recovery-delivery-context.py --output target/workflow-routes/recovery-delivery-context.json
      - name: Compare editing routes and refusals
        run: python3 -B tools/workflow-route-context.py --output target/workflow-routes/result.json
      - name: Refresh the scalar guide comparison
        run: python3 -B tools/agent-guide-context.py --output target/workflow-routes/agent-guide-context.json
      - name: Reject corrupted fresh workflow evidence
        env:
          FR_WORKFLOW_ROUTE_REPORT: target/workflow-routes/result.json
          FR_GUIDE_BODY_REPORT: target/workflow-routes/guide-body-context.json
          FR_RECOVERY_DELIVERY_REPORT: target/workflow-routes/recovery-delivery-context.json
        run: |
          python3 -B tools/test-workflow-evidence-basis.py
          python3 -B tools/test-retain-python-contract.py
          python3 -B tools/test-workflow-route-context.py
          python3 -B tools/test-guide-body-context.py
          python3 -B tools/test-recovery-delivery-context.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workflow-routes
          path: target/workflow-routes
          if-no-files-found: error
          retention-days: 7

  source-repair:
    if: inputs.group == 'source-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked --bin fr
      - name: Compare corrected edits, reversals and receiver patches
        run: python3 -B tools/source-repair-context.py --output target/source-repair/result.json
      - name: Reject corrupted recovery evidence
        env:
          FR_SOURCE_REPAIR_REPORT: target/source-repair/result.json
        run: python3 -B tools/test-source-repair-context.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-repair
          path: target/source-repair
          if-no-files-found: error
          retention-days: 7

  flow-contract:
    if: inputs.group == 'flow-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: scalar
            groups: flow-fixed-point recursive-flow flow-facts
          - shard: modules
            groups: imported-flow package-flow package-reexports module-aliases
          - shard: expressions
            groups: expression-control call-binding literal-defaults namespace-packages scalar-assignments
          - shard: cache
            groups: flow-cache
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RAYON_NUM_THREADS: '1'
      FR_EVIDENCE_PREFIX: ${{ inputs.prefix }}
      FR_EVIDENCE_GROUPS: ${{ matrix.groups }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Refresh scalar reports in bounded groups
        run: |
          for group in $FR_EVIDENCE_GROUPS; do
            FR_EVIDENCE_GROUP="$group" python3 -B tools/refresh-refinement-evidence.py
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flow-contract-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-evidence
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-refresh-logs
          retention-days: 7

  repository-flow:
    if: startsWith(inputs.group, 'repository-flow-')
    name: ${{ inputs.group == 'repository-flow-coverage' && 'coverage' || 'held-out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked --bin fr
      - name: Check collector provenance and negative controls
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r tests/agent-eval/python-repository-flow/runtime-requirements.txt
          python3 -B tools/test-python-repository-flow.py
      - name: Collect and independently replay bounded repository probes
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.group == 'repository-flow-coverage' && 'coverage' || 'held-out' }}
          COVERAGE_RUN: ${{ inputs.collection_run }}
        run: |
          arguments=(--phase "$PHASE" --output "$RUNNER_TEMP/fr-repository-flow-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [ -n "$COVERAGE_RUN" ]; then arguments+=(--coverage-run "$COVERAGE_RUN"); fi
          python3 -B tools/python-repository-flow.py "${arguments[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repository-flow-${{ inputs.group == 'repository-flow-coverage' && 'coverage' || 'held-out' }}
          path: ${{ runner.temp }}/fr-repository-flow-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7

  retain-repository-flow:
    if: inputs.group == 'retain-repository-flow' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check artifact and cohort admission controls
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r tests/agent-eval/python-repository-flow/runtime-requirements.txt
          python3 -B tools/test-retain-python-contract.py
          python3 -B tools/test-python-repository-flow.py
      - name: Verify successful phases and preserve the failed collector
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_RUN: ${{ inputs.collection_run }}
          HELD_OUT_RUN: ${{ inputs.held_out_run }}
          FAILURE_RUN: ${{ inputs.failure_run }}
          ADMISSION_FAILURE_RUN: ${{ inputs.admission_failure_run }}
          INSPECTION_FAILURE_RUN: ${{ inputs.inspection_failure_run }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: python3 -B tools/retain-repository-flow.py --coverage-run "$COVERAGE_RUN" --held-out-run "$HELD_OUT_RUN" --failure-run "$FAILURE_RUN" --admission-failure-run "$ADMISSION_FAILURE_RUN" --inspection-failure-run "$INSPECTION_FAILURE_RUN" --prefix "$EVIDENCE_PREFIX"
      - name: Commit the validated cohort files to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-repository-flow" \
            tests/agent-eval/roadmap.json docs/roadmap-status.md docs/roadmap-status.json
          git commit -m 'test: retain frozen repository flow baseline and failed collection'
          git push origin "HEAD:refs/heads/$BRANCH"

  retain-python-contract:
    if: inputs.group == 'retain-python-contract' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reject swapped and corrupted hosted artifacts
        run: python3 -B tools/test-retain-python-contract.py
      - name: Verify archive, source identity, outcomes and corruption controls
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: python3 -B tools/retain-python-contract.py --run "$COLLECTION_RUN" --prefix "$EVIDENCE_PREFIX"
      - name: Commit the reviewed evidence files to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-python-contract" \
            tools/test-python-contract.py tests/agent-eval/roadmap.json \
            docs/roadmap-status.md docs/roadmap-status.json
          git commit -m 'test: retain validated Python boundary evidence'
          git push origin "HEAD:refs/heads/$BRANCH"

  retain-workflows:
    if: inputs.group == 'retain-workflows' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reject swapped and corrupted hosted artifacts
        run: |
          python3 -B tools/test-retain-python-contract.py
          python3 -B tools/test-workflow-evidence-basis.py
      - name: Verify and retain the complete workflow family
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN: ${{ inputs.collection_run }}
          REPAIR_RUN: ${{ inputs.repair_run }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: python3 -B tools/retain-workflow-evidence.py --routes-run "$COLLECTION_RUN" --repair-run "$REPAIR_RUN" --prefix "$EVIDENCE_PREFIX"
      - name: Commit the validated evidence files to this branch
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-workflows" \
            "tests/agent-eval/results/$EVIDENCE_PREFIX-source-repair" \
            tools/test-workflow-route-context.py tools/test-guide-body-context.py \
            tools/test-recovery-delivery-context.py tools/test-source-repair-context.py
          git commit -m 'test: retain release-stable workflow evidence'
          git push origin "HEAD:refs/heads/$BRANCH"

  python-contract:
    if: inputs.group == 'python-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check authored CPython expectations
        run: python3 -B tools/python-contract.py --check-runtime
      - name: Reject swapped and corrupted hosted artifacts
        run: python3 -B tools/test-retain-python-contract.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo fmt --all --check
      - run: cargo build --locked --bin fr
      - run: python3 -m pip install 'pytest==9.1.1'
      - name: Check expression evaluation and source locations
        run: PYTHONPATH=sdk/python/src python3 -B -m pytest -q sdk/python/tests/test_expression_control.py sdk/python/tests/test_flow_imports.py sdk/python/tests/test_call_binding.py sdk/python/tests/test_literal_defaults.py sdk/python/tests/test_flow_summaries.py
      - name: Collect successful reports and CLI refusals
        run: python3 -B tools/python-contract.py --output target/python-contract/result.json
      - name: Reject corrupted contract observations
        env:
          FR_PYTHON_CONTRACT_REPORT: target/python-contract/result.json
        run: python3 -B tools/test-python-contract.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-contract
          path: target/python-contract
          if-no-files-found: error
          retention-days: 7

  compiler-profile:
    if: inputs.group == 'compiler-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --tests -- -D warnings
      - run: cargo build --locked --bin fr
      - name: Check ambiguous semantic selection and authoring refusals
        run: cargo test --locked --test semantic_evidence semantic_selection -- --test-threads 1
      - name: Preserve supported source and semantic authoring
        run: cargo test --locked --test author_cli -- --test-threads 1
      - name: Compare declared Rust and Python explanation features
        run: python3 -B tools/compiler-profile.py --output target/compiler-profile/result.json
      - name: Reject corrupted compiler and source observations
        env:
          FR_COMPILER_PROFILE_REPORT: target/compiler-profile/result.json
        run: python3 -B tools/test-compiler-profile.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-profile
          path: target/compiler-profile
          if-no-files-found: error
          retention-days: 7

  context-projection:
    if: inputs.group == 'context-projection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare the pinned offline tokenizer
        run: |
          python3 -m pip install --only-binary=:all: -r tools/agent_eval/requirements.txt
          mkdir -p target/agent-eval-tokenizer
          curl -fsSL --connect-timeout 20 --max-time 120 \
            -o target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790 \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo '446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790' | sha256sum -c -
      - name: Refresh and verify current-document projection
        run: |
          python3 -B tools/agent-context-protocol-v3.py --tokens > tests/agent-eval/context-protocol-v3.json
          python3 -B tools/agent_eval/test_harness.py ContextProtocolV3Evidence
      - uses: actions/upload-artifact@v7
        with:
          name: context-projection
          path: tests/agent-eval/context-protocol-v3.json
          if-no-files-found: error
          retention-days: 7

  roadmap-report:
    if: inputs.group == 'roadmap-report'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Generate and verify the roadmap reports
        run: |
          python3 tools/roadmap-status.py --write
          python3 tools/roadmap-status.py --check
          python3 tests/agent-eval/test_roadmap_status.py
          python3 tests/agent-eval/test_python_repository_acceptance.py
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          catalog = json.loads(Path('tests/agent-eval/roadmap.json').read_text())
          report = next(row for row in catalog['evidence'] if row['id'] == 'repository-tasks')
          subprocess.run(['python3', 'tools/python-repository-acceptance.py', '--audit', report['path']], check=True)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: roadmap-report
          path: |
            docs/roadmap-status.md
            docs/roadmap-status.json
          if-no-files-found: error
          retention-days: 7

  discovery-pages:
    if: inputs.group == 'discovery-pages'
    name: Revalidate discovery (${{ matrix.evidence }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        evidence: [flow-facts, python-repositories]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
      RAYON_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -m pip install 'pytest==9.1.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - run: cargo build --locked
      - name: Revalidate exact fact locations
        if: matrix.evidence == 'flow-facts'
        run: python3 tools/flow-facts-acceptance.py --output "$RUNNER_TEMP/discovery-evidence/result.json"
      - name: Revalidate repository changes, resumption and patch replay
        if: matrix.evidence == 'python-repositories'
        run: python3 tools/python-repository-acceptance.py --output "$RUNNER_TEMP/discovery-evidence"
      - uses: actions/upload-artifact@v7
        with:
          name: discovery-${{ matrix.evidence }}
          path: ${{ runner.temp }}/discovery-evidence
          if-no-files-found: error
          retention-days: 7

  index-resolution:
    if: inputs.group == 'index-resolution'
    name: Revalidate exploration pages and index resolution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
      RAYON_NUM_THREADS: '1'
      RUST_TEST_THREADS: '1'
      FR_EVIDENCE_PREFIX: ${{ inputs.prefix }}
      FR_EVIDENCE_GROUP: index-resolution
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check discovery lint and packaged skill budgets
        run: |
          cargo clippy --locked --tests -- -D warnings
          python3 -c 'import runpy; runpy.run_path("tools/check-agent-skill.py")["check_bundle"]()'
      - name: Check independent source and relationship pagination
        run: cargo test --locked --test project_explore_pages --test project_explore_budgets -- --test-threads 1
      - name: Compare complete index outputs with the pinned baseline
        run: python3 tools/refresh-refinement-evidence.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: index-resolution-evidence
          path: |
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-evidence
            ${{ runner.temp }}/fr-refinement-${{ github.run_id }}-${{ github.run_attempt }}/refinement-refresh-logs
          retention-days: 7

  repositories:
    if: inputs.group == 'python-repositories'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RAYON_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -m pip install 'pytest==9.1.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
          cache-on-failure: true
      - run: cargo build --locked
      - name: Execute pinned upstream tasks and independent replay
        run: python3 tools/python-repository-acceptance.py --output "$RUNNER_TEMP/roadmap-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roadmap-evidence
          path: ${{ runner.temp }}/roadmap-evidence
          if-no-files-found: warn
          retention-days: 7
