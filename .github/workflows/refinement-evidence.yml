  docs-review:
    if: inputs.group == 'docs-review' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare the pinned offline text counter
        run: |
          python3 -m pip install --only-binary=:all: -r tools/agent_eval/requirements.txt
          mkdir -p target/agent-eval-tokenizer
          curl -fsSL --connect-timeout 20 --max-time 120 \
            -o target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790 \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo '446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790' | sha256sum -c -
      - name: Refresh generated prose and check documentation links
        run: python3 -B tools/review-docs.py --write
      - name: Check the native document link reader without building the project
        run: |
          rustup toolchain install stable --profile minimal
          CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE" rustc --edition=2021 --test tests/docs_links.rs -o "$RUNNER_TEMP/fr-docs-links"
          "$RUNNER_TEMP/fr-docs-links" --test-threads=1
      - name: Validate the retained Python contract after documentation edits
        run: python3 -B tools/test-python-contract.py
      - name: Check writing counts and exact generated results
        run: |
          python3 -c 'import runpy; runpy.run_path("tools/check-agent-skill.py")["check_bundle"]()'
          python3 -B tools/check-prose.py
          python3 -B tools/roadmap-status.py --check
          python3 -B -m unittest discover -s tools/agent_eval -p 'test_native*outcomes.py'
          python3 -B tools/agent_eval/test_opencode_native.py Discovery
          python3 -B tools/agent_eval/test_harness.py ContextProtocolV3Evidence
          python3 -B tools/test-ci-shards.py
      - name: Save checked generated documentation
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/roadmap-status.md docs/roadmap-status.json docs/native-change-outcomes.md docs/native-read-outcomes.md tools/PROSE-DEBT tests/agent-eval/context-protocol-v3.json
            git commit -m 'docs: refresh generated reader guides and writing counts'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

  scalar-development:
    if: inputs.group == 'scalar-development' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check inexpensive controls before compilation
        run: |
          python3 -B tools/python-contract.py --check-runtime
          python3 -B tools/test-retain-scalar-evidence.py
          python3 -B tools/test-frozen-repository-flow.py
          python3 -B tools/test-repository-declarations.py
          python3 -B tools/test-frozen-analyzer.py
          python3 -B tools/test-native-source-inputs.py
          python3 -B tools/check-prose.py
      - name: Format Rust on the runner
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.rs'
            git commit -m 'style: format module literal controls'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Cache the Lean toolchain
        id: lean-cache
        uses: actions/cache@v6
        with:
          path: /opt/lean
          key: lean-4.28.0-linux-x86_64
      - name: Install Lean
        if: steps.lean-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          LEAN=4.28.0
          LEAN_SHA=ceb3a3f844f7aebf63245e2b51c28d5b0ed38942c19f93cf3febd520302160bd
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 600 -o /tmp/lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN}/lean-${LEAN}-linux.tar.zst" \
            || { echo "could not fetch the Lean toolchain within the time allowed"; exit 1; }
          echo "${LEAN_SHA}  /tmp/lean.tar.zst" | sha256sum -c -
          sudo mkdir -p /opt/lean
          sudo tar --zstd -xf /tmp/lean.tar.zst -C /opt/lean --strip-components=1
      - name: Put Lean on the path
        run: |
          echo "/opt/lean/bin" >> "$GITHUB_PATH"
          /opt/lean/bin/lean --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check native binding and summary controls
        id: native
        run: cargo test --locked --no-fail-fast --test native_fingerprint --test cache --test package_flow --test imported_flow --test vfs_choke_point --test call_binding --test literal_defaults --test expression_control --test scalar_assignments -- --skip acceptance
      - name: Build the CLI required by the Python controls
        id: sdk-binary
        if: always() && steps.native.outcome != 'skipped'
        run: cargo build --locked --bin fr
      - name: Check Python runtime and SDK controls
        if: always() && steps.sdk-binary.outcome == 'success'
        run: |
          python3 -m pip install 'pytest==9.1.1' 'ty==0.0.80'
          ty check sdk/python/src
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_standard_library.py sdk/python/tests/test_metadata_imports.py sdk/python/tests/test_flow_import_explanation.py
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_registration_arguments.py sdk/python/tests/test_registration_loops.py
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_saved_startup.py
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_flow_together.py::test_complete_lesson_runs_both_checker_and_python
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_initialization_locations.py::test_omitted_locations_keep_the_total_and_never_establish_absence
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_default_replacements.py sdk/python/tests/test_function_defaults.py sdk/python/tests/test_parallel_bindings.py sdk/python/tests/test_scalar_named_defaults.py sdk/python/tests/test_imported_scalar_defaults.py sdk/python/tests/test_value_aliases.py
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_flow_together.py sdk/python/tests/test_startup_registration.py sdk/python/tests/test_startup_diagnostics.py sdk/python/tests/test_initialization_locations.py sdk/python/tests/test_import_order.py sdk/python/tests/test_registry_initialization.py sdk/python/tests/test_collection_initialization.py sdk/python/tests/test_type_registries.py

  retain-package-questions:
    if: inputs.group == 'retain-package-questions' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Reject substituted package records
        run: python3 -B tools/test-retain-package-questions.py
      - name: Save familiar and first unfamiliar outcomes unchanged
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_RUN: ${{ inputs.collection_run }}
          HELD_OUT_RUN: ${{ inputs.held_out_run }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: >-
          python3 -B tools/retain-package-questions.py --coverage-run "$COVERAGE_RUN"
          --held-out-run "$HELD_OUT_RUN" --prefix "$EVIDENCE_PREFIX"
      - name: Reject false completion records even with coherent fingerprints
        if: steps.retained.outputs.milestones_complete == 'true'
        env:
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: >-
          python3 -B tools/test-package-milestone-audit.py
          "tests/agent-eval/results/$EVIDENCE_PREFIX-package-questions-held-out/result.json"
      - name: Commit the original package records
        env:
          BRANCH: ${{ github.ref_name }}
          EVIDENCE_PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/agent-eval/results/$EVIDENCE_PREFIX-package-questions-"*
          git add tests/agent-eval/roadmap.json
          git add docs/roadmap-status.json docs/roadmap-status.md
          git commit -m 'test: retain frozen package comparisons and first unfamiliar outcomes'
          git push origin "HEAD:refs/heads/$BRANCH"

  package-questions:
    if: startsWith(inputs.group, 'package-questions-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting before the frozen package comparison
        if: inputs.group == 'package-questions-development'
        run: |
          if cargo fmt --all --check; then exit 0; fi
          cargo fmt --all
          git diff > "$RUNNER_TEMP/rustfmt.patch"
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure() && inputs.group == 'package-questions-development'
        with:
          name: rustfmt-correction
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
          retention-days: 7
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Check original-package collector controls
        run: |
          python3 -B tools/test-package-questions.py
          python3 -B tools/test-retain-package-questions.py
          python3 -B tests/agent-eval/test_roadmap_status.py
      - run: cargo build --locked --bin fr
      - name: Compare imported-module rules with ordinary Python
        if: inputs.group == 'package-questions-development'
        run: |
          python3 -m pip install 'pytest==9.1.1'
          PYTHONPATH="$GITHUB_WORKSPACE/sdk/python/src" python3 -B -m pytest -q sdk/python/tests/test_imported_program_guards.py sdk/python/tests/test_postponed_annotations.py sdk/python/tests/test_standard_library.py
      - name: Collect original imports and independent Python answers
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_GROUP: ${{ inputs.group }}
          COVERAGE_RUN: ${{ inputs.collection_run }}
        run: >-
          python3 -B tools/package-questions.py --phase "${EVIDENCE_GROUP#package-questions-}"
          --coverage-run "$COVERAGE_RUN" --fr target/debug/fr
          --output "$RUNNER_TEMP/package-questions"
      - uses: actions/upload-artifact@v7
        if: always() && steps.collect.outcome != 'skipped'
        with:
          name: package-questions-summary
          path: ${{ runner.temp }}/package-questions/result.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.collect.outcome != 'skipped'
        with:
          name: package-questions
          path: ${{ runner.temp }}/package-questions/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  scalar-import-development:
