name: Verify the focused roadmap and documentation
on:
  push:
    branches: [ci/focused-agent-docs-preflight]
permissions:
  contents: write
jobs:
  checked-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOCUS_BASE: c923d3cde752ab7c09b8f922ef43d7dc75349212
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: -D warnings
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: ./.github/actions/native-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: default
      - name: Prepare the pinned offline text counter
        run: |
          python3 -m pip install --only-binary=:all: -r tools/agent_eval/requirements.txt
          mkdir -p target/agent-eval-tokenizer
          curl -fsSL --connect-timeout 20 --max-time 120 \
            -o target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790 \
            https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken
          echo '446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  target/agent-eval-tokenizer/fb374d419588a4632f3f557e76b4b70aebbca790' | sha256sum -c -
      - name: Generate the focused guide index and retained qualification report
        run: |
          python3 -B tools/test-review-docs.py
          python3 -B tools/review-docs.py --write
          python3 -B tests/agent-eval/test_roadmap_status.py
          python3 -c 'import runpy; runpy.run_path("tools/check-agent-skill.py")["check_bundle"]()'
      - name: Check the complete static gate and actual first-proof lesson
        run: ./tools/check.sh static
      - name: Run the original Python lessons
        run: python3 -B tools/reader_examples.py --fr target/debug/fr
      - name: Check document facts, website commands and retained tracking
        run: |
          cargo test --locked --test docs_census --test docs_ir --test docs_recipes \
            --test site_integrity --test roadmap_outcomes -- --test-threads 1
      - name: Dogfood fr on the actual tracking-renderer body change
        run: |
          git fetch --quiet --filter=blob:none --no-tags --depth=1 origin "$FOCUS_BASE"
          python3 -B - <<'PY'
          import ast, hashlib, json, os, subprocess, textwrap
          from pathlib import Path
          root = Path.cwd()
          binary = root / 'target/debug/fr'
          target_file = root / 'tools/roadmap-status.py'
          current = target_file.read_text()
          original = subprocess.check_output(['git', 'show', os.environ['FOCUS_BASE'] + ':tools/roadmap-status.py'], text=True)
          def span(source):
              node = next(node for node in ast.parse(source).body if isinstance(node, ast.FunctionDef) and node.name == 'markdown')
              lines = source.splitlines(keepends=True)
              first, last = node.body[0], node.body[-1]
              return (sum(map(len, lines[:first.lineno - 1])) + first.col_offset,
                      sum(map(len, lines[:last.end_lineno - 1])) + last.end_col_offset)
          begin, end = span(current)
          old_begin, old_end = span(original)
          before = current[:begin] + original[old_begin:old_end] + current[end:]
          fragment = Path(os.environ['RUNNER_TEMP']) / 'focused-renderer-body'
          fragment.write_text(textwrap.dedent('    ' + current[begin:end]) + '\n')
          directory = Path(os.environ['RUNNER_TEMP']) / 'focused-dogfood'
          directory.mkdir()
          target_file.write_text(before)
          calls = []
          def run(arguments):
              result = subprocess.run([str(binary), '-C', str(target_file), '--json', *arguments],
                                      text=True, capture_output=True, timeout=20)
              name = f'{len(calls):02d}'
              (directory / (name + '.stdout')).write_text(result.stdout)
              (directory / (name + '.stderr')).write_text(result.stderr)
              assert result.returncode == 0, (arguments, result.stdout, result.stderr)
              value = json.loads(result.stdout)
              calls.append({'arguments': arguments, 'report': name + '.stdout'})
              return value
          found = run(['project', 'find', 'markdown', '--signature'])
          assert len(found['rows']) == 1
          handle = dict(zip(found['columns'], found['rows'][0]))['handle']
          arguments = ['author', 'replace-body', handle, '--from', str(fragment), '--diff-bytes', '65536']
          preview = run(arguments)
          assert target_file.read_text() == before
          assert isinstance(preview['diff'], str)
          saved = run([*arguments, '--save-plan', '--plan-basis', preview['plan_context_basis']])
          assert saved['plan_context_basis'] == preview['plan_context_basis']
          transaction = str(saved['transaction'])
          basis = saved['transaction_context_basis']
          run(['history', 'show', transaction])
          run(['history', 'apply', transaction, '--write', '--context-basis', basis])
          assert target_file.read_text() == current
          run(['history', 'undo', transaction, '--write'])
          assert target_file.read_text() == before
          run(['history', 'redo', transaction, '--write', '--context-basis', basis])
          assert target_file.read_text() == current
          (directory / 'receipt.json').write_text(json.dumps({
              'scope': 'Scripted fr edit of the actual roadmap renderer; no live model calls.',
              'source': 'tools/roadmap-status.py', 'calls': calls,
              'before_sha256': hashlib.sha256(before.encode()).hexdigest(),
              'after_sha256': hashlib.sha256(current.encode()).hexdigest(),
              'exact_undo_redo': True}, indent=2) + '\n')
          PY
      - name: Preserve original acceptance and report inputs needing renewed collection
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base = os.environ['FOCUS_BASE']
          def earlier(name):
              return json.loads(subprocess.check_output(['git', 'show', base + ':' + name]))
          old = earlier('tests/agent-eval/roadmap.json')
          current = json.loads(Path('tests/agent-eval/roadmap.json').read_text())
          for field in ('engineering', 'evidence', 'obligations', 'profile', 'baseline'):
              assert old[field] == current[field], 'Original qualification changed: ' + field
          before = {row['id']: row for row in earlier('docs/roadmap-status.json')['evidence']}
          report = json.loads(Path('docs/roadmap-status.json').read_text())
          expired = [row for row in report['evidence'] if before[row['id']]['freshness'] == 'current' and row['freshness'] != 'current']
          receipt = {'pending_fresh_collections': [{key: row[key] for key in ('id', 'changed_sources')} for row in expired],
                     'original_acceptance_preserved': True}
          Path(os.environ['RUNNER_TEMP'], 'focused-freshness.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: focused-docs-preflight
          path: |
            ${{ runner.temp }}/focused-dogfood
            ${{ runner.temp }}/focused-freshness.json
            docs/roadmap-status.md
            docs/roadmap-status.json
            tools/PROSE-DEBT
          if-no-files-found: warn
          retention-days: 14
      - name: Save only checked generated pages and remove this completed preflight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap-status.md docs/roadmap-status.json docs/native-change-outcomes.md \
            docs/native-read-outcomes.md tools/PROSE-DEBT tests/agent-eval/context-protocol-v3.json
          git rm .github/workflows/focused-docs-preflight.yml
          git commit --quiet -m 'docs: check the focused roadmap and runnable proof lesson'
          git push origin HEAD:refs/heads/ci/focused-agent-docs-preflight
