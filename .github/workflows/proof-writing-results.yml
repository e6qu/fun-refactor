name: Check all 36 local M3 proof submissions
on:
  workflow_call:
    inputs:
      tool_run:
        type: string
        required: true
      controls_run:
        type: string
        required: true
      report_mode:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  patches:
    name: Check proof patches (${{ matrix.profile }}, ${{ matrix.task }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        profile: [codex-luna-fast, opencode2-glm-flash, opencode2-kimi-k3]
        task: [access-rust, page-count, fits-window]
    env:
      PYTHONPATH: tools:sdk/python/src
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.99.1'
      LEAN_NUM_THREADS: '1'
      FR_LEAN_JOBS: '1'
      M3_TOOL_RUN: ${{ inputs.tool_run }}
      M3_CONTROLS_RUN: ${{ inputs.controls_run }}
      PROFILE: ${{ matrix.profile }}
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: ./.github/actions/lean-toolchain
      - uses: actions/download-artifact@v8
        with:
          name: m3-linux-tool
          path: ${{ runner.temp }}/m3-tool
          run-id: ${{ inputs.tool_run }}
          github-token: ${{ github.token }}
      - name: Check the executable source and its hosted model tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B -m agent_eval.proof_writing_artifact --run "$M3_TOOL_RUN"
          --fr "$RUNNER_TEMP/m3-tool/fr" --output "$RUNNER_TEMP/m3-patch-build.json"
      - run: chmod +x "$RUNNER_TEMP/m3-tool/fr"
      - uses: actions/download-artifact@v8
        with:
          name: m3-private-grader-image
          path: ${{ runner.temp }}/m3-grader
          run-id: ${{ inputs.controls_run }}
          github-token: ${{ github.token }}
      - name: Load only the checker frozen before the live attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B -m agent_eval.proof_writing_results load-checker
          --data tests/agent-eval/proof-writing/local-results
          --archive "$RUNNER_TEMP/m3-grader/grader-image.tar.gz"
          --run "$M3_CONTROLS_RUN" --output "$RUNNER_TEMP/m3-grader/loaded.json"
      - uses: actions/download-artifact@v8
        with:
          name: m3-prepared-${{ matrix.task }}
          path: ${{ runner.temp }}/m3-inputs/m3-prepared-${{ matrix.task }}
          run-id: ${{ inputs.controls_run }}
          github-token: ${{ github.token }}
      - name: Check both setups and repetitions in isolated patch receivers
        run: |
          m3_image=$(python3 -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ["RUNNER_TEMP"])/"m3-grader/loaded.json").read_text())["image"])')
          python3 -B -m agent_eval.proof_writing_results grade-cell \
            --data tests/agent-eval/proof-writing/local-results --inputs "$RUNNER_TEMP/m3-inputs" \
            --fr "$RUNNER_TEMP/m3-tool/fr" --rust "$(rustc --print sysroot)" --image "$m3_image" \
            --profile "$PROFILE" --task "$TASK" --output "$RUNNER_TEMP/m3-cell"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-patches-${{ matrix.profile }}-${{ matrix.task }}
          path: ${{ runner.temp }}/m3-cell
          if-no-files-found: error
          retention-days: 30
  report:
    name: Require all 36 independent proof outcomes
    needs: patches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: tools:sdk/python/src
      PYTHONDONTWRITEBYTECODE: '1'
      REPORT_MODE: ${{ inputs.report_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@v8
        with:
          pattern: m3-patches-*
          path: ${{ runner.temp }}/m3-cells
      - name: Merge every distinct profile and task cell
        run: >-
          python3 -B -m agent_eval.proof_writing_results merge
          --data tests/agent-eval/proof-writing/local-results --cells "$RUNNER_TEMP/m3-cells"
          --output "$RUNNER_TEMP/m3-checked.json"
      - name: Check the published explanation and full milestone requirements
        run: |
          case "$REPORT_MODE" in
            collect) ;;
            check)
              python3 -B -m agent_eval.proof_writing_results report \
                --data tests/agent-eval/proof-writing/local-results --checks "$RUNNER_TEMP/m3-checked.json" --mode check
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-independent-outcomes
          path: ${{ runner.temp }}/m3-checked.json
          if-no-files-found: error
          retention-days: 30
