name: Release

# Two halves. `release-please` reads the commits since the last tag and keeps a
# pull request open holding the next version and its changelog. Merging that
# request tags the release. The rest of this file then builds what the release
# hands people.
#
# Nothing here builds on a push that is not a release. A binary nobody asked for
# costs twenty minutes of runner time per push and answers no question.

on:
  push:
    branches: [main]

# `release-please` opens a pull request holding the next version. A workflow may
# only do that where the repository allows it: Settings, Actions, General,
# Workflow permissions, "Allow GitHub Actions to create and approve pull
# requests". Without it the job fails with "GitHub Actions is not permitted to
# create or approve pull requests" and no release goes out.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One job per thing a person can download. Each builds on the architecture it
  # targets, so no cross-linker enters into it: the tree-sitter grammars are C,
  # and cross-compiling C for four targets is four ways to find out something is
  # missing at link time.
  #
  # Linux links against musl and statically. A binary built against the runner's
  # glibc needs that glibc or newer, which rules out every long-term distribution
  # older than the runner image. The static one runs anywhere with the right
  # architecture, which is the promise a downloaded binary should make.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            libc: musl
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
            libc: musl
          - target: x86_64-apple-darwin
            runs-on: macos-13
          - target: aarch64-apple-darwin
            runs-on: macos-14
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      # `musl-gcc` is the wrapper that puts musl's headers and its startup files
      # in front of the system ones. Without it `cc` compiles the grammars
      # against glibc's headers and the link fails on symbols musl does not have.
      - name: Install the musl toolchain
        if: matrix.libc == 'musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --bin fr --target ${{ matrix.target }}

      # The binary has to answer before it is published. A build that links and
      # then dies on its first call is a build that passed every gate here.
      - name: Check it runs
        run: |
          ./target/${{ matrix.target }}/release/fr --version
          ./target/${{ matrix.target }}/release/fr capabilities > /dev/null

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="fr-${{ needs.release-please.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/fr" "dist/$name/"
          cp LICENSE README.md CLI.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # The checksum travels with the file it describes. A download nobody
          # can verify is a download nobody should run.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            "dist/${{ steps.package.outputs.name }}.tar.gz" \
            "dist/${{ steps.package.outputs.name }}.tar.gz.sha256" \
            --clobber

  # The browser build is not a binary anybody runs from a shell, so it ships as
  # the pair a page needs: the WebAssembly module and the JavaScript that loads
  # it. Built the same way the playground is, by the same script.
  wasm:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check clang can emit wasm
        run: clang --print-targets | grep -q wasm32

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm

      - name: Install wasm-bindgen-cli, matching the lockfile
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the analysis for the browser
        run: ./tools/build-wasm.sh

      - name: Generate the bindings
        run: |
          wasm-bindgen --target web --out-dir dist/wasm \
            target/wasm32-unknown-unknown/release/fun_refactor.wasm

      # Same check the binaries get, in the runtime this artifact is for. The
      # module loads, the API answers, and the answer is about real source.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Check it answers
        run: node web/test/api.mjs

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="fun-refactor-${{ needs.release-please.outputs.tag }}-wasm"
          mkdir -p "dist/$name"
          cp dist/wasm/* "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            "dist/${{ steps.package.outputs.name }}.tar.gz" \
            "dist/${{ steps.package.outputs.name }}.tar.gz.sha256" \
            --clobber
