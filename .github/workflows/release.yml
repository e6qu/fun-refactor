name: Release

# Publishing a merged release and planning the next release PR are separate
# jobs. A planning API error must not block downloads for a published version.
# Manual completion selects an existing empty release and verifies its source.
#
# Nothing here builds on a push that is not a release. A binary nobody asked for
# costs twenty minutes of runner time per push and answers no question.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release-request.py'
      - 'tools/test-release-request.py'
  workflow_dispatch:
    inputs:
      existing_tag:
        description: Complete missing downloads for the latest published release with no assets
        type: string
        required: true

# `release-please` opens a pull request holding the next version. A workflow may
# only do that where the repository allows it: Settings, Actions, General,
# Workflow permissions, "Allow GitHub Actions to create and approve pull
# requests". Without it the planning job fails with "GitHub Actions is not
# permitted to create or approve pull requests"; download builds stay separate.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    name: Check release selection without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: python3 -B tools/test-release-request.py

  release-please:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      released: ${{ steps.selection.outputs.released }}
      tag: ${{ steps.selection.outputs.tag }}
      version: ${{ steps.selection.outputs.version }}
      commit: ${{ steps.selection.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push'
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Select and verify the published source commit
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.existing_tag }}
          CREATED_RELEASE: ${{ steps.release.outputs.release_created }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          CREATED_VERSION: ${{ steps.release.outputs.version }}
        run: python3 -B tools/release-request.py publish

  plan-release:
    name: Prepare the next release pull request
    if: github.event_name == 'push'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      # A later planning API error must not prevent downloads for a release
      # that has already been published successfully.
      - uses: googleapis/release-please-action@v5
        id: plan
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Refresh the proposed release replay and then run its full CI
        if: steps.plan.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_PR: ${{ steps.plan.outputs.pr }}
        run: python3 -B tools/release-request.py check-plan

  packages:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/package-product.yml
    with:
      commit: ${{ needs.release-please.outputs.commit }}
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read

  publish:
    needs: [release-please, packages]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: product-*
          path: dist
          merge-multiple: true
      - name: Verify and attach the qualified files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          gh release upload "$RELEASE_TAG" *.tar.gz *.whl *.sha256 *.check.json
