name: Python package startup investigation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/python-startup-*'
      - 'tools/test-python-startup.py'
      - 'tests/agent-eval/python-startup/**'
      - 'docs/python-package-startup.md'
      - '.github/workflows/python-startup.yml'
permissions:
  contents: read
concurrency:
  group: python-startup-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install the pinned runtime dependency
        run: >-
          python3 -m pip install --only-binary=:all: --require-hashes
          -r tests/agent-eval/python-repository-flow/runtime-requirements.txt
      - name: Check observation and rejection controls
        run: python3 -B tools/test-python-startup.py
      - name: Observe unchanged packages and compare with the saved analyzer answers
        run: python3 -B tools/python-startup-investigation.py --output "$RUNNER_TEMP/package-startup"
      - name: Independently read and check the saved observations
        run: python3 -B tools/python-startup-investigation.py --audit "$RUNNER_TEMP/package-startup"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-package-startup
          path: ${{ runner.temp }}/package-startup/
          retention-days: 30
          if-no-files-found: error
