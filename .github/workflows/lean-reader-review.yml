name: Compare the exact facts found by two Lean readers
on:
  workflow_dispatch:
    inputs:
      before_source:
        description: Exact 40-character fr source commit before the reader repair
        required: true
        type: string
      after_source:
        description: Exact 40-character fr source commit after the reader repair
        required: true
        type: string
      repository_revision:
        description: Exact 40-character repository commit supplying the unchanged Lean files
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lean-reader-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RAYON_NUM_THREADS: '1'
      RUST_TEST_THREADS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: lean-reader-review
          cache-on-failure: true
      - run: python3 -B tools/test-lean-reader-compare.py
      - env:
          BEFORE_SOURCE: ${{ inputs.before_source }}
          AFTER_SOURCE: ${{ inputs.after_source }}
          REPOSITORY_REVISION: ${{ inputs.repository_revision }}
        run: >-
          python3 -B tools/lean-reader-compare.py
          --before-source "$BEFORE_SOURCE" --after-source "$AFTER_SOURCE"
          --repository-revision "$REPOSITORY_REVISION" --output "$RUNNER_TEMP/lean-reader-review"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lean-reader-review
          path: ${{ runner.temp }}/lean-reader-review
          if-no-files-found: error
          retention-days: 30
