name: Combine checked handler results
on:
  push:
    branches: [ci/handlers-release-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/agent-eval/results/
      - name: Combine independently checked results without local data growth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for branch in ci/handlers-final-docs ci/handlers-release-project ci/handlers-release-sessions ci/handlers-release-scope ci/handlers-release-storage ci/handlers-release-python; do
            git fetch --quiet --filter=blob:none --no-tags origin "$branch"
            if ! git merge --no-ff --no-commit FETCH_HEAD; then
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/handler-integration.yml)
                    git rm -- "$path"
                    ;;
                  docs/roadmap-status.md|docs/roadmap-status.json)
                    git checkout --ours -- "$path"
                    git add -- "$path"
                    ;;
                  tests/agent-eval/roadmap.json)
                    python3 -B - <<'PY'
          import json, subprocess
          from pathlib import Path
          name = 'tests/agent-eval/roadmap.json'
          base, ours, theirs = [json.loads(subprocess.check_output(['git', 'show', f':{stage}:{name}'])) for stage in (1, 2, 3)]
          def choose(before, left, right):
              if left == before or left == right:
                  return right
              if right == before:
                  return left
              raise ValueError('Both result branches changed the same catalog value')
          result = {}
          assert base.keys() == ours.keys() == theirs.keys()
          for key in base:
              if key in ('evidence', 'obligations'):
                  maps = [{row['id']: row for row in value[key]} for value in (base, ours, theirs)]
                  assert maps[0].keys() == maps[1].keys() == maps[2].keys()
                  result[key] = [choose(maps[0][row['id']], maps[1][row['id']], maps[2][row['id']]) for row in ours[key]]
              else:
                  result[key] = choose(base[key], ours[key], theirs[key])
          Path(name).write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
                    git add -- "$path"
                    ;;
                  *) echo "Unresolved result integration: $path" >&2; exit 1 ;;
                esac
              done < <(git diff --name-only --diff-filter=U)
            fi
            if git rev-parse --verify -q MERGE_HEAD >/dev/null; then
              git commit --quiet -m "Combine checked handler results from $branch"
            fi
          done
          if git ls-files --error-unmatch .github/workflows/handler-integration.yml >/dev/null 2>&1; then
            git rm .github/workflows/handler-integration.yml
            git commit --quiet -m 'Remove the completed result integration job'
          fi
          git push origin HEAD:refs/heads/ci/handlers-release-docs
