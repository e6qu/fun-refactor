name: Pages

# The site lives in docs/. The playground under docs/playground is *built* — a
# WebAssembly module plus a Vite bundle — so it is not committed, and a change to
# anything it is built from has to trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'src/**'
      - 'crates/**'
      - 'queries/**'
      - 'wasm-shim/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/build-wasm.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      # Ubuntu's clang is an LLVM with every target enabled, including WebAssembly.
      # Apple's is not, which is why a Mac needs wasi-sdk and this does not.
      - name: Check clang can emit wasm
        run: clang --print-targets | grep -q wasm32

      - uses: Swatinem/rust-cache@v2

      # The generator and the crate must agree exactly on the bindgen ABI, so the
      # version comes from the lockfile rather than from whatever is newest.
      - name: Install wasm-bindgen-cli, matching the lockfile
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the analysis for the browser
        run: ./tools/build-wasm.sh

      - name: Generate the bindings
        run: wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/fun_refactor.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the playground
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check every link and asset the pages reference
        run: |
          cd docs
          status=0
          for page in *.html; do
            grep -oE '(href|src)="[^"#:]+"' "$page" \
              | sed -E 's/.*="([^"]+)"/\1/' \
              | while read -r target; do
                  # `playground/` is a directory the build produces; index.html inside
                  # it is checked separately below.
                  [ "$target" = "playground/" ] && continue
                  if [ ! -e "$target" ]; then
                    echo "$page references missing $target"
                    exit 1
                  fi
                done || status=1
          done
          test -f playground/index.html || { echo "the playground did not build"; status=1; }
          exit $status

      # So a stale site can be recognised as one. See docs/built.js.
      - name: Stamp what this was built from
        run: |
          printf 'export const BUILT = { commit: "%s", at: "%s" };\n' \
            "$(git rev-parse --short HEAD)" "$(date -u +%%Y-%%m-%%d)" > docs/built.js
          cat >> docs/built.js <<'JS'

          const target = document.getElementById("built");
          if (target) {
            target.textContent = `Built from ${BUILT.commit} on ${BUILT.at}.`;
          }
          JS
          sed -i 's/^          //' docs/built.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # Thirty minutes rather than the default ten. Five deploys in a row aborted with
      # "Timeout reached" while the deployment sat in `deployment_queued` — the build
      # was fine every time and the site simply went stale, which is the worst shape a
      # failure can take: green tests, a published site three commits behind, and
      # nothing saying so.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
