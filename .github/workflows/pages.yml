name: Pages

# The site lives in docs/. The playground under docs/playground is *built* — a
# WebAssembly module plus a Vite bundle — so it is not committed, and a change to
# anything it is built from has to trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'src/**'
      - 'crates/**'
      - 'queries/**'
      - 'wasm-shim/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/build-wasm.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The build holds no environment, so it starts the moment the push lands. This used
  # to be one job with the environment on it, which meant the whole thing — toolchain,
  # wasm, npm, Vite — sat in `waiting` behind the environment's rules before it had
  # checked anything out, and then held that environment for the fifteen minutes it
  # took to build. Deployments queued behind each other and timed out. GitHub documents
  # the split for exactly this reason.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      # Ubuntu's clang is an LLVM with every target enabled, including WebAssembly.
      # Apple's is not, which is why a Mac needs wasi-sdk and this does not.
      - name: Check clang can emit wasm
        run: clang --print-targets | grep -q wasm32

      - uses: Swatinem/rust-cache@v2

      # The generator and the crate must agree exactly on the bindgen ABI, so the
      # version comes from the lockfile rather than from whatever is newest.
      - name: Install wasm-bindgen-cli, matching the lockfile
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the analysis for the browser
        run: ./tools/build-wasm.sh

      - name: Generate the bindings
        run: wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/fun_refactor.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the playground
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check every link and asset the pages reference
        run: |
          cd docs
          status=0
          for page in *.html; do
            grep -oE '(href|src)="[^"#:]+"' "$page" \
              | sed -E 's/.*="([^"]+)"/\1/' \
              | while read -r target; do
                  # `playground/` is a directory the build produces; index.html inside
                  # it is checked separately below.
                  [ "$target" = "playground/" ] && continue
                  if [ ! -e "$target" ]; then
                    echo "$page references missing $target"
                    exit 1
                  fi
                done || status=1
          done
          test -f playground/index.html || { echo "the playground did not build"; status=1; }
          exit $status

      # So a stale site can be recognised as one. See docs/built.js.
      - name: Stamp what this was built from
        run: |
          {
            printf 'export const BUILT = { commit: "%s", at: "%s" };\n\n' \
              "$(git rev-parse --short HEAD)" "$(date -u +%Y-%m-%d)"
            printf 'const target = document.getElementById("built");\n'
            printf 'if (target) {\n'
            printf '  target.textContent = `Built from ${BUILT.commit} on ${BUILT.at}.`;\n'
            printf '}\n'
          } > docs/built.js
          cat docs/built.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # The only job that touches the environment, and the only thing in it. Nothing here
  # can be slow enough to matter, so a protection rule delays a publish and not a build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One publish at a time, and never cancel one in flight: a half-published site is
    # worse than a slightly stale one. On the *job* rather than the workflow, because
    # serialising the whole workflow serialised the build too — and a run wedged in
    # `waiting` then blocked every push behind it, which is how one stuck deployment
    # became a site that could not be updated at all.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Thirty minutes rather than the default ten. Six deploys in a row aborted with
      # "Timeout reached" while the deployment sat queued behind a build that was
      # holding the same environment.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
