name: Verified Java toolchain
description: Install Temurin 26.0.2.1 from its checksum-verified official archive
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/fr-temurin-26.0.2.1-linux-amd64.tar.gz
        key: java-archive-linux-amd64-451c12e68747bcfa2fb5a2c16b00483fedb9fa6d77bc962d30957f76ac17044d
    - name: Fetch and verify Java
      shell: bash
      run: |
        set -euo pipefail
        test "${RUNNER_OS}/${RUNNER_ARCH}" = Linux/X64
        java_archive="${RUNNER_TEMP}/fr-temurin-26.0.2.1-linux-amd64.tar.gz"
        java_destination="${RUNNER_TEMP}/fr-temurin-26.0.2.1"
        java_expected=451c12e68747bcfa2fb5a2c16b00483fedb9fa6d77bc962d30957f76ac17044d
        if [ ! -f "$java_archive" ]; then
          timeout 120 tools/fetch-verified-ranges.sh \
            'https://github.com/adoptium/temurin26-binaries/releases/download/jdk-26.0.2.1%2B1/OpenJDK26U-jdk_x64_linux_hotspot_26.0.2.1_1.tar.gz' \
            "$java_archive" "$java_expected" 144463785 8
        fi
        echo "$java_expected  $java_archive" | sha256sum -c -
        mkdir -p "$java_destination"
        tar -xzf "$java_archive" -C "$java_destination" --strip-components=1
        echo "${java_destination}/bin" >> "$GITHUB_PATH"
        echo "JAVA_HOME=${java_destination}" >> "$GITHUB_ENV"
        "$java_destination/bin/java" --version
        "$java_destination/bin/javac" --version
