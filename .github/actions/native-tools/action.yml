name: Native validation tools
description: Pinned validators and language runtimes for Ubuntu 24.04 amd64 checks
runs:
  using: composite
  steps:
    - uses: ./.github/actions/zig-toolchain
    - name: Cache the exact Ubuntu validator packages
      id: validator-packages
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/native-validator-packages
        key: native-validator-packages-ubuntu24-amd64-${{ hashFiles('.github/actions/native-tools/ubuntu-packages.txt') }}
    - name: Download the pinned packages within one shared deadline
      if: steps.validator-packages.outputs.cache-hit != 'true'
      shell: bash
      run: |
        timeout 120 bash -euo pipefail <<'BASH'
        validator_dir="$RUNNER_TEMP/native-validator-packages"
        mkdir -p "$validator_dir"
        while read -r validator_sha validator_url; do
          validator_archive="$validator_dir/${validator_url##*/}"
          echo "Downloading $validator_url"
          curl -fsSL --connect-timeout 20 --max-time 120 --max-filesize 5242880 \
            -o "$validator_archive" "$validator_url"
          echo "$validator_sha  $validator_archive" | sha256sum -c -
        done < .github/actions/native-tools/ubuntu-packages.txt
        BASH
    - name: Install verified local packages with downloads disabled
      shell: bash
      run: |
        set -euo pipefail
        test "$(dpkg --print-architecture)" = amd64
        validator_archives=()
        while read -r validator_sha validator_url; do
          validator_archive="$RUNNER_TEMP/native-validator-packages/${validator_url##*/}"
          echo "$validator_sha  $validator_archive" | sha256sum -c -
          validator_archives+=("$validator_archive")
        done < .github/actions/native-tools/ubuntu-packages.txt
        sudo env DEBIAN_FRONTEND=noninteractive timeout 240 dpkg --install \
          "${validator_archives[@]}"
        zsh --version
        xmllint --version
    - name: Install the validators the gate drives
      shell: bash
      run: |
        set -euo pipefail
        TERRAFORM=1.16.0
        TERRAFORM_SHA=41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3
        HELM=v4.2.4
        HELM_SHA=c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
        fetch() {
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 120 -o "$1" "$2" \
            || { echo "could not fetch $2 within the time allowed"; exit 1; }
        }
        fetch /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TERRAFORM}/terraform_${TERRAFORM}_linux_amd64.zip"
        echo "${TERRAFORM_SHA}  /tmp/terraform.zip" | sha256sum -c -
        sudo unzip -o -d /usr/local/bin /tmp/terraform.zip
        fetch /tmp/helm.tar.gz \
          "https://get.helm.sh/helm-${HELM}-linux-amd64.tar.gz"
        echo "${HELM_SHA}  /tmp/helm.tar.gz" | sha256sum -c -
        tar -xzf /tmp/helm.tar.gz -C /tmp
        sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
        terraform version
        zig version
        helm version --short
        shellcheck --version | head -2
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Cache the exact Python test wheels
      id: python-wheels
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/native-python-wheels
        key: native-python-wheels-linux-x64-cpython314-${{ hashFiles('.github/actions/native-tools/python-wheels.txt') }}
    - name: Download the pinned wheel files without index metadata
      if: steps.python-wheels.outputs.cache-hit != 'true'
      shell: bash
      run: >-
        timeout 120 python -m pip --disable-pip-version-check download
        --no-index --no-deps --only-binary=:all: --require-hashes
        --requirement .github/actions/native-tools/python-wheels.txt
        --dest "$RUNNER_TEMP/native-python-wheels"
    - name: Install Python checks and the FastAPI runtime fixture
      shell: bash
      run: |
        sed -E "s@https://files.pythonhosted.org/[^ ]*/@$RUNNER_TEMP/native-python-wheels/@" \
          .github/actions/native-tools/python-wheels.txt > "$RUNNER_TEMP/native-python-offline.txt"
        if grep -q 'https://' "$RUNNER_TEMP/native-python-offline.txt"; then
          echo 'Python installation requires local wheel paths only' >&2
          exit 1
        fi
        python -m pip install --no-index --no-deps --force-reinstall --require-hashes \
          --requirement "$RUNNER_TEMP/native-python-offline.txt"
        python -m pip check
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        package-manager-cache: false
    - uses: ./.github/actions/go-toolchain
    - uses: ./.github/actions/java-toolchain
    - name: Install the tutorial's TypeScript checker
      shell: bash
      run: npm ci --no-fund --no-audit
      working-directory: tests/typesafety/typescript
    - name: Install the Next.js migration runtime fixture
      shell: bash
      run: npm ci --no-fund --no-audit
      working-directory: tests/migration-runtime/nextjs-framework
    - name: Install the Express application runtime fixture
      shell: bash
      run: npm ci --no-fund --no-audit
      working-directory: tests/application-runtime/express
    - uses: ./.github/actions/lean-toolchain
