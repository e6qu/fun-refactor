[workspace]
members = [".", "crates/wasm-libc", "grammars/zig", "grammars/python", "grammars/go", "grammars/typescript", "grammars/scss", "grammars/sass"]

[package]
name = "fun-refactor"
version = "0.1.0"
edition = "2021"
authors = ["e6qu"]
license = "AGPL-3.0-or-later"
description = "Multi-language refactoring and code-intelligence CLI built on tree-sitter"
repository = "https://github.com/e6qu/fun-refactor"
# Reference material and derivation evidence, not build input. Compiling it would
# change the licence obligations — see vendor/README.md.
exclude = ["vendor/", "docs/"]

[lib]
name = "fun_refactor"
# `cdylib` for the browser build, `rlib` for the binary and the tests.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fr"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "lang-all"]
# Everything a terminal needs: argument parsing, walking a directory, a fact cache
# on disk, and threads. None of it exists in a browser, and none of it is needed to
# answer a question about source text that is already in memory.
cli = [
    "dep:clap",
    "dep:walkdir",
    "dep:ignore",
    "dep:rayon",
    "dep:sha2",
    "dep:tempfile",
    "dep:tracing-subscriber",
]
# One feature per grammar. Each is a C parse table of roughly a megabyte, which is
# most of a WebAssembly build's weight and none of a native build's concern — the
# terminal takes all of them, a browser can take the few it needs. A language whose
# grammar this build omits is still recognised by extension; the refusal names the
# build instead of pretending the file is unsupported.
lang-rust = ["dep:tree-sitter-rust"]
lang-go = ["dep:fun-refactor-go-grammar"]
lang-typescript = ["dep:fun-refactor-typescript-grammar"]
lang-python = ["dep:fun-refactor-python-grammar"]
lang-zig = ["dep:fun-refactor-zig-grammar"]
lang-java = ["dep:tree-sitter-java"]
lang-bash = ["dep:tree-sitter-bash"]
lang-html = ["dep:tree-sitter-html"]
lang-css = ["dep:tree-sitter-css"]
lang-scss = ["dep:fun-refactor-scss-grammar"]
lang-sass = ["dep:fun-refactor-sass-grammar"]
lang-hcl = ["dep:tree-sitter-hcl"]
lang-yaml = ["dep:tree-sitter-yaml"]
lang-xml = ["dep:tree-sitter-xml"]
lang-markdown = ["dep:tree-sitter-md-025"]
lang-json = ["dep:tree-sitter-json"]
lang-all = ["lang-rust", "lang-go", "lang-typescript", "lang-python", "lang-zig", "lang-java", "lang-bash", "lang-html", "lang-css", "lang-scss", "lang-sass", "lang-hcl", "lang-yaml", "lang-xml", "lang-markdown", "lang-json"]

# The analysis core, compiled for the browser. See src/wasm.rs.
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:serde-wasm-bindgen", "dep:fun-refactor-wasm-libc"]

[dependencies]
# Tree-sitter parsing. Grammar pins inherited from funveil (github.com/e6qu/funveil
# @ 2b9a47408e3419ce0061a2c9a2dd5f1efc11f4ba) — a known-good, mutually compatible set.
tree-sitter = "0.26"
fun-refactor-zig-grammar = { path = "grammars/zig", optional = true }
fun-refactor-python-grammar = { path = "grammars/python", optional = true }
fun-refactor-go-grammar = { path = "grammars/go", optional = true }
fun-refactor-typescript-grammar = { path = "grammars/typescript", optional = true }
# SCSS has its own grammar: the CSS one has no rule for $variables, @mixin or
# @include, so SCSS parsed as CSS is mostly parse errors (was BUGS.md B1).
fun-refactor-scss-grammar = { path = "grammars/scss", optional = true }
# Sass has two syntaxes. The indented one is not SCSS: every block and every statement
# ends differently, so it has a grammar of its own (was BUGS.md B283).
fun-refactor-sass-grammar = { path = "grammars/sass", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-hcl = { version = "1.1", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
# The maintained grammar from tree-sitter-grammars/tree-sitter-markdown. Its
# predecessor (tree-sitter-markdown-fork 0.7) abort()s inside its C++ inline scanner
# on wide tables, which no in-process handler can catch. This one splits block and
# inline parsing into two languages, which src/parse.rs stitches back together.
tree-sitter-md-025 = { version = "0.5", optional = true }
streaming-iterator = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.6", features = ["derive"], optional = true }
thiserror = "2.0"
anyhow = "1.0"
walkdir = { version = "2.5", optional = true }
ignore = { version = "0.4", optional = true }
regex = "1.12"
sha2 = { version = "0.10", optional = true }
petgraph = "0.8"
postcard = { version = "1.1", features = ["alloc"] }
rayon = { version = "1.11", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
similar = "2.6"

# Browser bindings, only compiled for the wasm target.
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tempfile = { version = "3.27", optional = true }

# Linked only into the browser build, where the grammars' C has no libc to call.
#
# `version` has to be here. `release-please` gives every workspace member the root's
# version, and its rewrite of a `target.*` dependency writes to a `version` key without
# checking for one first. Absent, the release job fails on the first release.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fun-refactor-wasm-libc = { version = "0.1.0", path = "crates/wasm-libc", optional = true }

[dev-dependencies]
# Also an optional runtime dependency (the edit engine stages through it); tests need
# it unconditionally, including when the crate is built without the `cli` feature.
tempfile = "3.27"
rstest = "0.26"
assert_cmd = "2.2"
predicates = "3.1"

[lints.rust]
unsafe_code = "forbid"

