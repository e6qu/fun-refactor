# TypeScript / TSX entry points, including Next.js file conventions.
- id: ts-nextjs-page
  kind: http-route
  threat_model: remote
  languages: [typescript, tsx]
  matches:
    file_name: page.tsx
    exported: true

- id: ts-nextjs-layout
  kind: http-route
  threat_model: remote
  languages: [typescript, tsx]
  matches:
    file_name: layout.tsx
    exported: true

- id: ts-nextjs-route-handler
  kind: http-route
  threat_model: remote
  languages: [typescript, tsx]
  matches:
    file_name: route.ts
    exported: true

- id: ts-app-component
  kind: exported-api
  languages: [typescript, tsx]
  matches:
    name: App
    exported: true

- id: ts-test
  kind: test
  languages: [typescript, tsx]
  matches:
    file_suffix: .test.ts

- id: ts-spec
  kind: test
  languages: [typescript, tsx]
  matches:
    file_suffix: .spec.ts

- id: ts-handler-suffix
  kind: http-route
  threat_model: remote
  languages: [typescript, tsx]
  matches:
    name_suffix: Handler
    exported: true

# A Next.js server action: an exported function the framework makes reachable over the
# network, called by nothing in the source. The same case as Java's `@RestController` and
# pytest's fixtures — and unlike Next.js's other conventions it is not a filename, so no
# `file_name` rule can find it. `components/cart/actions.ts` is an ordinary name.
- id: ts-nextjs-server-action
  kind: http-route
  threat_model: remote
  languages: [typescript, tsx]
  matches:
    file_directive: use server
    exported: true
