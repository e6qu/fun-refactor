- id: java-kafka-listener
  kind: queue-consumer
  threat_model: remote
  languages: [java]
  matches:
    annotated_with: KafkaListener

- id: java-rabbit-listener
  kind: queue-consumer
  threat_model: remote
  languages: [java]
