# Rust entry points.
- id: rust-main
  kind: cli-main
  threat_model: local
  languages: [rust]
  matches:
    name: main
    symbol_kind: function

- id: rust-test-fn
  kind: test
  languages: [rust]
  matches:
    name_prefix: test_
    symbol_kind: function

# How a Rust test actually declares itself. ripgrep's are named `backslash`, `tab`
# and `carriage`; no naming rule would find them.
- id: rust-test-attribute
  kind: test
  languages: [rust]
  matches:
    annotated_with: test
    symbol_kind: function

- id: rust-bench-attribute
  kind: test
  languages: [rust]
  matches:
    annotated_with: bench
    symbol_kind: function

- id: rust-test-module-fn
  kind: test
  languages: [rust]
  matches:
    file_suffix: _test.rs
    symbol_kind: function

- id: rust-integration-test
  kind: test
  languages: [rust]
  matches:
    path_contains: tests/
    symbol_kind: function

- id: rust-public-api
  kind: exported-api
  languages: [rust]
  matches:
    path_contains: lib.rs
    exported: true
