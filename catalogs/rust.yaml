# Rust entry points.
- id: rust-main
  kind: cli-main
  threat_model: local
  languages: [rust]
  matches:
    name: main
    symbol_kind: function

- id: rust-test-fn
  kind: test
  languages: [rust]
  matches:
    name_prefix: test_
    symbol_kind: function

# How a Rust test actually declares itself. ripgrep's are named `backslash`, `tab`
# and `carriage`; no naming rule would find them.
- id: rust-test-attribute
  kind: test
  languages: [rust]
  matches:
    annotated_with: test
    symbol_kind: function

- id: rust-bench-attribute
  kind: test
  languages: [rust]
  matches:
    annotated_with: bench
    symbol_kind: function

- id: rust-test-module-fn
  kind: test
  languages: [rust]
  matches:
    file_suffix: _test.rs
    symbol_kind: function

- id: rust-integration-test
  kind: test
  languages: [rust]
  matches:
    path_contains: tests/
    symbol_kind: function

- id: rust-public-api
  kind: exported-api
  languages: [rust]
  matches:
    path_contains: lib.rs
    exported: true

# actix-web and Rocket both put the method on the handler as an attribute. `rust-public-api`
# covers a handler that happens to be `pub` in `lib.rs`; most handlers are neither.
#
# These were saved only by coincidence before: `#[get("/health")]` above `fn health` spells
# the symbol's own name in a string literal, and `fr unused` skips those. Rename the route
# to `/up` and the handler reads as dead.
- id: rust-route-get
  kind: http-route
  threat_model: remote
  languages: [rust]
  matches:
    annotated_with: get

- id: rust-route-post
  kind: http-route
  threat_model: remote
  languages: [rust]
  matches:
    annotated_with: post

- id: rust-route-put
  kind: http-route
  threat_model: remote
  languages: [rust]
  matches:
    annotated_with: put

- id: rust-route-patch
  kind: http-route
  threat_model: remote
  languages: [rust]
  matches:
    annotated_with: patch

- id: rust-route-delete
  kind: http-route
  threat_model: remote
  languages: [rust]
  matches:
    annotated_with: delete

# The JavaScript side calls it; no Rust caller exists anywhere in the crate.
- id: rust-wasm-bindgen
  kind: exported-api
  threat_model: none
  languages: [rust]
  matches:
    annotated_with: wasm_bindgen
